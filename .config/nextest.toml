# Nextest configuration (SRD-less; operational only).
#
# Why nextest here at all: cargo's libtest runner executes test BINARIES
# sequentially, so workspace wall time is the SUM of suite times (~120s, of
# which three example-sweep suites are 69%). Nextest schedules per-test
# across binaries, so wall time compresses toward the longest individual
# tests instead.

[profile.default]
# One failing test should not hide the rest of the picture — mirrors the
# --no-fail-fast habit this workspace already needed (a cassandra-cpp
# timeout used to truncate the run and report `passed=13`).
fail-fast = false

# Long example sweeps are legitimate; say so instead of killing them.
# (Warn at 60s, but never terminate: period without terminate-after only
# reports.)
slow-timeout = { period = "60s" }

[[profile.default.overrides]]
# The cassandra-cpp driver's integration tests talk to the LIVE node and
# time out spuriously while a heavy compaction is in flight (observed:
# LIB_REQUEST_TIMED_OUT across six tests, all passing minutes later).
# Retry those twice before calling them failed; everything else stays
# no-retry so a real regression fails loudly the first time.
filter = "package(cassandra-cpp)"
retries = 2
