[package]
description = "A Cassandra CQL driver, built on top of the DataStax C++ driver for performance and functionality."
documentation = "https://docs.rs/cassandra-cpp"
# no homepage yet
repository = "https://github.com/cassandra-rs/cassandra-rs"
readme = "README.md"
keywords = [ "Cassandra", "binding", "CQL", "client", "database" ]
categories = [ "api-bindings", "database", "external-ffi-bindings", "asynchronous" ]
license = "Apache-2.0"
name = "cassandra-cpp"
version = "3.0.2"
authors = ["Keith Wansbrough <keithw@lochan.org>"]
edition = "2018"
# Vendored fork of upstream cassandra-cpp 3.0.2 with the
# trace_id retrieval surface added (see CHANGES.local.md).
# Must NEVER be published to crates.io: the name + version
# collide with the real `cassandra-cpp` crate we don't own,
# and forks belong in vendor/, not on the public index.
publish = false

# This is a vendored fork tracked against the upstream DataStax
# C++ driver wrapper (see CHANGES.local.md). Its body is kept close
# to upstream so future re-syncs stay cheap, so upstream's clippy
# debt is not ours to relitigate site-by-site. Silence clippy for
# the whole package (lib + examples + tests) in one place rather
# than churning ~240 lint fixes into a fork we rebase; our own
# crates stay lint-gated.
[lints.clippy]
all = "allow"

[dependencies]
slog = { version = "2", optional = true }
log = { version = "0.4.17", optional = true }
cassandra-cpp-sys = "1.1.1"
uuid = "1.0"
error-chain = "0.12"
parking_lot = "0.12"
libc = "0.2"
bigdecimal = "0.4.2"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "test-util"] }
futures = "0.3.1"
logtest = "2.0.0"

[features]
default = ["slog", "log"]
early_access_min_tls_version = ["cassandra-cpp-sys/early_access_min_tls_version"]
