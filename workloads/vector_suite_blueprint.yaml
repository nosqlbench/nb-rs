#!/usr/bin/env nbrs
# vector_suite_blueprint.yaml — the vector_suite BLUEPRINT
# (SRD-108 Part B): the protocol-agnostic contract for the
# suite's search-performance core.
#
# A blueprint owns everything measurement-shaped: extents,
# concurrency, tier governance, provenance classes (SRD-106),
# dataset access, relevancy scoring, and the typed interfaces the
# protocol must satisfy. It knows NOTHING about any wire protocol
# — every op is an `abstract:` slot. An implementation module
# binds the bodies:
#
#   nbrs run workload=cql/vector_suite_cql scenario=search_perf
#   nbrs run workload=vector_suite_blueprint \
#            impl=cql/vector_suite_cql scenario=search_perf
#
# This file lives in the NEUTRAL bundled catalog (top-level
# `vector_suite_blueprint`), not under any adapter: SRD-109 web
# drivers implement it from binaries that may not carry the CQL
# feature at all. Implementations reference it by catalog name.
#
# Scope note: this blueprint covers the search-performance core
# (connect → teardown → schema → load → build-wait → serial →
# sweep). The full suite (streaming, churn, capacity, filtered
# grid) remains in cql/vector_suite; sections migrate here as
# further implementations land.
#
# Interface conventions (the three legs, SRD-108 + SRD-109):
# - `needs` are wires THIS document guarantees — dataset-derived
#   bindings (query vectors, ids, dims) and declared params.
# - `yields` are wires the implementation must deliver via
#   captures.
# - `results` are wires the implementation must deliver by
#   projecting the response body via `result:` bindings (SRD-70
#   `[*]` column projection) — the probes' relevancy scoring
#   reads them as typed values.

stick_session: true

description: |
  Vector search-performance blueprint (protocol-agnostic): measured
  bulk load under tier governance, index-readiness wait, serial
  recall+ndcg on the quiesced target, then a concurrency sweep
  with relevancy computed per op at every level.

params:
  # ── Dataset + profile selection (logical: dataset access is
  # protocol-agnostic).
  dataset: example
  fknn_profile: default

  # ── Tier governance (SRD-106 out-of-range semantics).
  load_timeout: "2.5h"
  build_timeout: "15m"

  # ── Probe shape: k-recall@r — intersect over r, divide by k.
  suite_k: "10"
  suite_limit: "100"
  min_query_ms: 10000

  # ── Sweep levels + per-level budget.
  conc_levels: "1, 5, 10, 20, 40, 80"
  level_ms: "30000"

  # ── Load concurrency.
  concurrency: "100"

scenarios:
  search_perf:
    - for: "profile in {fknn_profile}, table in vsuite_{profile}"
      phases:
        - connect
        - teardown
        - schema
        - load_train
        - await_index
        - serial_probe
        - for: "conc in {conc_levels}"
          phases:
            - sweep_probe

phases:

  # Session establishment — the protocol's login/handshake leg
  # (SRD-109 auth flows bind here: a web driver's login op
  # captures its token into a shared wire its later ops read;
  # CQL binds a lightweight liveness statement). Always runs:
  # session credentials are in-memory state, never skippable.
  connect:
    concurrency: 1
    cycles: 1
    ops:
      establish:
        abstract: {}

  # Destructive reset of this suite's own namespace. Never
  # skip-eligible.
  teardown:
    concurrency: 1
    ops:
      drop_metadata_index:
        abstract: {}
      drop_vector_index:
        abstract: {}
      drop_table:
        abstract: {}

  # Idempotent DDL (SRD-106 prereq class). `dim` and the distance
  # function come from the dataset — the implementation renders
  # them into its own DDL dialect.
  schema:
    checkpoint: idempotent
    concurrency: 1
    bindings: |
      dim := vector_dim("{dataset}:{profile}")
      similarity_function := dataset_distance_function("{dataset}:{profile}")
    ops:
      create_keyspace:
        abstract: {}
      create_table:
        abstract:
          needs:
            dim: u64
      create_vector_index:
        abstract:
          needs:
            similarity_function: String
      create_metadata_index:
        abstract: {}

  # The measured bulk load: deterministic keyed rows from the
  # dataset (idempotent upsert — SRD-106 prereq class; SRD-107
  # scopes its skip validity to the params it consumes). The
  # always-run await_index that follows validates that a skipped
  # load actually left a queryable target.
  load_train:
    checkpoint: idempotent
    concurrency: "{concurrency}"
    timeout: "{load_timeout}"
    errors: "count,retry"
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      cursor row = range(0, vector_count(prebuffered))
      id := format_u64(row, 12)
      train_vector := vector_at(prebuffered, row)
      volatile now_ms := current_epoch_millis()
    metrics:
      insert_seconds:
        kind: gauge
        value: "(now_ms - phase_start) / 1000"
    ops:
      insert:
        abstract:
          needs:
            id: String
            train_vector: vec_f32

  # Build/readiness wait. The poll predicate and its governance
  # bound are logical; the implementation delivers the polled
  # count as a typed yield (a capture) — the poll's metric IS the
  # indexed-readiness delay. Deliberately NOT skip-eligible: this
  # is the runtime validation that skipped loads left settled,
  # queryable state (SRD-106).
  await_index:
    concurrency: 1
    timeout: "{build_timeout}"
    poll:
      until: "active_build_tasks == 0"
      interval_ms: 2000
      timeout_ms: 86400000
      metric_name: build_time_s
      on_timeout: error
    ops:
      pending_build_work:
        abstract:
          yields:
            active_build_tasks: u64

  # Serial probe on the quiesced target: concurrency 1, recall +
  # ndcg per op, time-bounded by natural extent. The result-shape
  # contract is TYPED (SRD-109 Part 3): the implementation
  # projects the matched row keys into the `keys` wire via a
  # `result:` binding; relevancy reads the typed projection.
  serial_probe:
    concurrency: 1
    status_metrics: [recall*, ndcg*]
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      const query_counts := query_count(prebuffered)
      cursor q = until_elapsed(query_counts, min_query_ms)
      query_vector := query_vector_at(prebuffered, q % query_counts)
      ground_truth := neighbor_indices_at(prebuffered, q % query_counts)
    ops:
      select_ann:
        abstract:
          needs:
            query_vector: vec_f32
          results:
            keys: vec_i64
        evaluations:
          relevancy:
            actual: keys
            expected: ground_truth
            k: suite_k
            r: suite_limit
            functions:
              - recall
              - ndcg

  # One sweep level at `concurrency: {conc}` for `level_ms` of
  # whole passes; relevancy per op at this operating point, so the
  # recall-vs-throughput curve is measured, not interpolated.
  # Same typed result-shape contract as serial_probe.
  sweep_probe:
    concurrency: "{conc}"
    status_metrics: [recall*, ndcg*]
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      const query_counts := query_count(prebuffered)
      cursor q = until_elapsed(query_counts, level_ms)
      query_vector := query_vector_at(prebuffered, q % query_counts)
      ground_truth := neighbor_indices_at(prebuffered, q % query_counts)
    ops:
      select_ann:
        abstract:
          needs:
            query_vector: vec_f32
          results:
            keys: vec_i64
        evaluations:
          relevancy:
            actual: keys
            expected: ground_truth
            k: suite_k
            r: suite_limit
            functions:
              - recall
              - ndcg
