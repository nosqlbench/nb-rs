# optimizer_saturation.yaml — SRD-86 *causal* optimizer test (non-degenerate)
#
# Unlike optimizer_sweep (whose objective is a pure function of the
# coordinate, so it can't distinguish a pre- from a post-execution read), this
# objective reads a RUN-PRODUCED metric: the testkit backend's saturation error
# rate. That rate exists only *after* the phase executes, so the objective value
# is causally produced by running the phase at each coordinate.
#
# The search axis is `conc` — the phase's concurrency, which nb-rs exposes as a
# dynamic control (SRD-23). Against a fixed 2-server / queue-depth-4 backend,
# high concurrency overruns the queue and rejects ops with Overload (high error
# rate); low concurrency fits (zero overloads). So `score = -err_rate` is
# maximized (0) at the LOWEST concurrency. The axis is ordered high→low so the
# optimum (conc=2) is the LAST coordinate, not the first.
#
# This is the causal oracle: a setup-time objective read sees err_rate=0 for
# every coordinate (nothing has run) and picks the FIRST (conc=32); only a
# post-execution read sees the real, run-produced error rate and picks conc=2.
#
# Usage (runs standalone):
#   nbrs run workload=examples/workloads/optimizer_saturation.yaml \
#       --session-path /tmp/opt-sat

description: |
  SRD-86 causal optimizer search: the objective reads a run-produced testkit
  saturation metric (error rate), so its value is produced by executing the
  phase. The optimizer searches the concurrency (a dynamic control) and finds
  the value that eliminates backend overloads.

phases:
  saturate:
    cycles: 12000
    # The search axis: concurrency, a dynamic control (SRD-23). Each evaluation
    # re-runs the phase at this concurrency (coordinate / step-through).
    concurrency: "{conc}"
    # Paced so each coordinate spans several 1s metrics-cadence pulses — the
    # SRD-86 settle detector reads the windowed overload rate per pulse. The
    # rate exceeds the backend's 2-server / 5ms capacity (~400/s), so high
    # concurrency still saturates the queue and rejects with Overload.
    rate: 2000
    # Overload errors are load feedback, not run failures — don't stop on them.
    errors: warn
    error_rate_max: 1.0
    for_each: "conc in 32, 16, 2"
    optimize:
      objective: score
      max_evals: 10
      # No `steer:` → `conc` steps through by re-running the phase per value
      # (coordinate, the default). That's required here: the objective is a
      # session-cumulative `metric(...)` read that can't isolate a live setting,
      # so each value needs its own phase run.
    bindings: |
      input cycle: u64
      # The run-produced signal: the testkit backend's overload error rate.
      err_rate := metric("errors", "rate")
      # Maximize -err_rate: the concurrency with fewest overloads wins.
      score := 0 - err_rate
    ops:
      insert:
        adapter: testkit
        stmt: "INSERT INTO demo.events (id) VALUES ({cycle});"
        # A fixed saturating backend: 2 servers, 5ms each, queue depth 4. Past
        # ~4 in-flight ops it returns Overload — so high concurrency saturates.
        result-latency: "5ms"
        result-capacity: 2
        result-overload: 4
