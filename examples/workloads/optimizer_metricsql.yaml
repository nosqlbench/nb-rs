# optimizer_metricsql.yaml — SRD-86 settling objective read via metricsql_scalar
#
# The companion to optimizer_saturation.yaml: the SAME causal search, but the
# objective is read through the `metricsql_scalar` reader node (a MetricsQL
# query over this run's live metrics) instead of the `metric(...)` stat-reader.
#
# It exercises the whole metric-reader + settle surface end to end:
#   - metricsql_scalar evaluates `sum(rate(errors_total[3s]))` against this
#     run's live in-process metrics (SRD-40c queryapi → MetricsQueryAccess);
#   - the value is VOLATILE (re-read every pull) and run-produced, so the
#     one-shot post-completion read cannot capture it;
#   - the SRD-86 cadence-fed settle detector samples it per cadence pulse and
#     holds it as the objective.
#
# `errors_total` is a CUMULATIVE counter (Prometheus/VM-schematic), session-
# monotonic across coordinates. MetricsQL `rate(...[3s])` is the correct way to
# read its per-coordinate rate: rate()'s `last − first` difference cancels the
# cumulative baseline carried over from the prior coordinate, and the 3s window
# sits within the coordinate by the time the detector settles. (This is the
# range-rollup path the cumulative-counter model makes PromQL-correct.)
#
# The search axis is concurrency against a fixed 2-server / queue-depth-4
# backend: high concurrency overruns the queue and rejects ops with Overload
# (high error rate); low concurrency fits (≈ zero). `score = -err_rate` is
# maximized (≈ 0) at the LOWEST concurrency. The axis is ordered high→low so the
# optimum (conc=2) is the LAST coordinate, not the first.
#
# Runs standalone:
#   nbrs run workload=examples/workloads/optimizer_metricsql.yaml \
#       --session-path /tmp/opt-mq

description: |
  SRD-86 causal optimizer search whose objective is a MetricsQL query
  (`sum(rate(errors_total[3s]))`) read through the metricsql_scalar reader node
  and settled across the run by the cadence-fed detector — exercising the
  metric-reader + cumulative-counter rate() surface as a live optimizer objective.

phases:
  saturate:
    cycles: 9000
    concurrency: "{conc}"
    # Paced so each coordinate spans several 1s metrics-cadence pulses — the
    # settle detector reads the windowed objective per pulse. The rate exceeds
    # the backend's 2-server / 5ms capacity (~400/s), so high concurrency still
    # saturates the queue and rejects with Overload.
    rate: 2000
    # Overload errors are load feedback, not run failures — don't stop on them.
    errors: warn
    error_rate_max: 1.0
    for_each: "conc in 32, 16, 2"
    optimize:
      objective: score
      max_evals: 10
      # No `steer:` → `conc` steps through by re-running the phase (coordinate, the
      # default) — demonstrating the phase-RERUN actuation with a settled
      # run-produced objective. The live-steer form (`steer: conc`) is
      # optimizer_control.yaml.
    bindings: |
      input cycle: u64
      # The run-produced signal, read through the MetricsQL engine over this
      # run's live metrics: the windowed Overload error RATE. Counters are
      # stored CUMULATIVE (Prometheus/VM-schematic), so rate() computes the
      # true per-second increase; the cumulative baseline carried over from
      # the prior coordinate cancels in rate()'s difference, so the value is
      # per-coordinate.
      err_rate := metricsql_scalar("sum(rate(errors_total[3s]))")
      # Maximize -err_rate: the concurrency with fewest overloads wins.
      score := 0 - err_rate
    ops:
      insert:
        adapter: testkit
        stmt: "INSERT INTO demo.events (id) VALUES ({cycle});"
        # A fixed saturating backend: 2 servers, 5ms each, queue depth 4. Past
        # ~4 in-flight ops it returns Overload — so high concurrency saturates.
        result-latency: "5ms"
        result-capacity: 2
        result-overload: 4
