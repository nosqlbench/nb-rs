# A poll condition that bounds its own patience.
#
# `until:` normally describes the observed world. That makes any
# assert-something-happened predicate unsafe on its own: if the thing is never
# observed, the poll waits out `timeout_ms`. The compaction drain in
# adapters/cql/workloads/compaction_demo_derived.yaml hit exactly that — its
# timeout is 48 hours.
#
# The poll wrapper publishes `poll_elapsed_ms` (and `poll_count`) as wires each
# iteration, so a condition can carry its own escape clause. This workload is
# the regression pin for that mechanism, and for two ways it silently breaks:
#
#   1. THE THRESHOLD MUST BE A TYPED BINDING, NOT A WORKLOAD PARAM. Params
#      reach polydat as STRINGS, so `poll_elapsed_ms >= some_param` compares a
#      u64 against a string, is never true, and the escape never fires. The
#      poll then waits on a condition that cannot become satisfiable — which is
#      indistinguishable from a deadlock while it happens.
#   2. `const name := value` IS NOT ACCEPTED in an op-level bindings block. It
#      parses as a wire reference named "const" and fails at EXECUTION, not at
#      parse — dryrun does not catch it. A plain `name := value` is the form
#      that works here.
#
# The condition below can only ever be satisfied by the elapsed escape: the
# left arm is a literal false. So if the mechanism regresses, this workload
# does not merely slow down — it runs until `timeout_ms` and fails the check.
#
#@ run cycles=1
#@ expect 0 failed

params:
  adapter: stdout

phases:
  bounded_wait:
    cycles: 1
    ops:
      waits:
        adapter: stdout
        readout: visible
        stmt: "tick"
        bindings: |
          # Typed binding, not a param — see note 1 above.
          evidence_ms := 1500
          # Published by the poll wrapper before each predicate evaluation.
          extern poll_elapsed_ms: u64 = 0
          extern poll_count: u64 = 0
        poll:
          # never_true || elapsed-escape. Only the escape can end this poll.
          until: "(1 == 2) || poll_elapsed_ms >= evidence_ms"
          interval_ms: 250
          # Generous relative to evidence_ms: reaching it means the escape
          # failed, and the check fails rather than passing slowly.
          timeout_ms: 30000
        measure: "{poll_count} polls {poll_elapsed_ms}ms"
