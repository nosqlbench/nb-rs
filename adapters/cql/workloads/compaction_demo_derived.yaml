# ---------------------------------------------------------------------------
# Reports. Rendered from the SESSION DB, which is written continuously, so the
# same command gives the same view during a run and after it — the view is a
# function of recorded state, not of run lifecycle. `nbrs table compaction_shape`
# mid-run shows every tier finished so far; the in-flight tier appears with a
# zero duration (its cycle has not closed yet) and therefore an infinite rate,
# which is the honest rendering of "not finished" rather than a guess.
# ---------------------------------------------------------------------------
report:
  compaction_shape_section: |
    file compaction_shape.md as 'Compaction shape and throughput per tier'

    text compaction_shape_heading as "What this shows":
     One row per size tier, in tier order. `segments` is how many vector-index
     sstables the tier's major compaction merged — the K in cost-over-K, and the
     number that separates "one big source plus a tail of flush segments" from
     "a dozen equal ones". `vector_index_bytes` and `sai_shared_bytes` are the
     merged input sizes. `duration_ms` is the
     finalize phase's cycle service time, which spans flush through drain.
     `index_bytes_per_ms` is achieved throughput over that span.

     Read K against throughput: at fixed segment count the per-byte rate should
     hold, and where it falls off with size the merge has left the page cache
     and gone IO-bound.

    table compaction_shape:
      group_by: p
      query: segments: max(compaction_input_segments) by (p)
      query: vector_index_bytes: max(compaction_input_index_bytes) by (p)
      query: sai_shared_bytes: max(compaction_input_table_bytes) by (p)
      # Rollups are wrapped in min()/max(): `by (p)` groups an AGGREGATION, and a
      # bare rollup keeps every label, so an unwrapped t*_over_time silently fails
      # to align with the aggregated columns it is combined with.
      # WHEN each tier ran. `started` is the instance's first emission, which is
      # when that tier's compaction began. `last_progress` is the last time the
      # value MOVED -- not the last sample, because every instance keeps being
      # re-sampled at its final value until the run ends, so "last sample" is the
      # end of the run for every tier and says nothing. A tier whose last_progress
      # is recent and whose done_pct is below 100 is the one still running.
      query: started: min(tfirst_over_time(compaction_completion_ratio[7d])) by (p)
      query: last_progress: max(tlast_change_over_time(compaction_completion_ratio[7d])) by (p)
      # How long this tier has been going, as of the most recent activity ANYWHERE
      # in the run -- which, for the tier currently working, is now.
      #
      # The lookback must outlast the sweep: a tier whose start falls outside the
      # window would report the window edge instead, silently understating its age.
      # 7d covers a full 36-tier run with room to spare; the execution qualifier
      # keeps earlier executions in the same session out of it.
      #
      # Deriving it from the tier's own samples does not work: that gives
      # last-change minus first-sample, which is quantised to the metrics cadence
      # and, for a tier less than one tick old, is exactly zero because no CHANGE
      # has been recorded yet. The tier that just started is precisely the one an
      # operator is watching, and it read 0.0s.
      #
      # `on() group_right()` broadcasts the single global maximum across the
      # per-tier starts; without an explicit empty-on() join an unlabeled series
      # matches no labeled one and the whole column comes back empty.
      #
      # The global term is the latest SAMPLE, not the latest change: every instance
      # is re-sampled each tick, so the newest sample anywhere is "now" to within
      # one tick. Using the latest change here read 0.0s on the tier that had just
      # started, because a series with no change yet reports its own first sample
      # and that then won the maximum.
      #
      # For a FINISHED tier this is its age rather than its duration -- read
      # finalize_ms for that, which is exact. For the tier still running it is the
      # elapsed time, accurate to the second.
      query: running_for: max(tlast_over_time(compaction_progress_parts[7d])) - on() group_right() min(tfirst_over_time(compaction_completion_ratio[7d])) by (p)
      query: done_pct: 100 * max(compaction_completion_ratio) by (p)
      query: parts_done: max(compaction_progress_parts) by (p)
      query: parts_total: max(compaction_total_parts) by (p)
      # Throughput over elapsed-so-far, so a running tier reports the rate it is
      # achieving now instead of nothing. For a finished tier this equals the
      # completed rate; `finalize_ms` is kept beside it as the completion-time
      # figure, blank until the tier closes.
      # Two throughput figures, because they answer different questions and only one
      # of them exists while a tier is still working:
      #   index_bytes_per_ms  completion-time rate, exact, blank until the tier ends
      #   live_bytes_per_ms   work done so far over running_for, available at once
      # On the long-running tier this table exists to measure, the live figure is
      # the only rate there is.
      query: index_bytes_per_ms: max(compaction_input_index_bytes) by (p) / max(time_to_index) by (p)
      query: live_bytes_per_ms: max(compaction_progress_parts) by (p) / (1000 * (max(tlast_over_time(compaction_progress_parts[7d])) - on() group_right() min(tfirst_over_time(compaction_completion_ratio[7d])) by (p)))
      query: finalize_seconds: max(cycles_servicetime_mean{phase="finalize_index"}) by (p)
      query: finalize_ms: max(time_to_index) by (p)
