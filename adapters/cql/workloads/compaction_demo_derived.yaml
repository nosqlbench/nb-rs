#!/usr/bin/env nbrs
# Incremental profile-sweep compaction recall test (derived from
# compaction_demo.yaml).
#
# Instead of loading a single profile of a dataset, this workload walks
# the dataset's profiles as SIZE TIERS, lowest-numbered (smallest) first,
# and at each tier:
#   1. loads ONLY the incremental vectors since the previously loaded
#      tier  (`range(prev_count, this_count)`),
#   2. flushes + major-compacts (the compaction-demo behaviour), and
#   3. runs a recall check against THAT tier's own ground-truth set.
# It stops at the configured maximum size (`max_size`) or the last
# profile, whichever comes first.
#
# The sweep is a cursor-PARTITION comprehension (SRD-71):
#   - `profile_partitions("{dataset}", "{profile_pattern}")` partitions
#     the dataset's vector space by the profiles matching the pattern,
#     treated as cumulative size tiers in ascending order. Each partition
#     `p` spans `[previous tier size, this tier size)` — the incremental
#     range — so `range(start_of(p), end_of(p))` loads ONLY the delta. A
#     partition carries its own start, so no cross-iteration carry is
#     needed.
#   - `profile_pattern` follows the literal / glob / regex promotion
#     (`pattern_match`): `*m` and `*mi` select different suffix series so
#     their progressions aren't mixed.
#   - per-tier ground truth: name the tier with
#     `matching_profile_name_at(..., idx_of(p))`, prebuffer its own
#     facets, and recall with `query_vector_at` / `neighbor_indices_at`.
#   - `continue_if: "end_of(p) <= effective_max_size"` (SRD-101) caps the
#     sweep: a pre-entry gate on the tier loop stops BEFORE the first tier
#     whose cumulative size would exceed the cap (sizes ascend; the last
#     in-budget profile is the natural end), ending the sweep gracefully.
#     `effective_max_size` defaults to the dataset's full base-vector count
#     (`max_size=0`); a positive `max_size` caps below it.
#
# A dataset with only the default profile yields a single tier (one full
# load + recall). A dataset with multiple profiles uses the matching
# tiers instead, smallest first.
#
# Usage:
#   nbrs workload=compaction_demo_derived.yaml host=10.0.0.1
#   nbrs workload=compaction_demo_derived.yaml max_size=500000

description: |
  Incremental profile-sweep compaction recall test: walk a dataset's
  profiles as size tiers (smallest first), load only the incremental
  vectors at each tier, flush + major-compact, and measure ANN recall
  against that tier's ground truth — up to a configured max size or the
  last profile. Derived from compaction_demo.yaml; requires a
  vector-capable CQL target, a Jolokia agent on :8778, and a local
  vector dataset catalog.

params:
  # `tries` = TOTAL attempts per op on retryable errors (SRD-82: the sigil
  # for the conditional tries wrapper). Root 20 — inherited by the
  # data-plane and orchestration phases. The non-iterative setup phases
  # (teardown / schema / tune_cluster) pin `tries: 1` explicitly: their
  # statements are one-shot DDL / control calls where a retry burns minutes
  # on something that will never succeed (the teardown truncate on a first
  # run) or is simply pointless to repeat.
  #
  # `timeout` is NOT set at the root: a root timeout would override each
  # op's own request timeout, clobbering the long-running orchestration ops
  # (flush / compaction). Instead the read/write ops set `timeout: 60s`
  # themselves (below); the orchestration ops keep their own longer
  # request_timeout_ms.
  tries: 20
  # `connect_timeout` = how long the driver waits to ESTABLISH a connection
  # (the control connection + each per-host connect). The cassandra-cpp default
  # (5s) is too short for a distant / cold / slow-to-accept cluster — a control-
  # connection `Connection timeout` is exactly that boundary expiring. 5 minutes
  # is deliberately generous so a loaded or just-starting cluster still connects;
  # drop it on the CLI (`connect_timeout=30s`) for a nearby cluster.
  connect_timeout: 5m
  # ── Connection-survival knobs (cassandra-cpp engine) ─────────
  # During a server stall (GC pause / compaction storm) heartbeats go
  # unanswered; once a connection exceeds `connection_idle_timeout`
  # without a successful heartbeat response the driver kills it, the
  # host leaves the policy, and EVERYTHING fails instantly with
  # LIB_NO_HOSTS_AVAILABLE until reconnect. Relaxed timings so the
  # client rides THROUGH node stalls instead of ejecting the host:
  # heartbeats keep probing every 30s (driver default), but a
  # connection is only declared dead after 5 MINUTES without a
  # response (driver default: 60s). In-flight requests still honour
  # their own `timeout:` — these govern the connection, not requests.
  # If a stall outlasts even that, reconnect promptly (1s..10s
  # backoff) rather than the driver's default 2s..10m crawl.
  heartbeat_interval: 30s
  connection_idle_timeout: 5m
  reconnect_base_delay: 1s
  reconnect_max_delay: 10s
  # `error_rate_backstop` = the SANITY-BACKSTOP result-level error rate
  # (a proportion in [0,1]) for `recall_check` — a modular,
  # workload-expressed breaker, NOT the machine's built-in
  # `error_rate_max`. The rate is DERIVED IN THE PREDICATE from the base
  # counters (`result_failure` terminal failed ops / `cycles_total`
  # completed ops — the instrument names), never a precomputed rate wire. Set it LOOSER than
  # the adaptive rate servo's operating margin so the servo throttles
  # first and this only trips on a genuine runaway. Tune on the CLI
  # (`error_rate_backstop=0.02`).
  error_rate_backstop: 0.05
  # `attempt_failure_backstop` = the ATTEMPT-level sickness threshold for
  # `load_increment` (a proportion in [0,1]), likewise derived in the
  # predicate from the base counters (`attempt_failure` failed attempts /
  # `attempt_total` resolved attempts — the instrument names; both count
  # at attempt resolution). Attempts see THROUGH retries: the
  # result-level rate stays green while a `tries:` budget absorbs
  # failures (r: climbing, att:% sinking), so this is the breaker that
  # catches a drowning server early. Tune on the CLI
  # (`attempt_failure_backstop=0.25`).
  attempt_failure_backstop: 0.10
  # `result_failure_backstop` = the RESULT-level terminal-failure rate for
  # `load_increment` (a proportion in [0,1]), derived in the predicate from
  # `result_failure` (terminal failed ops) / `cycles_total` (completed ops).
  # Paired with a 100-failure floor so a stray failure deep into a load does
  # not kill the run — only a sustained terminal-failure rate does. Tune on
  # the CLI (`result_failure_backstop=0.05`).
  result_failure_backstop: 0.025
  adapter: cql
  host: 18.215.16.255
  dataset: changeme
  profile: default
  keyspace: baselines
  # `table` is NOT a param — it is derived (sanitized) from the dataset
  # and profile in the top-level `bindings:` block below, so a different
  # `dataset=`/`profile=` automatically lands in its own table.
  # Raised 100 -> 200 (2026-07-23): with smaller memtables (cheaper
  # per-insert graph search) and the merge CPU bound (concurrent_builds=2,
  # build pool 40), the extra in-flight converts the latency headroom into
  # throughput (Little's law: rate = fibers / per-batch service time).
  concurrency: "200"
  query_concurrency: "20"
  replication: "{'class': 'SimpleStrategy', 'replication_factor': '1'}"
  # k / limit / min_query_ms are referenced as bare wires (`k: k`,
  # `r: limit`, `until_elapsed(base, min_query_ms)`), so they are
  # numeric params, not strings.
  k: 10
  limit: 100
  min_query_ms: 10000
  # `recall_interval`: how often to RE-RUN `recall_check` within the SAME
  # session (the SRD-82/92 `interval:` phase wrapper). `0` (the default)
  # disables scheduling — recall runs once per tier, which is what the
  # `incremental` sweep wants. Set it to a duration to turn the `recall`
  # scenario into a periodic monitor whose measurements all land in ONE
  # session / one metrics timeline (an external shell loop cannot do that —
  # each `nbrs run` is its own session). With no `repeat:` bound it runs
  # until the session is stopped (Ctrl-C). E.g. recall at 900M every 5min:
  #   nbrs run workload=compaction_demo_derived scenario=recall \
  #     profile_pattern='^900m$' recall_interval=5m dataset=… host=…
  recall_interval: 0
  # Open-extent budget for the `concurrent_query` daemon's cursor. The
  # daemon is cut short by the foreground's completion (its `daemon_stop`),
  # so this only needs to exceed the longest tier's ingest+index time —
  # set generously (default 24h). Until-stopped is the SRD-82 Part 6
  # follow-up that would remove the need for a budget here.
  query_budget_ms: 86400000
  vector_idx_suffix: _vector_idx

  # SAI jvector index build knob (the only index-construction param
  # besides the computed `similarity_function`); all other build knobs
  # are left at the server defaults.
  source_model: [other]

  # ── Incremental profile sweep controls ───────────────────────
  # `profile_pattern`: which profiles form the sweep, by the literal /
  #   glob / regex promotion (`pattern_match`). `*` = all profiles; `*m`
  #   vs `*mi` selects one suffix series so progressions aren't mixed;
  #   `^vec_(1|2|4)m$` for an explicit regex set.
  #
  #   DEFAULT here = the DECADE profiles only: the single-significant-digit
  #   sizes 100k..900k, 1m..9m, 10m..90m, 100m..900m (36 tiers). A dataset
  #   like ibm-datapile-1b ships a dense "detent" zoo — decade steps PLUS
  #   Fibonacci (13m,21m,34m,55m,89m,…), power-of-two `…mi` (16mi,64mi,…),
  #   and interior 10m splits (110m,120m,…). Recall verification at a fine
  #   interior tier (e.g. 340m) runs against that many base vectors and is
  #   slow while adding little to the characterization curve, so the sweep
  #   condenses to decades. This ONE pattern drives EVERY profile sequence
  #   in the workload — `profile_partitions` and `matching_profile_name_at`
  #   both mask through `masked_profile_tiers`, so the increments follow the
  #   filtered set: after 500m the next tier is 600m (a 100m load), with no
  #   interior 510m..590m tiers between them.
  #
  #   The alternation is anchored per-branch by `promote_pattern`'s
  #   `^(?:…)$` wrap, so `[1-9]m` matches `1m`..`9m` but NOT `1mi`, `10m`,
  #   or `21m`. Set `*` to restore the full dense sweep.
  # `max_size`: stop once a tier's cumulative base-vector count would
  #   exceed this; the last loaded tier is the largest matching profile
  #   that fits (or the last matching profile, whichever comes first).
  #   `0` (the default) means NO cap — it resolves at runtime to the
  #   dataset's actual base-vector count (`vector_count` of the base
  #   facet), so by default the sweep loads every tier up to the full
  #   dataset. Set a positive value to cap; accepts magnitude suffixes on
  #   the CLI (decimal `10m`/`2b`, binary `4Gi`) since the default is
  #   numeric. See `effective_max_size` in the top-level `bindings:`.
  profile_pattern: "^([1-9]00k|[1-9]m|[1-9]0m|[1-9]00m)$"
  max_size: 0

  # ── Insert batch-stride probe ────────────────────────────────
  # `measure_probe_rows`: the size of the leading base-vector slice the
  # one-shot `measure_batch` phase inserts to characterise the insert
  # batch stride. It writes this many rows (keys [0, measure_probe_rows))
  # as a byte-budgeted UNLOGGED batch and reads back the rows the batch
  # actually wrote (`count`) — floored to a round number and frozen as
  # the main loader's `batch: stride`. Kept small (a single probe batch);
  # the rows it writes are re-inserted idempotently by tier 1's load, so
  # the probe does not perturb the data. Numeric so it accepts magnitude
  # suffixes on the CLI.
  measure_probe_rows: 2000
  # `batch_size`: EXPLICIT insert batch stride (rows per batch op). `0`
  # (the default) = auto: run the one-shot `measure_batch` probe and use
  # its measured stride. A positive value takes precedence over the
  # measured stride AND bypasses the probe entirely (its op no-ops via
  # `if:`). Numeric, so CLI magnitude suffixes work (`batch_size=2k`).
  batch_size: 100

  # ── Post-load step toggles (1 = enabled, 0 = skipped) ────────
  # Independently enable/disable each post-load step per tier. All OFF by
  # default — the base sweep just loads each tier with no post-load work;
  # opt into the steps you want on the CLI (e.g. `enable_finalize=1
  # enable_compact=1`).
  enable_flush: 0      # forced memtable flush after each tier's load
  enable_finalize: 0   # the finalize_index phase (flush + sstable read + compaction)
  enable_compact: 0    # the forced major compaction (inside finalize_index)

  # When set (=1), pin the table's STCS min/max thresholds to 100000 in
  # the CREATE TABLE DDL so the size-tier compactor never fires
  # spontaneously mid-load — the test owns compaction timing explicitly.
  # When unset (default 0), no compaction clause is emitted and the
  # server's default STCS behaviour applies (background compactions run).
  disable_auto_compaction: 0

# Derived identifiers, visible to every phase's op text. The CQL table
# holds the cumulative vectors for this dataset+profile, so its name is
# sanitized from them (every character outside [a-zA-Z0-9_] → '_')
# rather than hard-coded — `dataset=ibm-datapile-1b profile=default`
# becomes table `ibm_datapile_1b_default`. (CQL folds the identifier to
# lowercase; dataset names are letter-leading in practice.)
bindings: |
  const table := regex_replace("{dataset}_{profile}", "[^a-zA-Z0-9_]", "_")
  # Effective sweep cap. `max_size=0` (the default) means "the whole
  # dataset", resolved here to the dataset's actual base-vector count
  # (`vector_count` auto-opens the base facet); a positive `max_size`
  # CLI override caps below that. Effectively-const (bound once at
  # scope init), read by the `continue_if: "end_of(p) <=
  # effective_max_size"` sweep gate on the tier loop below (SRD-101).
  const effective_max_size := if(max_size > 0, max_size, vector_count("{dataset}:{profile}"))
  # Workload-root SHARED cell for the measured insert batch stride
  # (SRD-66/67). The early `measure_batch` phase writes THROUGH to this
  # cell its byte-budgeted batch's rows-written `count` (Change 1: a CQL
  # write now reports the rows it wrote as `count`), floored to a round
  # number. The tier loop then FREEZES it as `const stride` (below) and
  # the main `load_increment` insert drives `batch: stride` off it, so
  # the loader's cursor stride is one measured batch-worth instead of a
  # single row. Literal-initialised to 1.0 — F64 ON PURPOSE: the probe
  # writes `floor_decade(...)`, which is F64, and a shared cell must keep
  # ONE type for its whole life (the `if()` in the stride freeze compiles
  # typed bridges against the cell's declared type; a runtime U64→F64
  # flip would trap on that bridge). A run that skips the measure phase
  # still has a valid (single-row) stride; the `batch:` resolution
  # coerces the F64 stride to a row count.
  shared measured: f64 := 1.0

  # Live sstable count for the CURRENT tier, written through from
  # `finalize_index`'s `read_sstables` capture. Root-scoped (2026-07-23) so
  # the sibling `recall_postcompact` phase can gate on "did this tier
  # actually compact" (`sstables > 1`). Re-written each tier before it is
  # read; 0 until the first finalize.
  shared sstables: u64 := 0

  # Vector-index segment shape for the CURRENT tier's compaction, written
  # through from `finalize_index`'s `segment_sizes` capture. Declared here so
  # the drain memo can interpolate them while it waits, and so a later phase
  # could gate on the shape. Zero until the first finalize.
  shared segments:        u64 := 0
  shared seg_bytes_min:   u64 := 0
  shared seg_bytes_max:   u64 := 0
  shared seg_bytes_total: u64 := 0
  shared tbl_bytes_total: u64 := 0
  # Per-segment index sizes, slurped as a JSON array — the individual segment
  # sizes being merged, not just their summary. Carried as a string because the
  # value is a list, not a scalar.
  shared seg_index_bytes: String := "[]"

scenarios:
  # Default: the incremental size-tier sweep.
  default:
    - scenario: incremental

  incremental:
    - teardown
    - schema
    - tune_cluster
    # One-shot insert-batch-stride probe: write one byte-budgeted batch and
    # read back its rows-written `count` into the `shared measured` cell,
    # BEFORE the tier loop freezes it as `const stride`. Runs after `schema`
    # (the table exists) and before any tier load.
    - measure_batch
    # Walk the masked profiles smallest-first as cumulative size tiers.
    # `profile_partitions` yields one partition per matching profile;
    # partition `p` spans `[previous tier size, this tier size)` — the
    # incremental range — and carries its masked position as `idx_of(p)`.
    - for: "p in profile_partitions('{dataset}', '{profile_pattern}')"
      # SRD-101 — bound the sweep: a pre-entry gate on the tier iteration. The
      # walker evaluates this before entering each tier; the moment a tier's
      # cumulative base-vector count would exceed `effective_max_size` (the
      # dataset's full base count by default), the over-budget tier is NOT run
      # and the sweep ends gracefully (Interrupted+Succeeded, exit 0), with a
      # `continue_if:` marker recording the actual coordinate. `each` defaults
      # to `scenario` (this tier loop). Replaces the three per-op `if:` gates
      # that used to no-op past the cap while still iterating every tier.
      continue_if: "end_of(p) <= effective_max_size"
      phases:
        # Each tier is FOUR sibling sub-scopes (SRD-82 Part 6 daemon
        # isolation), capturing recall BEFORE and AFTER compaction:
        #   tier_load          load + flush, shadowed by the
        #                      `concurrent_query` daemon (stops when the
        #                      scope's foreground completes)
        #   recall_postload    UNCONDITIONAL recall over the standard query
        #                      set — the pre-compaction measurement
        #   tier_compact       finalize (flush/read/compact/drain), again
        #                      daemon-shadowed by its own
        #                      `concurrent_query` instance
        #   recall_postcompact recall AFTER compaction — its op is gated on
        #                      `sstables > 1` (the tier actually compacted)
        # The recall phases run in SIBLING scopes after each daemon has
        # stopped, so probe load never perturbs a measurement; the phase
        # NAMES are the before/after labels in every readout and metric.
        - scenario: tier_load
        - recall_postload
        - scenario: tier_compact
        - recall_postcompact

  # The build half of one tier: load the incremental vectors, flush, and
  # major-compact — shadowed by the `concurrent_query` daemon. Rooted as
  # its OWN scope (a `scenario:` include) so the daemon's stop boundary is
  # this group's completion, NOT the whole tier (which would include the
  # recall check). `concurrent_query` is listed FIRST so it is spawned in
  # daemon mode (off the foreground budget) BEFORE the ingestion phase and
  # runs at 1/s for the whole build, then stops cleanly when
  # `finalize_index` completes. The for-loop tier `p` is in scope here
  # (inherited from the enclosing `for:`), so the phases resolve
  # `idx_of(p)` / `start_of(p)` / `end_of(p)` unchanged.
  tier_load:
    - concurrent_query
    # Freeze the measured batch stride for THIS tier's load. `const stride`
    # is an extern-no-default freeze of the workload-root `shared measured`
    # cell AT SCOPE ACTIVATION (SRD-67 Phase 5) — the value the early
    # `measure_batch` phase wrote. Scoped to its `phases:` child, so
    # `load_increment`'s `batch: stride` resolves it. The `concurrent_query`
    # daemon (spawned above) still shadows the whole foreground of this
    # scope — this inner bindings layer only wraps the loader, it does not
    # change when the daemon stops (still at `finalize_index` completion).
    - bindings: |
        # Explicit `batch_size` param wins; else the probe's measurement.
        const stride := if(batch_size > 0, batch_size, measured)
      phases:
        - load_increment
    - flush

  # The compaction half of one tier, in its OWN daemon-shadowed scope so
  # `recall_postload` can run between flush and compaction. A fresh
  # `concurrent_query` daemon instance shadows the finalize, preserving
  # query load during compaction exactly as the pre-split `tier_build` did.
  tier_compact:
    - concurrent_query
    - finalize_index

  # Single-phase scenarios for piecewise runs.
  reset:   [teardown]
  ddl:     [schema]
  compact: [finalize_index]

  # Recall-only against an ALREADY-LOADED tier — no teardown / schema /
  # load / compact, so the data in the table is untouched. `recall_check`
  # resolves its tier from the loop variable `p` (its `idx_of(p)` ground
  # truth), so it CANNOT run as a bare single-phase scenario; the single-
  # element `for:` binds the `p` it needs. `profile_pattern` picks the tier:
  # filter it to one profile (`profile_pattern='^900m$'`) so the loop yields
  # exactly that tier and recall runs at 900M against the existing table.
  # For a periodic measurement, drive it from a shell loop (nbrs runs a
  # scenario once and exits):
  #   while true; do
  #     nbrs run workload=compaction_demo_derived scenario=recall \
  #       profile_pattern='^900m$' dataset=… cqldriver=… host=… ; sleep 300
  #   done
  # (Without the `profile_pattern` override this runs a recall pass for
  # every decade tier in sequence — the `^900m$` filter pins it to 900M.)
  recall:
    - for: "p in profile_partitions('{dataset}', '{profile_pattern}')"
      phases:
        - recall_check

phases:
  # Anti-DDL teardown: clear rows, then drop the index and the table.
  # Per-statement timeout floor — a DROP on a populated SAI index can take
  # tens of seconds. Runs ONCE before the sweep (the table accumulates
  # vectors incrementally across tiers; it is NOT reset between profiles).
  teardown:
    # Skip-eligible on resume: a completed teardown must NOT re-run — it drops the
    # table, which would wipe every loaded tier. `--resume` skips it (identity match)
    # and continues on the existing data. This is what makes in-session resume preserve
    # the sweep's accumulated state instead of starting over.
    checkpoint: idempotent
    concurrency: 1
    # One-shot anti-DDL: never retry (the truncate is EXPECTED to fail on a
    # first run and is tolerated by its op-scoped errors policy).
    tries: 1
    bindings: |
      const request_timeout_ms := 300000
    ops:
      # Clear any rows a prior run left behind before the schema teardown.
      # No IF EXISTS: on a first run the table is absent and this errors — the
      # op-scoped `errors: ".*:warn,counter"` (SRD-82 op shell) logs+counts
      # that error and moves on WITHOUT aborting the run, while the sibling
      # DROPs keep the default stop-on-error handling. Kept ahead of the DROP
      # so it takes effect while the table still exists.
      truncate_table:
        errors: ".*:warn,counter"
        # 60s cap (NOT the phase's 300s request_timeout_ms): on a large
        # table a truncate against a busy coordinator often gets NO
        # response at all — waiting the full 5-minute phase budget for a
        # statement that is tolerated-on-failure (and followed by DROP
        # TABLE anyway) is pure teardown delay. 60s stays cohesively
        # above the 30s server-side timeout.
        timeout: 60s
        raw: "TRUNCATE TABLE {keyspace}.{table}"
      drop_vector_index:
        raw: "DROP INDEX IF EXISTS {keyspace}.{table}{vector_idx_suffix}"
      drop_table:
        raw: "DROP TABLE IF EXISTS {keyspace}.{table}"

  schema:
    # Completed schema DDL skips on resume (keyspace/table/index already exist).
    checkpoint: idempotent
    concurrency: 1
    # One-shot idempotent DDL: single attempt.
    tries: 1
    bindings: |
      dim := vector_dim("{dataset}:{profile}")
      similarity_function := dataset_distance_function("{dataset}:{profile}")
    ops:
      create_keyspace:
        raw: |
          CREATE KEYSPACE IF NOT EXISTS {keyspace}
          WITH replication = {replication} AND durable_writes = true
      # Table DDL in two mutually-exclusive forms selected by
      # `disable_auto_compaction`. Exactly one runs per schema pass; the
      # other is skipped by its `if:` guard.
      #   pinned  — STCS min/max thresholds pinned high (100000) so the
      #             size-tier compactor never fires spontaneously
      #             mid-load; the test owns compaction timing via
      #             `finalize_index`.
      #   default — explicit SizeTieredCompactionStrategy (min 5 / max 8,
      #             liberal buckets bucket_low 0.3 / bucket_high 2.0) so
      #             background compactions run as STCS. NOTE: we specify STCS
      #             explicitly rather than relying on the server default —
      #             this build defaults to UnifiedCompactionStrategy (UCS),
      #             which batches many sstables per merge and shards into
      #             parallel compactions, pathological for vector SAI builds.
      create_table_pinned:
        if: "disable_auto_compaction != 0"
        raw: |
          CREATE TABLE IF NOT EXISTS {keyspace}.{table}
          (key text PRIMARY KEY, value vector<float, {dim}>)
          WITH compaction = {'class': 'SizeTieredCompactionStrategy', 'min_threshold': '100000', 'max_threshold': '100000'}
          AND compression = {'enabled': 'false'}
      create_table_default:
        if: "disable_auto_compaction == 0"
        raw: |
          CREATE TABLE IF NOT EXISTS {keyspace}.{table}
          (key text PRIMARY KEY, value vector<float, {dim}>)
          WITH compaction = {'class': 'SizeTieredCompactionStrategy', 'min_threshold': '5', 'max_threshold': '8', 'bucket_low': '0.3', 'bucket_high': '2.0'}
          AND compression = {'enabled': 'false'}
      create_vector_index:
        raw: |
          CREATE CUSTOM INDEX IF NOT EXISTS {table}{vector_idx_suffix}
          ON {keyspace}.{table} (value)
          USING 'StorageAttachedIndex'
          WITH OPTIONS = {
            'similarity_function': '{similarity_function}',
            'source_model': '{source_model}',
            'enable_hierarchy': 'true'
          }

  # Boost compaction throughput + parallelism at session start so the
  # major compaction in `finalize_index` isn't throttled by the
  # per-node defaults. `0` is Cassandra's "no rate limit" sentinel.
  tune_cluster:
    # Completed cluster tuning skips on resume (knobs already applied).
    checkpoint: idempotent
    adapter: http
    concurrency: 1
    cycles: 1
    # One-shot JMX writes: single attempt.
    tries: 1
    ops:
      set_compaction_throughput:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"write",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "attribute":"CompactionThroughputMbPerSec",
           "value":0}
        request_timeout_ms: 10000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "tuning: CompactionThroughputMbPerSec -> 0 (unlimited)"
          after:  "tuned: CompactionThroughputMbPerSec -> 0 (unlimited)"
      set_concurrent_compactors:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"write",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "attribute":"ConcurrentCompactors",
           "value":10}
        request_timeout_ms: 10000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "tuning: ConcurrentCompactors -> 10"
          after:  "tuned: ConcurrentCompactors -> 10"

  # Concurrent ANN query probe — an SRD-82 Part 6 DAEMON phase. Runs at
  # 1/s alongside the foreground load → flush → finalize of this tier (it
  # is listed FIRST in the `tier_build` include, so the scenario shell
  # spawns it in daemon mode, off the foreground concurrency budget), on
  # its OWN scope so it pulls from a distinct cursor base. It stops cleanly
  # when `tier_build`'s foreground (load/flush/finalize) completes —
  # BEFORE `recall_check` runs in the sibling scope, so the probe never
  # contends with the recall measurement. The op's `result_success` timer
  # (SRD-91) captures ANN query latency *while the tier is being ingested
  # and indexed* — the whole point of the probe.
  concurrent_query:
    # Skip a completed tier's shadow daemon on resume (its tier_build is done); only
    # the failed/pending tier re-spawns it.
    checkpoint: idempotent
    adapter: cql
    daemon: true
    concurrency: 1
    # SRD-82 ErrorPolicy — this probe runs DURING ingest + indexing, where
    # ANN query timeouts are EXPECTED (the index isn't built yet). Count
    # them and keep probing rather than letting one timeout abort the sweep
    # (the prior default stop-on-error). NO error-rate guard here on
    # purpose: the probe's job is to MEASURE query behaviour while the index
    # builds, so its errors are the data, not a failure signal — the
    # foreground `load_increment` / `recall_check` guards below catch a
    # genuinely unhealthy run.
    errors: ".*:warn,counter"
    # No `stop_when` here on purpose (see comment above): this probe's errors
    # are DATA, not a failure signal — it must not carry the data-plane
    # backstop. (There is no hidden error-rate default to disable either:
    # `error_rate_max` is opt-in only — SRD-82.)
    # 1 query/s — numeric so it builds the activity RateLimiter (a string
    # like "1/s" would not parse as f64 and would be ignored).
    rate: 1
    bindings: |
      # This tier's own query set (the same prebuffer as recall_check).
      const tier := matching_profile_name_at('{dataset}', '{profile_pattern}', idx_of(p))
      const prebuffered := dataset_prebuffer(str_concat('{dataset}:', tier))
      const base := query_count(prebuffered)
      # Open-extent cursor: wrap the query set for up to query_budget_ms;
      # the daemon's stop signal cuts it the moment the foreground tier
      # completes, so it never actually reaches the budget.
      cursor q = until_elapsed(base, query_budget_ms)
      query_vector := query_vector_at(prebuffered, q % base)
    ops:
      probe_ann:
        timeout: 60s   # 60s per read; retried up to the phase `tries` budget on a CQL timeout
        prepared: |
          SELECT [key] FROM {keyspace}.{table}
          ORDER BY value
          ANN OF {query_vector}
          LIMIT {limit}
        metrics:
          probe_rows:
            kind: gauge
            value: count

  # One-shot insert-batch-stride probe (SRD-103 / Change 1). Insert a
  # byte-budgeted UNLOGGED batch over a small leading slice of the base
  # facet and read back the rows it wrote as `count` — a CQL write now
  # reports its rows-written count just as a SELECT reports rows returned.
  # `floor_decade` rounds that to a round number and writes it THROUGH to
  # the workload-root `shared measured` cell (SRD-66/67), which the tier
  # loop later freezes as `const stride`. `concurrency: 1` so the probe is
  # a single deterministic write path. NOTE: with `max_batch_size` and no
  # `batch:`, one invocation writes one byte-budget-worth of rows; `count`
  # equals the SERVER batch capacity only when the phase runs a single
  # full-budget invocation (probe slice ≤ that capacity). Tune
  # `measure_probe_rows` to the target's row width, or run against a live
  # cluster to confirm the derived stride. The rows it writes (keys
  # [0, measure_probe_rows)) are re-inserted idempotently by tier 1's load.
  measure_batch:
    # Deliberately NOT `checkpoint: idempotent`: this probe writes the shared
    # `measured` cell that the tier loop's `const stride := ... measured` freeze reads.
    # That cell is session state, not persisted in the checkpoint, so on resume the
    # probe must RE-RUN to repopulate it (cheap: one idempotent batch) — skipping it
    # would leave `stride` unresolved for the resumed tier. (Passing an explicit
    # `batch_size` param makes stride independent of this probe.)
    concurrency: 1
    # ONE op only: it reserves rows_per_op (= one byte-budget-worth of rows,
    # capped at MAX_PREDICTED_ROWS) and reports the count it wrote. Without
    # this the phase would run to cursor exhaustion (many ops), and the
    # last-write-wins `measured` cell would end up holding a short-tail
    # count instead of a full budget batch.
    cycles: 1
    tries: 1
    bindings: |
      # The first matching profile's own vectors — representative of the
      # dataset's vector WIDTH, which is what sizes a byte-budgeted batch.
      const tier := matching_profile_name_at('{dataset}', '{profile_pattern}', 0)
      const prebuffered := dataset_prebuffer(str_concat('{dataset}:', tier))
      # A small leading slice of the base facet. The cursor value `row` is
      # the absolute base-vector ordinal (the range starts at 0), so keys
      # and vectors span [0, measure_probe_rows) — the same keys tier 1's
      # `load_increment` re-inserts idempotently.
      cursor row = range(0, measure_probe_rows)
      id := format_u64(row, 10)
      train_vector := vector_at(prebuffered, row)
    ops:
      measure_insert:
        # Bypassed entirely when an explicit `batch_size` is provided —
        # the stride freeze below prefers the param, so measuring would
        # be wasted work (and a wasted probe write).
        if: "batch_size == 0"
        # Byte-budgeted UNLOGGED batch sized to the cluster's OWN limit,
        # with NO `batch:` row cap — one invocation packs a full
        # byte-budget-worth of rows and reports the count it wrote.
        max_batch_size: cql_server_batch_limit(cql_session(cql_session_key))
        batchtype: unlogged
        timeout: 60s
        prepared: |
          INSERT INTO {keyspace}.{table} (key, value)
          VALUES ('{id}', {train_vector})
        # SRD-66 result-binding: write floor_decade(count) THROUGH to the
        # workload-root `shared measured` cell — `count` is the rows this
        # byte-budgeted write actually wrote (Change 1).
        result: |
          measured := floor_decade(count*0.9)

  # Incremental load: insert ONLY the vectors new to this size tier —
  # the absolute range [prev_count, this_count) of the profile's base
  # facet, where `this_count` is this tier's cumulative size and
  # `prev_count` is the previous (smaller) tier's size (0 for the first).
  # The key is the absolute ordinal, so keys never collide across tiers
  # and the table ends each tier holding exactly [0, this_count).
  # Skipped (no-op) once a tier's size exceeds `max_size`.
  load_increment:
    # Completed tier loads skip on resume; the loads are idempotent re-inserts anyway.
    checkpoint: idempotent
    concurrency: concurrency
    # `tries:` MAP FORM (SRD-82 Part 3b) — the load is where a drowning
    # server triggers retry storms, so pace retries explicitly here. `count`
    # is the total-attempts budget (inherits the root 20 otherwise); the
    # `backoff` grows the inter-retry wait geometrically by `ratio` from
    # `min`, capped at `max`, so 20 fast retries don't hammer a sick server.
    # These values equal the built-in defaults — spelled out as documentation
    # and to exercise the map form. The sugared `tries: 20` remains valid.
    tries:
      count: 20
      backoff:
        ratio: 2.0
        min: 100ms
        max: 10s
    # SRD-82 ErrorPolicy + SRD-83 stop conditions — tolerate TRANSIENT insert
    # errors (timeouts under load): the `tries:` budget retries them and the
    # load keeps going. The guards below are SANITY BACKSTOPS, each derived IN
    # THE PREDICATE from base counters — never a precomputed rate wire:
    # Every name is a registered INSTRUMENT (what metrics.db carries):
    #   result-specific:  result_failure / cycles_total  (terminal failed ops / completed ops)
    #   attempt-specific: attempt_failure / attempt_total (both counted at
    #                     attempt RESOLUTION, so the ratio is exact)
    #
    # 1. Coverage invariant. This phase's contract is "the table ends the tier
    #    holding exactly [prev_count, this_count)". A TERMINAL insert failure
    #    (an op that exhausted its whole `tries` budget) is missing rows — the
    #    tier is invalid regardless of proportion, so a single one fails the
    #    phase. Transients never trip this: they resolve inside the budget and
    #    never reach `result_failure`.
    # 2. Attempt-level sickness. Retries absorb failures, so the result-level
    #    rate stays green while the server drowns (r: climbing, att:% sinking).
    #    Failed attempts crossing `attempt_failure_backstop` of resolved
    #    attempts — past a 200-attempt sample — fails the phase while the rate
    #    servo still has operating room below it.
    # polydat predicates use `&`, not `&&`.
    errors: ".*:warn,counter"
    # SRD-83 stop conditions, written in the NON-SUGARED canonical form
    # (five explicit axes: condition/pulse/per/action/at; no aliases, no
    # defaults) so the routing is legible at a glance. `at: workload` sends
    # a tripped backstop out to the workload root — the WHOLE run stops, not
    # just this tier's load phase.
    #
    #   pulse:  continuous  — evaluated inline, per drain-loop turn
    #   per:    self        — detected at this (phase) scope
    #   action: fail        — cooperative halt: drain in-flight ops
    #   action: abort       — same failing outcome, but CANCEL in-flight ops
    #                         (arms the session cancel-ops countdown), for a
    #                         server sick enough that parked ops will only
    #                         ever end by client timeout
    stop_when:
      # Result-level failure rate → abort. A single stray terminal failure
      # (e.g. one op exhausting its tries budget deep into a multi-hour load)
      # is NOT a reason to kill a whole run, so this is a RATE backstop, not a
      # zero-tolerance guard: it trips only once terminal failures cross
      # `result_failure_backstop` (2.5%) AND there are at least 100 of them
      # (the floor keeps a handful of early failures from tripping a
      # not-yet-meaningful rate). Both halves must hold.
      - condition: "(result_failure >= 100) & (to_f64(result_failure) > (to_f64(cycles_total) * {result_failure_backstop}))"
        pulse:   continuous
        per:     self
        action:  abort
        at:      workload
      # Attempt-level sickness (retry churn) → abort: once the attempt-failure
      # rate is this high the server is drowning and the in-flight ops will
      # only ever end by client timeout, so cancel them now rather than wait
      # out a ~minute drain of work the aborted run will discard anyway.
      - condition: "(attempt_total > 200) & (to_f64(attempt_failure) > (to_f64(attempt_total) * {attempt_failure_backstop}))"
        pulse:   continuous
        per:     self
        action:  abort
        at:      workload
    # REMOVED 2026-07-23: the 100 ops/s cap (10K rows/s at the measured
    # stride of 100) was the ceiling hiding server-side throughput
    # recovery. The attempt/result backstops below remain the safety
    # net. Restore by uncommenting:
    # rate: 100
    bindings: |
      # `p` is the active masked profile tier from `profile_partitions`:
      # `[start_of(p), end_of(p))` is the incremental delta since the
      # previous tier — a partition carries its own start ordinal, so no
      # cross-iteration carry is needed. `idx_of(p)` is the masked
      # position, used to name this tier's own prebuffer.
      const tier := matching_profile_name_at('{dataset}', '{profile_pattern}', idx_of(p))
      const prebuffered := dataset_prebuffer(str_concat('{dataset}:', tier))
      # The cursor bounds this tier to `cardinality(p)` cycles (the delta
      # this_count - prev_count). The ABSOLUTE base-vector ordinal is
      # `at(p, cycle)` = `start_of(p) + cycle`, so keys/vectors span the
      # incremental `[prev_count, this_count)` — never `[0, delta)`. (A
      # cursor's value wire is the local index; the absolute ordinal comes
      # from the partition accessor.)
      cursor row = range(start_of(p), end_of(p))
      ord := at(p, cycle)
      id := format_u64(ord, 10)
      train_vector := vector_at(prebuffered, ord)
    ops:
      insert:
        # FIXED cursor stride per invocation (SRD-22 cover-once), frozen from
        # the `measure_batch` probe via the enclosing `const stride := measured`
        # scope: one invocation reads AND advances `stride` ordinals — a
        # measured batch-worth instead of a single row. `stride` defaults to 1
        # (the root `shared measured` literal) if the probe was skipped.
        batch: stride
        # Byte-bounded batch sized to the cluster's OWN configured limit
        # (SRD-103): reads `batch_size_fail_threshold` from
        # system_views.settings, backs off 10%, and fills each UNLOGGED batch
        # up to that many encoded bytes (dynamic row count by vector dim). KEPT
        # alongside `batch: stride` as the byte-fill safety valve: the `stride`
        # rows are packed into sub-batches each held under this budget, so an
        # over-large stride can never exceed the server's reject threshold. If
        # the server doesn't expose the limit (older C* / permissions), this
        # resolves to 0 = no byte cap.
        max_batch_size: cql_server_batch_limit(cql_session(cql_session_key))
        batchtype: unlogged
        timeout: 60s   # 60s per write; retried up to the phase `tries` budget on a CQL timeout
        prepared: |
          INSERT INTO {keyspace}.{table} (key, value)
          VALUES ('{id}', {train_vector})

  # Flush memtables to disk (synchronous JMX exec) so the just-loaded
  # increment rolls into an on-disk SSTable for `finalize_index` to
  # compact-merge with the prior tiers' SSTables.
  flush:
    # Completed tier flush skips on resume.
    checkpoint: idempotent
    adapter: http
    concurrency: 1
    cycles: 1
    tries: 1
    ops:
      flush:
        adapter: http
        # Visible leaf: the synchronous forceKeyspaceFlush produces no
        # signal until it returns, but the box is busy the whole time —
        # per flushed memtable, cassandra encodes the segment's vectors
        # and serializes the SAI on-disk graph (SERIAL by design,
        # flush_build_parallel=false; ~20s per ~1M-row memtable, logged
        # cassandra-side as "CassandraOnHeapGraph: Writing graph took
        # Nms"). The leaf's default duration cell ticks through that
        # window so the wait reads as measured work, not a stall.
        readout: visible
        # Forced-flush toggle: skip the whole flush when disabled.
        if: "enable_flush != 0"
        # 15s TCP-connect budget to the Jolokia agent (distinct from the
        # request_timeout_ms response deadline): a connect that hangs — e.g.
        # the agent busy on another in-flight JMX call — fails fast and
        # retries (inherited root `tries: 10`) instead of stalling on the OS default.
        connect_timeout: 15s
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceFlush(java.lang.String,[Ljava.lang.String;)",
           "arguments":["{keyspace}",[]]}
        request_timeout_ms: 3600000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "flushing keyspace {keyspace} — memtable data + per-segment SAI vector graph build (serial; ~20s per ~1M-row memtable; see cassandra 'Writing graph took' lines)"
          after:  "flushed keyspace {keyspace} (memtables → sstables + vector index)"

  # Major compaction. One stanza, ops run once each in order:
  #   flush           -> roll any remaining memtable to disk
  #   read_sstables   -> read LiveSSTableCount; capture `sstables`
  #   trigger_compact -> DAEMON, `if: sstables > 1`; holds the JMX
  #                      socket open for the whole synchronous compaction
  #   segment_sizes   -> CQL system_views.sstable_indexes; per-segment sizes
  #                      of the vector index sstables being merged
  #   await_compaction -> CQL system_views.sstable_tasks, op-level
  #                      `poll: await_empty`; live progress until idle
  finalize_index:
    # Completed tier finalize (flush + compaction drain) skips on resume; the failed
    # tier re-runs it.
    checkpoint: idempotent
    adapter: cql
    concurrency: 1
    cycles: 1
    tries: 1
    bindings: |
      # 2s pre-poll grace for the drain (f64 = milliseconds, consumed by
      # await_compaction's `delay:`): covers the daemon-dispatch race where
      # the first drain poll could run before trigger_compact's JMX call
      # registers its compaction task — an empty first read would satisfy
      # `await_empty` instantly and release the tier early.
      const drain_grace := 2000.0
      # Cross-op cell: `read_sstables` writes it, `trigger_compact`'s
      # `if:` reads it. Since 2026-07-23 the cell is declared at the
      # WORKLOAD ROOT (not re-declared here) so the write-through
      # reaches the root `shared sstables` and the sibling
      # `recall_postcompact` phase can gate on it.
      # Wall-clock read for the phase-duration metric.
      volatile now_ms := current_epoch_millis()
    metrics:
      time_to_index: { kind: gauge, value: "now_ms - phase_start" }
    ops:
      flush:
        adapter: http
        # SRD-63: surface this op as its own timed status leaf under the
        # finalize_index phase (flush is the slow SAI-graph build step).
        readout: visible
        # Part of finalize: gated by the finalize toggle.
        if: "enable_finalize != 0"
        # 15s connect budget to the Jolokia agent (see the standalone `flush`
        # phase): fail fast + retry (inherited root tries: 10) rather than hang.
        connect_timeout: 15s
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceFlush(java.lang.String,[Ljava.lang.String;)",
           "arguments":["{keyspace}",[]]}
        request_timeout_ms: 600000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "finalize step 1/5 — flushing {keyspace} memtables to sstables (builds the on-disk SAI vector graph for the just-loaded tier; this is the slow part of a flush, not the write itself)"
          after:  "finalize step 1/5 — flushed {keyspace} (memtables → sstables + vector index)"
      read_sstables:
        adapter: http
        readout: visible
        if: "enable_finalize != 0"
        uri: "http://{host}:8778/jolokia/read/org.apache.cassandra.metrics:type=Table,keyspace={keyspace},scope={table},name=LiveSSTableCount/Value"
        method: GET
        request_timeout_ms: 10000
        connect_timeout: 15s
        verify:
          - field: status
            eq: "200"
        strict: true
        capture:
          # Jolokia wraps the attribute value in `{value: N, status: 200}`.
          sstables: "/value"
        metrics:
          table_live_sstables: { kind: gauge, value: sstables }
        memo:
          before: "finalize step 2/5 — reading live sstable count for {keyspace}.{table} (decides whether a compaction is needed)"
          after:  "finalize step 2/5 — {keyspace}.{table} has {sstables} live sstable(s) before compaction"
      trigger_compact:
        adapter: http
        readout: visible
        daemon: true
        # 15s connect budget only — the request itself may run the full
        # compaction (request_timeout_ms below); this bounds just the connect.
        connect_timeout: 15s
        # Forced compaction: only when finalize AND compaction are
        # enabled AND there is more than one sstable to merge.
        if: "enable_finalize != 0 && enable_compact != 0 && sstables > 1"
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceCompaction(boolean,java.lang.String,[Ljava.lang.String;)",
           "arguments":[false,"{keyspace}",["{table}"]]}
        request_timeout_ms: 3600000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "finalize step 3/5 — triggering major compaction of {keyspace}.{table} ({sstables} sstables → 1; merges the vector graph segments and NVQ-refines them). Synchronous — returns when compaction completes."
          after:  "finalize step 3/5 — major compaction of {keyspace}.{table} returned"
      # Size distribution of the vector-index segments this compaction is merging.
      # Runs AFTER trigger_compact, which is `daemon: true` — so it reads while the
      # compaction is in flight, and the inputs are still on disk (a major compaction
      # does not retire its sources until it completes). system_views.sstable_indexes
      # emits one row per (index, sstable) with per_column_disk_size (this index's own
      # bytes in that sstable) and per_table_disk_size (the whole sstable). The
      # per-segment list is what makes the merge's K-vs-size shape legible: one large
      # base segment plus a tail of ~1M-row flush segments looks very different from
      # a dozen equal ones, and merge cost tracks that shape.
      segment_sizes:
        adapter: cql
        readout: visible
        if: "enable_finalize != 0 && enable_compact != 0"
        # Advisory, like the drain below: a failed read must not fail the tier.
        errors: ".*:warn,counter"
        raw: |
          SELECT sstable_name, [@per_column_disk_size as seg_index_bytes], per_table_disk_size
            FROM system_views.sstable_indexes
           WHERE keyspace_name = '{keyspace}'
             AND index_name = '{table}{vector_idx_suffix}'
        capture:
          # Aggregates via the row-set folds (:count / :min / :max / :sum).
          segments:        ":count"
          seg_bytes_min:   ":min(per_column_disk_size)"
          seg_bytes_max:   ":max(per_column_disk_size)"
          seg_bytes_total: ":sum(per_column_disk_size)"
          tbl_bytes_total: ":sum(per_table_disk_size)"
        bindings: |
          # MiB for display; the raw byte columns stay available for metrics.
          # The capture targets themselves are declared as shared wires at the
          # workload level, so they are in scope here and in the drain memo.
          seg_mib_min   := seg_bytes_min / 1048576
          seg_mib_max   := seg_bytes_max / 1048576
          seg_mib_total := seg_bytes_total / 1048576
          tbl_mib_total := tbl_bytes_total / 1048576
          # Both branches always evaluate (dataflow select, not a guard), so the
          # divisor is made safe with max(); the `if` only chooses what to report.
          seg_mib_mean  := if segments > 0 { seg_bytes_total / max(segments, 1) / 1048576 } else { 0 }
        metrics:
          compaction_input_segments:    { kind: gauge, value: segments }
          compaction_input_index_bytes: { kind: gauge, value: seg_bytes_total }
          compaction_input_table_bytes: { kind: gauge, value: tbl_bytes_total }
        memo:
          before: "finalize step 4/5 — measuring the vector-index segments {keyspace}.{table} is merging"
          after:  "finalize step 4/5 — merging {segments} segment(s): index min {seg_mib_min} MiB / mean {seg_mib_mean} MiB / max {seg_mib_max} MiB, total {seg_mib_total} MiB (shared SAI per-sstable components {tbl_mib_total} MiB); per-segment index bytes {seg_index_bytes}"
      await_compaction:
        adapter: cql
        readout: visible
        delay: drain_grace
        # Nothing to poll unless a compaction was triggered.
        if: "enable_finalize != 0 && enable_compact != 0"
        # Advisory status poller: a poll timeout (or any read error) must NOT halt the
        # sweep — this is monitoring, not load. Route every error to warn+count so a slow
        # or wedged compaction drain degrades to a logged warning, not a terminal error
        # that trips the scenario's `children_failed > 0` stop condition.
        #
        # NO completion_ratio filter (2026-07-25): a LIVE task's ratio saturates
        # at 1.0 minutes before the task deregisters — at 60M scale the merge
        # epilogue (compacted-graph write + rescore + cleanup, cassandra's
        # "Writing compacted graph" → "Compaction complete" span) ran 2m22s past
        # ratio 1.0; the old `completion_ratio < 1.0` predicate filtered that
        # live row out, the drain released early, and tier 24's load collided
        # with the merge tail (10% write-attempt failures → error_rate_backstop
        # abort). Counting ALL registered rows can over-wait on stale completed
        # rows that linger a few minutes after finishing (the 2026-07-22
        # observation that motivated the filter) — a bounded, safe delay under
        # the 48h timeout, unlike the unbounded damage of under-waiting. The
        # display captures may briefly show a lingering row's pinned ratio;
        # existence, not the ratio, is the drain condition.
        errors: ".*:warn,counter"
        bindings: |
          extern active_compactions: u64 = 0
          extern completion_ratio:   f64 = 0.0
          extern progress:           u64 = 0
          extern total:              u64 = 0
          # Drain speed in the memo's own units (units/s): per-second rate of
          # the compaction_progress_parts gauge over a trailing 2m window
          # (one sample lands per 5s poll below). rate()'s counter-reset
          # handling absorbs the drain's task switches (each new task's
          # progress restarts at 0), and finished tiers' series go static
          # (rate 0), so the sum self-scopes to the active drain.
          units_per_s := round_u64(metricsql_scalar("sum(rate(compaction_progress_parts[2m]))"))
        # NO kind filter (2026-07-24): the drain must hold for the WHOLE
        # compaction, not only its index-build tail. During the merge's
        # row-ingest pass the only registered row is the byte-denominated
        # `Compaction` task — filtering to 'secondary index build' made
        # `await_empty` exit in that window, the next tier's
        # trigger_compact then CANCELLED the in-flight merges (the
        # cleanly-interruptible merge honors it), and every cancelled
        # merge left an index-less sstable that scheduled a full
        # 40-thread index rebuild — the flush-starvation storm.
        raw: |
          SELECT completion_ratio, progress, total
            FROM system_views.sstable_tasks
           WHERE keyspace_name = '{keyspace}'
             AND table_name   = '{table}'
          ALLOW FILTERING
        # Aggregated across ALL task rows (2026-07-26): the drain window
        # typically holds TWO tasks in mixed units — the byte-denominated
        # data `Compaction` (which finishes its bytes early and then sits
        # registered at ratio 1.0 while the index build runs) and the
        # ordinal/byte-denominated vector merge. The previous `/0/...`
        # captures pinned whichever row sorted first (the saturated byte
        # task), freezing the memo at "ratio 1.0, ≈0 units/s" for entire
        # multi-minute merges. min(ratio) reads the least-complete task —
        # the drain's true state; sum(progress) keeps the units/s gutter
        # moving whichever task is advancing.
        capture:
          active_compactions: ":count"
          completion_ratio:   ":min(completion_ratio)"
          progress:           ":sum(progress)"
          total:              ":sum(total)"
        # Live drain-speed cell, refreshed per poll iteration (the poll
        # wrapper republishes the during form each poll — the op itself
        # completes only once, at drain end). The phase's ✓ outcome line
        # retains the LAST published value as its final cell, so each
        # tier's closing compaction speed stays readable in scrollback.
        # (This cell replaces the auto completion bar on the stats row;
        # the header meter still shows the ratio-driven percentage.)
        gutter:
          text: "≈{units_per_s} units/s"
        poll:
          mode: await_empty
          interval_ms: 5000
          # 48h. Gracious enough that even the largest (~1B-vector) tier's compaction
          # drain won't hit it under normal progress (was 4h, which the 60-70M tier blew
          # through). If it ever is exceeded, the op-level `errors:` policy above turns the
          # poll_timeout into a warning, not a run-ending error.
          timeout_ms: 172800000
          max_error_retries: 5
          metric_name: compaction_wait_time_s
          # Re-rendered after every poll against that poll's captures, so the
          # memo shows the live measured state of the drain instead of the
          # static `before:` text for the (potentially hours-long) wait.
          memo: "finalize step 5/5 — {keyspace}.{table} compaction draining: ratio {completion_ratio}, {progress}/{total} units, {active_compactions} task(s) in flight | merging {segments} segment(s), index total {seg_mib_total} MiB (max {seg_mib_max} MiB)"
          # The measured fractional completion drives this phase's completion
          # bar/percentage (derived-progress override) — the cycle-based bar
          # would otherwise sit at 0% for the whole drain.
          progress: "{completion_ratio}"
        metrics:
          compaction_completion_ratio: { kind: gauge, value: completion_ratio }
          # Unit is token range parts (the 'secondary index build' task), not bytes.
          compaction_progress_parts:   { kind: gauge, value: progress }
          compaction_total_parts:      { kind: gauge, value: total }
          compaction_pending_tasks:    { kind: gauge, value: active_compactions }
        memo:
          before: "finalize step 5/5 — waiting for {keyspace}.{table} vector index build to drain (await_empty; polls system_views.sstable_tasks kind='secondary index build' every 5s)"
          after:  "finalize step 5/5 — {keyspace}.{table} index build at ratio {completion_ratio}, {progress}/{total} token range parts ({active_compactions} task(s) in flight)"
        request_timeout_ms: 60000

  # Recall against the post-compaction index AT THIS TIER'S SIZE, using
  # THIS tier's own ground truth (query set + neighbor indices from the
  # tier's prebuffer). `recall` is therefore reported per size tier (the
  # metric carries the profile name as the in-scope `{tier}` label).
  # Skipped (no-op) once a tier's size exceeds `max_size`.
  recall_check:
    # Completed tier recall measurement skips on resume (already recorded).
    checkpoint: idempotent
    concurrency: "{query_concurrency}"
    # SRD-82/92 phase-level `interval:` wrapper — re-run THIS PHASE every
    # `recall_interval`, in the same session. Disabled (`0`) by default so
    # the `incremental` sweep measures each tier exactly once; the `recall`
    # scenario opts in with `recall_interval=5m` for a periodic monitor.
    # Note this paces the PHASE (one whole recall measurement per tick), not
    # the queries inside it — a per-query `rate:` would just trickle one
    # query per tick and never complete a measurement.
    interval: "{recall_interval}"
    # SRD-82 ErrorPolicy — recall queries run AFTER compaction, so they should
    # mostly succeed; a transient timeout is counted (not fatal). The `stop_when`
    # sanity backstop fails the phase only if the error rate exceeds
    # `error_rate_backstop` (same servo-layered threshold as `load_increment`,
    # set outside the servo margin) — meaning the recall measurement is
    # untrustworthy.
    errors: ".*:warn,counter"
    # Result-specific backstop, derived from base counters in the predicate
    # (result_failure terminal failed ops / cycles_total completed ops).
    # Non-sugared canonical form (see load_increment for the axis key). The
    # query error-rate crossing the backstop means the recall measurement is
    # untrustworthy → abort: cancel in-flight queries and stop the WHOLE run.
    stop_when:
      - condition: "(cycles_total > 100) & (to_f64(result_failure) > (to_f64(cycles_total) * {error_rate_backstop}))"
        pulse:   continuous
        per:     self
        action:  abort
        at:      workload
    bindings: |
      # Same masked tier as the load: name it by its masked position
      # idx_of(p), prebuffer the tier's own ground-truth facets.
      const tier := matching_profile_name_at('{dataset}', '{profile_pattern}', idx_of(p))
      const prebuffered := dataset_prebuffer(str_concat('{dataset}:', tier))
      const base := query_count(prebuffered)
      # Standard measurement: ONE pass over the tier's full query set (the
      # dataset's own query count), so every tier reports recall over the
      # same standard N queries.
      cursor q = range(0, base)
      # DISABLED 2026-07-23 — time-boxed form: repeated the query set until
      # `min_query_ms` had elapsed, sizing the measurement by TIME rather
      # than a standard query count, which made per-tier sample sizes
      # unequal (fast tiers repeated queries; slow tiers under-sampled).
      # Re-enable by swapping the cursor back:
      # cursor q = until_elapsed(base, min_query_ms)
      query_vector := query_vector_at(prebuffered, q % base)
      ground_truth := neighbor_indices_at(prebuffered, q % base)
      # Ground-truth neighbor DISTANCES for the same query (already in the
      # prebuffer — this facet loads once, ~Q*k*4 bytes). Feeds the LID
      # metric below; adds no Cassandra query.
      neighbor_distances := neighbor_distances_at(prebuffered, q % base)
    ops:
      select_ann:
        timeout: 60s   # 60s per read; retried up to the phase `tries` budget on a CQL timeout
        prepared: |
          SELECT [key] FROM {keyspace}.{table}
          ORDER BY value
          ANN OF {query_vector}
          LIMIT {limit}
        metrics:
          rows_per_op:
            kind: gauge
            value: count
          # Local intrinsic dimensionality (Levina–Bickel MLE) of THIS tier,
          # computed per query from the prebuffered ground-truth neighbor
          # distances — zero extra Cassandra queries, purely client-side
          # (see partitioned-scan-build.md §10: LID predicts whether a 1-D
          # vector-locality ordering can help — low & tight favours it,
          # high or heterogeneous does not). The histogram stores u64, so the
          # value is scaled ×1000: read p50/p90 and divide by 1000 to get the
          # dimension. Degenerate queries (duplicate/self-match neighbors)
          # emit 0 and should be read past when interpreting the low tail.
          lid_millidim:
            kind: histogram
            value: "lid_mle(neighbor_distances, k) * 1000"
        evaluations:
          relevancy:
            actual: key
            expected: ground_truth
            k: k
            r: limit
            functions:
              - recall

  recall_postload:
