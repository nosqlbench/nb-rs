      query_vector := query_vector_at(prebuffered, q % base)
      ground_truth := neighbor_indices_at(prebuffered, q % base)
      # Ground-truth neighbor DISTANCES for the same query (already in the
      # prebuffer — this facet loads once, ~Q*k*4 bytes). Feeds the LID
      # metric below; adds no Cassandra query.
      neighbor_distances := neighbor_distances_at(prebuffered, q % base)
    ops:
      select_ann:
        # Gate: only measure when THIS tier actually compacted; skips
        # (not fails) otherwise, so no-compaction tiers yield no
        # misleading "post" row.
        if: "enable_finalize != 0 && enable_compact != 0 && sstables > 1"
        # gutter/final — the phase's ✓ outcome DETAIL line carries the
        # primary measurement in its left-gutter cell: `recall <mean>`
        # resolved from the relevancy aggregates at phase end. The
        # header line's timing triad is untouched.
        gutter:
          final: "recall {recall}"
        timeout: 60s   # 60s per read; retried up to the phase `tries` budget on a CQL timeout
        prepared: |
          SELECT [key] FROM {keyspace}.{table}
          ORDER BY value
          ANN OF {query_vector}
          LIMIT {limit}
        metrics:
          rows_per_op:
            kind: gauge
            value: count
          # Local intrinsic dimensionality (Levina–Bickel MLE) of THIS tier,
          # computed per query from the prebuffered ground-truth neighbor
          # distances — zero extra Cassandra queries, purely client-side
          # (see partitioned-scan-build.md §10: LID predicts whether a 1-D
          # vector-locality ordering can help — low & tight favours it,
          # high or heterogeneous does not). The histogram stores u64, so the
          # value is scaled ×1000: read p50/p90 and divide by 1000 to get the
          # dimension. Degenerate queries (duplicate/self-match neighbors)
          # emit 0 and should be read past when interpreting the low tail.
          lid_millidim:
            kind: histogram
            value: "lid_mle(neighbor_distances, k) * 1000"
        evaluations:
          relevancy:
            actual: key
            expected: ground_truth
            k: k
            r: limit
            functions:
              - recall

# ---------------------------------------------------------------------------
# Reports. Rendered from the SESSION DB, which is written continuously, so the
# same command gives the same view during a run and after it — the view is a
# function of recorded state, not of run lifecycle. `nmbrs table compaction_shape`
# mid-run shows every tier finished so far; the in-flight tier renders `-` for
# anything derived from the phase duration (`finalize_time`,
# `index_bytes_per_ms`), because its phase has not closed and the value does not
# exist yet — absent rather than guessed.
#
# NOTE: a bare `nmbrs table compaction_shape` resolves the definition from the
# session db (`report.*` rows, snapshotted when the run started), so edits here
# do not show up in an already-running session. Pass
# `workload=adapters/cql/workloads/compaction_demo_derived.yaml` to render the
# current definition against the same data.
# ---------------------------------------------------------------------------

# ─────────────────────────────────────────────────────────────────────────────
# Compaction health report.
#
# Replaces a set of checked-in Python log-scrapers that recomputed medians,
# quantiles and windowed rates by hand. Everything here is a metricsql query
# over metrics this workload already publishes, so the analysis lives with the
# workload that produces it and travels with the session.
#
# Routing is left at the default (files under the session dir). `to` is an
# item-level directive, so add e.g. `to: sessiondir stdout` inside a table when
# you want one item echoed interactively.
# ─────────────────────────────────────────────────────────────────────────────
report:
  compaction_health: |
    file compaction_health.md as 'Compaction health'

    text health_intro as "What this covers":
     Pool pressure, SSTable growth and the windowed failure rates the
     abort backstops read, per tier. The servo's own view — weight,
     pressure and the flush term — is the last table: a tier whose
     weight sagged while `compaction_active` sat high was throttled by
     real merge backlog, one that sagged on the flush term alone was
     paying SAI flush-serialisation cost.

    table pool_pressure:
      group_by: part
      query: comp_active: avg(compaction_pool_active) by (part)
      query: comp_active_max: max(compaction_pool_active) by (part)
      query: comp_pending_max: max(compaction_pool_pending) by (part)
      query: flush_active_max: max(flush_pool_active) by (part)
      query: flush_blocked_max: max(flush_pool_blocked) by (part)
      query: sstables_max: max(table_sstables_live) by (part)

    text windowed_intro as "Windowed failure rates":
     The denominators here are TIME-bounded, not lifetime — a 55s
     trailing window, scoped to the loader phase. That is what makes the
     backstops scale-invariant: the same thresholds mean the same thing
     at 100k rows or 1B, and a healthy past cannot hide a failing
     present. `attempt_*` sees through retries; `result_*` does not.

    table windowed_failures:
      group_by: part
      query: attempt_fail_max: max(recent_attempt_failures) by (part)
      query: attempt_total_max: max(recent_attempt_total) by (part)
      query: result_fail_max: max(recent_result_failures) by (part)
      query: result_total_max: max(recent_result_total) by (part)

    table servo_response:
      group_by: part
      query: weight_mean: avg(load_weight) by (part)
      query: weight_min: min(load_weight) by (part)
      query: pressure_mean: avg(servo_pressure) by (part)
      query: flush_term_mean: avg(servo_flush_term) by (part)
      query: target_rate: avg(target_rows_rate) by (part)

    table tier_throughput:
      group_by: part
      query: ops: last(cycles_total) by (part)
      query: failures: last(result_failure) by (part)
      query: p99_ms: max(cycles_servicetime_p99) by (part)
