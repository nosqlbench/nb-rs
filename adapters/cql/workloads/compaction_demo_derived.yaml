#!/usr/bin/env nmbrs
# Incremental profile-sweep compaction recall test (derived from
# compaction_demo.yaml).
#
# Instead of loading a single profile of a dataset, this workload walks
# the dataset's profiles as SIZE TIERS, lowest-numbered (smallest) first,
# and at each tier:
#   1. loads ONLY the incremental vectors since the previously loaded
#      tier  (`range(prev_count, this_count)`),
#   2. flushes + major-compacts (the compaction-demo behaviour), and
#   3. runs a recall check against THAT tier's own ground-truth set.
# It stops at the configured maximum size (`max_size`) or the last
# profile, whichever comes first.
#
# The sweep is a cursor-PARTITION comprehension (SRD-71):
#   - `profile_partitions("{dataset}", "{profile_pattern}")` partitions
#     the dataset's vector space by the profiles matching the pattern,
#     treated as cumulative size tiers in ascending order. Each partition
#     `part` spans `[previous tier size, this tier size)` — the incremental
#     range — so `range(start_of(part), end_of(part))` loads ONLY the delta. A
#     partition carries its own start, so no cross-iteration carry is
#     needed.
#   - `profile_pattern` follows the literal / glob / regex promotion
#     (`pattern_match`): `*m` and `*mi` select different suffix series so
#     their progressions aren't mixed.
#   - per-tier ground truth: name the tier with
#     `matching_profile_name_at(..., idx_of(part))`, prebuffer its own
#     facets, and recall with `query_vector_at` / `neighbor_indices_at`.
#   - `continue_if: "end_of(part) <= effective_max_size"` (SRD-101) caps the
#     sweep: a pre-entry gate on the tier loop stops BEFORE the first tier
#     whose cumulative size would exceed the cap (sizes ascend; the last
#     in-budget profile is the natural end), ending the sweep gracefully.
#     `effective_max_size` defaults to the dataset's full base-vector count
#     (`max_size=0`); a positive `max_size` caps below it.
#
# A dataset with only the default profile yields a single tier (one full
# load + recall). A dataset with multiple profiles uses the matching
# tiers instead, smallest first.
#
# Usage:
#   nmbrs workload=compaction_demo_derived.yaml host=10.0.0.1
#   nmbrs workload=compaction_demo_derived.yaml max_size=500000

description: |
  Incremental profile-sweep compaction recall test: walk a dataset's
  profiles as size tiers (smallest first), load only the incremental
  vectors at each tier, flush + major-compact, and measure ANN recall
  against that tier's ground truth — up to a configured max size or the
  last profile. Derived from compaction_demo.yaml; requires a
  vector-capable CQL target, a Jolokia agent on :8778, and a local
  vector dataset catalog.

params:
  # `tries` = TOTAL attempts per op on retryable errors (SRD-82: the sigil
  # for the conditional tries wrapper). Root 20 — inherited by the
  # data-plane and orchestration phases. The non-iterative setup phases
  # (teardown / schema / tune_cluster) pin `tries: 1` explicitly: their
  # statements are one-shot DDL / control calls where a retry burns minutes
  # on something that will never succeed (the teardown truncate on a first
  # run) or is simply pointless to repeat.
  #
  # `timeout` is NOT set at the root: a root timeout would override each
  # op's own request timeout, clobbering the long-running orchestration ops
  # (flush / compaction). Instead the read/write ops set `timeout: 60s`
  # themselves (below); the orchestration ops keep their own longer
  # request_timeout_ms.
  tries: 20
  # `connect_timeout` = how long the driver waits to ESTABLISH a connection
  # (the control connection + each per-host connect). The cassandra-cpp default
  # (5s) is too short for a distant / cold / slow-to-accept cluster — a control-
  # connection `Connection timeout` is exactly that boundary expiring. 5 minutes
  # is deliberately generous so a loaded or just-starting cluster still connects;
  # drop it on the CLI (`connect_timeout=30s`) for a nearby cluster.
  connect_timeout: 5m
  # ── Connection-survival knobs (cassandra-cpp engine) ─────────
  # During a server stall (GC pause / compaction storm) heartbeats go
  # unanswered; once a connection exceeds `connection_idle_timeout`
  # without a successful heartbeat response the driver kills it, the
  # host leaves the policy, and EVERYTHING fails instantly with
  # LIB_NO_HOSTS_AVAILABLE until reconnect. Relaxed timings so the
  # client rides THROUGH node stalls instead of ejecting the host:
  # heartbeats keep probing every 30s (driver default), but a
  # connection is only declared dead after 5 MINUTES without a
  # response (driver default: 60s). In-flight requests still honour
  # their own `timeout:` — these govern the connection, not requests.
  # If a stall outlasts even that, reconnect promptly (1s..10s
  # backoff) rather than the driver's default 2s..10m crawl.
  heartbeat_interval: 30s
  connection_idle_timeout: 5m
  reconnect_base_delay: 1s
  reconnect_max_delay: 10s
  # `error_rate_backstop` = the SANITY-BACKSTOP result-level error rate
  # (a proportion in [0,1]) for `recall_check` — a modular,
  # workload-expressed breaker, NOT the machine's built-in
  # `error_rate_max`. The rate is DERIVED IN THE PREDICATE from the base
  # counters (`result_failure` terminal failed ops / `cycles_total`
  # completed ops — the instrument names), never a precomputed rate wire. Set it LOOSER than
  # the adaptive rate servo's operating margin so the servo throttles
  # first and this only trips on a genuine runaway. Tune on the CLI
  # (`error_rate_backstop=0.02`).
  error_rate_backstop: 0.05
  # `attempt_failure_backstop` = the ATTEMPT-level sickness threshold for
  # `load_increment` (a proportion in [0,1]), likewise derived in the
  # predicate from the base counters (`attempt_failure` failed attempts /
  # `attempt_total` resolved attempts — the instrument names; both count
  # at attempt resolution). Attempts see THROUGH retries: the
  # result-level rate stays green while a `tries:` budget absorbs
  # failures (r: climbing, att:% sinking), so this is the breaker that
  # catches a drowning server early. Tune on the CLI
  # (`attempt_failure_backstop=0.25`).
  attempt_failure_backstop: 0.10
  # `result_failure_backstop` = the RESULT-level terminal-failure rate for
  # `load_increment` (a proportion in [0,1]), derived in the predicate from
  # `result_failure` (terminal failed ops) / `cycles_total` (completed ops).
  # Paired with a 100-failure floor so a stray failure deep into a load does
  # not kill the run — only a sustained terminal-failure rate does. Tune on
  # the CLI (`result_failure_backstop=0.05`).
  result_failure_backstop: 0.025
  # `result_failure_window_floor` = the minimum terminal failures INSIDE
  # THE TRAILING WINDOW for the windowed backstop below (stcs_adaptive
  # only). The 2026-08-05 wedge exposed the real flaw in the lifetime
  # backstop pair: its denominator is the WHOLE tier's cycle count, so
  # a 100%-failing present hid under a healthy past (7,594 holes at
  # 0.02% lifetime rate; the 2.5% trip needed ~924k). The fix keeps the
  # rate-with-floor DESIGN but bounds the denominator by TIME: the
  # compaction_watch daemon publishes 55s-trailing failure/result
  # counts (55s keeps the metricsql read inside the SRD-90 in-memory
  # counter horizon — no sqlite touch on a live db), and the loader
  # aborts when the trailing window holds >= this floor AND the
  # windowed rate crosses `result_failure_backstop`. Time-bounded
  # denominators are scale-invariant: the same thresholds mean the
  # same thing at 100k rows or 1B. Tune on the CLI.
  result_failure_window_floor: 100
  # `attempt_saturation_rate` / `attempt_window_floor` = the SATURATION breaker.
  #
  # The 2026-08-25 hang exposed a gap both existing breakers share. The windowed
  # result-level clause needs `result_failure_window_floor` (100) TERMINAL failures
  # inside 55s, but a terminal failure only lands after the whole `tries:` budget is
  # spent: 20 attempts at up to 60s each, plus ~133s of capped backoff. Under a full
  # stall the loader therefore produces almost no TERMINAL failures per window and the
  # floor is unreachable exactly when it matters. The attempt-level clause sees through
  # retries, but its denominator is LIFETIME `attempt_total`, so a long healthy past
  # dilutes a 100%-failing present below the 0.10 threshold — the same wedge the
  # 2026-08-05 note describes for the result-level pair, still present on attempts.
  #
  # This clause closes it: a WINDOWED attempt-level rate. Attempts resolve at their own
  # timeout rather than at the end of the retry budget, so at concurrency 200 with a 60s
  # timeout a full stall yields ~180 resolved attempt failures per 55s window — far above
  # the floor even after the servo throttles hard. The floor stays low deliberately: it
  # exists to stop a cold-start blip from tripping the breaker, not to gate saturation.
  attempt_saturation_rate: 0.90
  attempt_window_floor: 20
  adapter: cql
  # ── Environment defaults captured from `runtest` (2026-08-03) ──
  # The standing test environment, promoted from the wrapper script so
  # `nmbrs run workload=compaction_demo_derived scenario=serialized_baseline`
  # reproduces it with no extra script. CLI overrides still win. (These
  # are adapter/runner-tier params — a scenario-level `set:` cannot
  # reach driver selection or the sysmon subsystem, which is why they
  # live here rather than inside the scenario.)
  host: server1
  dataset: ibm-datapile-1b
  cqldriver: cassandra-cpp
  sysmon: any
  profile: default
  keyspace: baselines
  # `table` is NOT a param — it is derived (sanitized) from the dataset
  # and profile in the top-level `bindings:` block below, so a different
  # `dataset=`/`profile=` automatically lands in its own table.
  # Raised 100 -> 200 (2026-07-23): with smaller memtables (cheaper
  # per-insert graph search) and the merge CPU bound (concurrent_builds=2,
  # build pool 40), the extra in-flight converts the latency headroom into
  # throughput (Little's law: rate = fibers / per-batch service time).
  concurrency: "200"
  query_concurrency: "20"
  replication: "{'class': 'SimpleStrategy', 'replication_factor': '1'}"
  # k / limit / min_query_ms are referenced as bare wires (`k: k`,
  # `r: limit`, `until_elapsed(base, min_query_ms)`), so they are
  # numeric params, not strings.
  k: 10
  limit: 100
  min_query_ms: 10000
  # `recall_interval`: how often to RE-RUN `recall_check` within the SAME
  # session (the SRD-82/92 `interval:` phase wrapper). `0` (the default)
  # disables scheduling — recall runs once per tier, which is what the
  # `incremental` sweep wants. Set it to a duration to turn the `recall`
  # scenario into a periodic monitor whose measurements all land in ONE
  # session / one metrics timeline (an external shell loop cannot do that —
  # each `nmbrs run` is its own session). With no `repeat:` bound it runs
  # until the session is stopped (Ctrl-C). E.g. recall at 900M every 5min:
  #   nmbrs run workload=compaction_demo_derived scenario=recall \
  #     profile_pattern='^900m$' recall_interval=5m dataset=… host=…
  recall_interval: 0
  # Open-extent budget for the `concurrent_query` daemon's cursor. The
  # daemon is cut short by the foreground's completion (its `daemon_stop`),
  # so this only needs to exceed the longest tier's ingest+index time —
  # set generously (default 24h). Until-stopped is the SRD-82 Part 6
  # follow-up that would remove the need for a budget here.
  query_budget_ms: 86400000
  vector_idx_suffix: _vector_idx

  # SAI jvector index build knob (the only index-construction param
  # besides the computed `similarity_function`); all other build knobs
  # are left at the server defaults.
  source_model: [other]

  # ── Incremental profile sweep controls ───────────────────────
  # `profile_pattern`: which profiles form the sweep, by the literal /
  #   glob / regex promotion (`pattern_match`). `*` = all profiles; `*m`
  #   vs `*mi` selects one suffix series so progressions aren't mixed;
  #   `^vec_(1|2|4)m$` for an explicit regex set.
  #
  #   DEFAULT here = the DECADE profiles only: the single-significant-digit
  #   sizes 100k..900k, 1m..9m, 10m..90m, 100m..900m (36 tiers). A dataset
  #   like ibm-datapile-1b ships a dense "detent" zoo — decade steps PLUS
  #   Fibonacci (13m,21m,34m,55m,89m,…), power-of-two `…mi` (16mi,64mi,…),
  #   and interior 10m splits (110m,120m,…). Recall verification at a fine
  #   interior tier (e.g. 340m) runs against that many base vectors and is
  #   slow while adding little to the characterization curve, so the sweep
  #   condenses to decades. This ONE pattern drives EVERY profile sequence
  #   in the workload — `profile_partitions` and `matching_profile_name_at`
  #   both mask through `masked_profile_tiers`, so the increments follow the
  #   filtered set: after 500m the next tier is 600m (a 100m load), with no
  #   interior 510m..590m tiers between them.
  #
  #   The alternation is anchored per-branch by `promote_pattern`'s
  #   `^(?:…)$` wrap, so `[1-9]m` matches `1m`..`9m` but NOT `1mi`, `10m`,
  #   or `21m`. Set `*` to restore the full dense sweep.
  # `max_size`: stop once a tier's cumulative base-vector count would
  #   exceed this; the last loaded tier is the largest matching profile
  #   that fits (or the last matching profile, whichever comes first).
  #   `0` (the default) means NO cap — it resolves at runtime to the
  #   dataset's actual base-vector count (`vector_count` of the base
  #   facet), so by default the sweep loads every tier up to the full
  #   dataset. Set a positive value to cap; accepts magnitude suffixes on
  #   the CLI (decimal `10m`/`2b`, binary `4Gi`) since the default is
  #   numeric. See `effective_max_size` in the top-level `bindings:`.
  profile_pattern: "^([1-9]00k|[1-9]m|[1-9]0m|[1-9]00m)$"
  max_size: 0

  # ── Insert batch-stride probe ────────────────────────────────
  # `measure_probe_rows`: the size of the leading base-vector slice the
  # one-shot `measure_batch` phase inserts to characterise the insert
  # batch stride. It writes this many rows (keys [0, measure_probe_rows))
  # as a byte-budgeted UNLOGGED batch and reads back the rows the batch
  # actually wrote (`count`) — floored to a round number and frozen as
  # the main loader's `batch: stride`. Kept small (a single probe batch);
  # the rows it writes are re-inserted idempotently by tier 1's load, so
  # the probe does not perturb the data. Numeric so it accepts magnitude
  # suffixes on the CLI.
  measure_probe_rows: 2000
  # `batch_size`: EXPLICIT insert batch stride (rows per batch op). `0`
  # (the default) = auto: run the one-shot `measure_batch` probe and use
  # its measured stride. A positive value takes precedence over the
  # measured stride AND bypasses the probe entirely (its op no-ops via
  # `if:`). Numeric, so CLI magnitude suffixes work (`batch_size=2k`).
  batch_size: 100

  # ── Post-load step toggles (1 = enabled, 0 = skipped) ────────
  # Independently enable/disable each post-load step per tier. All OFF by
  # default — the base sweep just loads each tier with no post-load work;
  # opt into the steps you want on the CLI (e.g. `enable_finalize=1
  # enable_compact=1`).
  enable_flush: 0      # forced memtable flush after each tier's load
  enable_finalize: 0   # the finalize_index phase (flush + sstable read + compaction)
  enable_compact: 0    # the forced major compaction (inside finalize_index)

  # Terminal forced-major arm of the tail protocol (finalize_index +
  # recall rounds 5,6 — the "compacted" state). OPT-IN: a whole-table
  # major at 100M+ scale is an hours-long index rebuild (measured
  # 2026-08-07: the 127M-node build ran ~401 nodes/s cache-cold), so
  # the default tail ends at the settled state and the compacted arm
  # is a deliberate spend: `enable_terminal_compact=1`.
  enable_terminal_compact: 0

  # Proof-of-compaction bound. When `enable_compact=1`, the last finalize op
  # asserts the table settled to at most this many sstables; more than this
  # means the compaction never ran, died, or left the table unmerged, and the
  # workload fails rather than reporting timings for an uncompacted shape.
  # Only meaningful when compaction is explicitly requested — with
  # `enable_compact=0` nothing promised a segment count, and the check is
  # skipped. The trigger call itself is fire-once and may legitimately time
  # out client-side (the server keeps working), so this assertion — not the
  # call's return — is what proves the compaction happened.
  max_postfinal_segments: 5


  # When set (=1), pin the table's STCS min/max thresholds to 100000 in
  # the CREATE TABLE DDL so the size-tier compactor never fires
  # spontaneously mid-load — the test owns compaction timing explicitly.
  # When unset (default 0), no compaction clause is emitted and the
  # server's default STCS behaviour applies (background compactions run).
  disable_auto_compaction: 0

  # When set (=1) together with disable_auto_compaction=0, the CREATE
  # TABLE emits BARE SizeTieredCompactionStrategy — the server's own
  # STCS defaults (min_threshold 4, max_threshold 32, buckets 0.5/1.5)
  # — instead of the tuned 5/8 + liberal-bucket variant. This is the
  # `stcs_adaptive` scenario's compaction posture: real STCS defaults,
  # background compactions fully in charge.
  stcs_defaults: 0

  # ── stcs_adaptive: compaction-pressure ingest servo ──────────
  # Derived 2026-08-03 from the two most recent large studies
  # (keepsessions/default_20260801_043336 — 5.1M samples, 36-tier
  # 100k→300M serialized sweep; corroborated by
  # keepsessions/default_20260719_013407):
  #
  #   probe ANN latency (median of per-window means):
  #     idle                 58 ms
  #     compaction only     307 ms   (×5.3 over idle)
  #     ingest only         766 ms   (×13.2 over idle)
  #   unthrottled ingest   ≈15.2k rows/s (p25 14.9k, p95 15.9k)
  #   compaction drain     ≈75 MiB/s median (p90 249 MiB/s)
  #
  # Reading: INGEST, not compaction, is the dominant read-latency
  # driver — so when a compaction is running, throttling ingest both
  # protects read latency and frees the compactor to finish. One
  # RUNNING compaction is the "somewhat encumbered" state (reads
  # already inflate ~5× over idle; multiple sstables alone are
  # normal and carry no penalty here). A growing PENDING queue means
  # the compactor is falling behind — ingest must taper hard or the
  # sstable count runs away.
  #
  # The weight is a bounded rational polynomial (Hill form) of the
  # compaction pressure, computed per loader cycle from the shared
  # wires the `compaction_watch` daemon maintains:
  #
  #   pressure    = active + pending_weight × pending
  #   load_weight = 1 / (1 + (pressure / backoff_half) ^ backoff_power)
  #   rows/s      = max(floor_rows_rate, base_rows_rate × load_weight)
  #
  # With the defaults (half 1.25, power 1.5, pending_weight 2.0):
  #   active=0 pending=0 → 1.00   full base rate
  #   active=1 pending=0 → 0.58   somewhat encumbered
  #   active=1 pending=1 → 0.21
  #   active=1 pending=2 → 0.11   tapering hard
  #   active=1 pending=4 → 0.05   → floor
  #
  # Named control points (tune on the CLI):
  #   backoff_half   — pressure at which ingest HALVES. Lower =
  #                    stronger backoff (0.75 is aggressive; 2.0 lets
  #                    two concurrent compactions ride at half rate).
  #   backoff_power  — taper steepness past the half point. Higher =
  #                    sharper knee (1.0 = gentle 1/x tail; 2.5 =
  #                    near-cliff once the queue forms).
  #   pending_weight — how much heavier a QUEUED compaction weighs
  #                    than a running one (queue growth = falling
  #                    behind; 2.0 from the studies' drain margins).
  # All control points are f64-literal text (note the decimals)
  # because params reach polydat as typed literals.
  backoff_half: 1.25
  backoff_power: 1.5
  pending_weight: 2.0
  # ── flush term (added from the 2026-08-04 calibration run,
  #    keepsessions/stcs_adaptive_20260804_005327) ──
  # The 40M calibration confirmed the compaction control points at
  # their designed values — w(A=1)=0.583 held 75.8% of the run,
  # w(A=2)=0.331 for 4.7%, compaction pending NEVER >0, probe ANN
  # medians 7.6/17.6/8.6 ms at A=0/1/2 (the A=2 inversion: backing
  # ingest off protects reads) — and exposed the one blind spot:
  # FLUSH backlog. Measured ingest capacity by MemtableFlushWriter
  # active count, in compaction-free windows:
  #     FA=0  12,004 rows/s      FA=1  12,004 rows/s  (free)
  #     FA=2..3  transient passthrough (n=2/1)
  #     FA=4  0 rows/s (n=32)   — the memtable-cap CLIFF
  # One active flush is the normal pipeline and costs nothing
  # (flush_grace = 1.0, empirically exact). Beyond it there is no
  # measured gradient — only the cliff — so the linear ramp is a
  # safety interpolation whose job is to taper HARD before FA can
  # reach 4: pressure += flush_weight × max(0, FA − flush_grace).
  # flush_weight defaults to 2.0 by the same principle as
  # pending_weight: work the pipeline cannot start counts double.
  # With the defaults: FA=2 → w 0.33, FA=3 → w 0.10, FA=4 → w
  # 0.05 ≈ floor; combined A=1+FA=2 → pressure 3 → w 0.21.
  #
  # ── RECALIBRATED 2026-08-21 (sessions/stcs_adaptive_20260821_194852) ──
  # grace 1.0 → 2.0. The FA=2..3 band above was interpolated from
  # n=2 and n=1 samples on the assumption that it is a TRANSIENT
  # excursion toward the FA=4 cliff. Post-jvector-changes it is the
  # STEADY STATE, and the interpolation was throttling a healthy
  # pipeline continuously. Measured over 53 windows of that run:
  #
  #   flush_pool_active   = 2 or 3 in 48/53 windows (90.6%)
  #   flush_pool_pending  = 0 in ALL 53
  #   flush_pool_blocked  = 0 in ALL 53
  #   compaction_active   = 0 in 48/53 (the compaction servo this
  #                         workload is NAMED for contributed nothing)
  #   host cpu_util       median 0.183, io_util median 0.008
  #
  # So ~all backoff came from the flush term, on a flush pipeline
  # that was keeping up perfectly, on an 18%-CPU host: A=0 FA=2 →
  # pressure 2 → w 0.331 → 3,968 rows/s for 52.9% of the run, and
  # A=0 FA=3 → pressure 4 → w 0.149 → 1,783 rows/s for 29.4%.
  #
  # grace 2.0 frees the now-normal FA=2 while KEEPING a pre-cliff
  # taper (FA=3 → w 0.331, FA=4 → w 0.149). It is deliberately not
  # 3.0: the FA=4 cliff is real (0 rows/s, n=32) and this term's job
  # is to taper before reaching it — freeing FA=3 as well would
  # leave nothing between normal and the cliff.
  #
  # NOT keyed on pending/blocked, though those are the textbook
  # backlog signals: this pool does not report distress that way.
  # See the capture comment on `flush_active_live` — 2026-08-04, a
  # single active MemtableFlushWriter (serial SAI graph
  # serialization) stalled ingest for minutes with pending and
  # blocked both reading 0.
  #
  # Revert = this one line. Watch the FA distribution after the
  # change: if FA=4 starts appearing, the early taper was load-
  # bearing after all and grace belongs back at 1.0.
  flush_weight: 2.0
  flush_grace: 2.0
  # base_rows_rate ≈ 80% of the measured unthrottled capacity —
  # nominal utilization with steady headroom, instead of the
  # saturation point where read latency sat at ~766ms. floor keeps a
  # trickle so the pipeline never fully parks (rate() windows stay
  # alive and recovery is observable).
  base_rows_rate: 12000.0
  floor_rows_rate: 300.0
  # (compaction_watch's poll rate is a LITERAL `rate: 0.5` on the
  # phase, not a param: the `rate:` field does not interpolate, and
  # an unparseable rate is silently IGNORED — the interpolated form
  # ran the watch unthrottled at 268-504 polls/s in every run
  # through 2026-08-04, ~500-1000 parasitic virtual-table queries/s.
  # Measured in keepsessions/stcs_adaptive_20260804_005327.)
  # Adaptive sweep shape: start straight at the 10M-row decade tiers
  # (skip 100k/1m — this configuration studies compaction under
  # sustained bulk ingest, and the small tiers stay memtable-resident)
  # and cap at 40M vectors. `final_recall_pattern` MUST name the last
  # in-budget tier (the post-flush recall measures against its ground
  # truth) — keep it in sync when changing adaptive_max_size.
  adaptive_profile_pattern: "^[1-9]0m$"
  adaptive_max_size: 40000000
  final_recall_pattern: "^40m$"

  # ── tune_cluster knobs (paramized 2026-08-03) ────────────────
  # Historical hardcoded values preserved as defaults: throughput 0
  # (Cassandra's "no rate limit" sentinel) + 10 concurrent compactors.
  # The adaptive scenario's lever when compaction needs restraining is
  # `compaction_throughput_mbps=64` (etc.) on the CLI — the ingest
  # servo then sees longer-running compactions and holds the taper.
  compaction_throughput_mbps: 0
  concurrent_compactors: 10

# Derived identifiers, visible to every phase's op text. The CQL table
# holds the cumulative vectors for this dataset+profile, so its name is
# sanitized from them (every character outside [a-zA-Z0-9_] → '_')
# rather than hard-coded — `dataset=ibm-datapile-1b profile=default`
# becomes table `ibm_datapile_1b_default`. (CQL folds the identifier to
# lowercase; dataset names are letter-leading in practice.)
bindings: |
  const table := regex_replace("{dataset}_{profile}", "[^a-zA-Z0-9_]", "_")
  # Effective sweep cap. `max_size=0` (the default) means "the whole
  # dataset", resolved here to the dataset's actual base-vector count
  # (`vector_count` auto-opens the base facet); a positive `max_size`
  # CLI override caps below that. Effectively-const (bound once at
  # scope init), read by the `continue_if: "end_of(part) <=
  # effective_max_size"` sweep gate on the tier loop below (SRD-101).
  const effective_max_size := if(max_size > 0, max_size, vector_count("{dataset}:{profile}"))
  # Terminal forced-major arm toggle, frozen as a typed const: SRD-101
  # sweep gates resolve outer-scope CONSTS through the per-iteration
  # cascade (see continue_if_sweep.yaml). A bare param in a literal-list
  # sweep's predicate fails CLOSED (measured 2026-08-08: `arm_pass <=
  # param` never entered even at param=1) — while the tier loop's
  # partition-sweep gate resolves its bare param fine, an inconsistency
  # to be chased separately. The const form is correct in both shapes.
  const terminal_compact_cap := enable_terminal_compact
  # Workload-root SHARED cell for the measured insert batch stride
  # (SRD-66/67). The early `measure_batch` phase writes THROUGH to this
  # cell its byte-budgeted batch's rows-written `count` (Change 1: a CQL
  # write now reports the rows it wrote as `count`), floored to a round
  # number. The tier loop then FREEZES it as `const stride` (below) and
  # the main `load_increment` insert drives `batch: stride` off it, so
  # the loader's cursor stride is one measured batch-worth instead of a
  # single row. Literal-initialised to 1.0 — F64 ON PURPOSE: the probe
  # writes `floor_decade(...)`, which is F64, and a shared cell must keep
  # ONE type for its whole life (the `if()` in the stride freeze compiles
  # typed bridges against the cell's declared type; a runtime U64→F64
  # flip would trap on that bridge). A run that skips the measure phase
  # still has a valid (single-row) stride; the `batch:` resolution
  # coerces the F64 stride to a row count.
  shared measured: f64 := 1.0

  # Live sstable count for the CURRENT tier, written through from
  # `finalize_index`'s `read_sstables` capture. Root-scoped (2026-07-23) so
  # the sibling `recall_postcompact` phase can gate on "did this tier
  # actually compact" (`sstables > 1`). Re-written each tier before it is
  # read; 0 until the first finalize.
  shared sstables: u64 := 0

  # Vector-index segment shape for the CURRENT tier's compaction, written
  # through from `finalize_index`'s `segment_sizes` capture. Declared here so
  # the drain memo can interpolate them while it waits, and so a later phase
  # could gate on the shape. Zero until the first finalize.
  shared segments:        u64 := 0
  shared seg_bytes_min:   u64 := 0
  shared seg_bytes_max:   u64 := 0
  shared seg_bytes_total: u64 := 0
  shared tbl_bytes_total: u64 := 0
  # Per-segment index sizes, slurped as a JSON array — the individual segment
  # sizes being merged, not just their summary. Carried as a string because the
  # value is a list, not a scalar.
  shared seg_index_bytes: String := "[]"

  # ── stcs_adaptive live-pressure wires (SRD-93-era) ────────────
  # Written through by the `compaction_watch` daemon each poll; read
  # per cycle by `load_increment_adaptive`'s rate servo. Root-scoped so
  # the daemon (one scope) and the loader (a sibling scope) share them.
  # Distinct from `sstables` above (finalize's one-shot read) — these
  # are the LIVE view while ingest and background STCS run together.
  shared live_sstables:             u64 := 0
  shared active_compactions_live:   u64 := 0
  shared pending_compactions_live:  u64 := 0
  shared flush_active_live:         u64 := 0
  shared flush_pending_live:        u64 := 0
  shared flush_blocked_live:        u64 := 0
  # Trailing-window loader health (2026-08-05 incident): terminal
  # failures and terminal results over the last 55s, computed by the
  # watch daemon from the live metric store. The loader's windowed
  # abort backstop reads these — cheap wire predicate at continuous
  # pulse, heavy metricsql only at watch cadence.
  shared recent_result_failures:    f64 := 0.0
  shared recent_result_total:       f64 := 0.0
  # Attempt-level twins. Attempts resolve at their own timeout instead of at the end of
  # the retry budget, so these saturate immediately when the server stalls whereas the
  # result-level pair above lags by minutes per op.
  shared recent_attempt_failures:   f64 := 0.0
  shared recent_attempt_total:      f64 := 0.0

scenarios:
  # Default: the incremental size-tier sweep.
  default:
    - scenario: incremental

  incremental:
    - teardown
    - schema
    - tune_cluster
    # One-shot insert-batch-stride probe: write one byte-budgeted batch and
    # read back its rows-written `count` into the `shared measured` cell,
    # BEFORE the tier loop freezes it as `const stride`. Runs after `schema`
    # (the table exists) and before any tier load.
    - measure_batch
    # Walk the masked profiles smallest-first as cumulative size tiers.
    # `profile_partitions` yields one partition per matching profile;
    # partition `part` spans `[previous tier size, this tier size)` — the
    # incremental range — and carries its masked position as `idx_of(part)`.
    - for: "part in profile_partitions('{dataset}', '{profile_pattern}')"
      # SRD-109 — one report-table row per tier, in the `tier` view.
      anchor: tier
      # SRD-101 — bound the sweep: a pre-entry gate on the tier iteration. The
      # walker evaluates this before entering each tier; the moment a tier's
      # cumulative base-vector count would exceed `effective_max_size` (the
      # dataset's full base count by default), the over-budget tier is NOT run
      # and the sweep ends gracefully (Interrupted+Succeeded, exit 0), with a
      # `continue_if:` marker recording the actual coordinate. `each` defaults
      # to `scenario` (this tier loop). Replaces the three per-op `if:` gates
      # that used to no-op past the cap while still iterating every tier.
      continue_if: "end_of(part) <= effective_max_size"
      phases:
        # Each tier is FOUR sibling sub-scopes (SRD-82 Part 6 daemon
        # isolation), capturing recall BEFORE and AFTER compaction:
        #   tier_load          load + flush, shadowed by the
        #                      `concurrent_query` daemon (stops when the
        #                      scope's foreground completes)
        #   recall_postload    UNCONDITIONAL recall over the standard query
        #                      set — the pre-compaction measurement
        #   tier_compact       finalize (flush/read/compact/drain), again
        #                      daemon-shadowed by its own
        #                      `concurrent_query` instance
        #   recall_postcompact recall AFTER compaction — its op is gated on
        #                      `sstables > 1` (the tier actually compacted)
        # The recall phases run in SIBLING scopes after each daemon has
        # stopped, so probe load never perturbs a measurement; the phase
        # NAMES are the before/after labels in every readout and metric.
        - scenario: tier_load
        - recall_postload
        - scenario: tier_compact
        - recall_postcompact

  # The build half of one tier: load the incremental vectors, flush, and
  # major-compact — shadowed by the `concurrent_query` daemon. Rooted as
  # its OWN scope (a `scenario:` include) so the daemon's stop boundary is
  # this group's completion, NOT the whole tier (which would include the
  # recall check). `concurrent_query` is listed FIRST so it is spawned in
  # daemon mode (off the foreground budget) BEFORE the ingestion phase and
  # runs at 1/s for the whole build, then stops cleanly when
  # `finalize_index` completes. The for-loop tier `part` is in scope here
  # (inherited from the enclosing `for:`), so the phases resolve
  # `idx_of(part)` / `start_of(part)` / `end_of(part)` unchanged.
  tier_load:
    - concurrent_query
    # Freeze the measured batch stride for THIS tier's load. `const stride`
    # is an extern-no-default freeze of the workload-root `shared measured`
    # cell AT SCOPE ACTIVATION (SRD-67 Phase 5) — the value the early
    # `measure_batch` phase wrote. Scoped to its `phases:` child, so
    # `load_increment`'s `batch: stride` resolves it. The `concurrent_query`
    # daemon (spawned above) still shadows the whole foreground of this
    # scope — this inner bindings layer only wraps the loader, it does not
    # change when the daemon stops (still at `finalize_index` completion).
    - bindings: |
        # Explicit `batch_size` param wins; else the probe's measurement.
        const stride := if(batch_size > 0, batch_size, measured)
      phases:
        - load_increment
    - flush

  # The compaction half of one tier, in its OWN daemon-shadowed scope so
  # `recall_postload` can run between flush and compaction. A fresh
  # `concurrent_query` daemon instance shadows the finalize, preserving
  # query load during compaction exactly as the pre-split `tier_build` did.
  tier_compact:
    - concurrent_query
    - finalize_index

  # Single-phase scenarios for piecewise runs.
  reset:   [teardown]
  ddl:     [schema]
  compact: [finalize_index]
  settle:  [settle_compactions]

  # ── serialized_baseline — the `runtest` protocol, captured ────
  # The exact configuration the `runtest` wrapper script emitted
  # (2026-08-03): the incremental sweep with every post-load step
  # forced serialized — per-tier flush, finalize (flush + sstable
  # read + forced major compaction + drain) — under STCS-enabled
  # background compaction (disable_auto_compaction=0). Environment
  # params (host/dataset/cqldriver/sysmon) are the workload defaults
  # above, so this runs scriptless:
  #   nmbrs run workload=compaction_demo_derived scenario=serialized_baseline
  serialized_baseline:
    - set: { disable_auto_compaction: 0, enable_finalize: 1, enable_flush: 1, enable_compact: 1 }
      phases:
        - scenario: incremental

  # ── stcs_adaptive — compaction-pressure-adaptive bulk ingest ──
  # The deserialized protocol: STCS DEFAULTS own compaction timing
  # (no scheduled flush, no finalize, no forced per-tier compaction),
  # while the ingest rate adapts to live compaction pressure via the
  # weighting polynomial (see the params block for the derivation and
  # control points). Per tier:
  #   - `compaction_watch` daemon polls the virtual tables
  #     (system_views.thread_pools / sstable_indexes) into the shared
  #     pressure wires,
  #   - `concurrent_query` probes read latency at 1/s (the
  #     "not overly penalizing the read latency" evidence),
  #   - `load_increment_adaptive` ingests with its rate servo'd by
  #     the pressure weight.
  # Ingest STOPS for each recall measurement (the daemons stop when
  # the tier's ingest scope completes; recall runs in the sibling
  # step) — but there is deliberately NO pre/post-flush recall pair:
  # one recall per tier, measured over whatever mix of memtable +
  # naturally-flushed sstables STCS has produced. Multiple sstables
  # during recall are NORMAL here. At the end: ONE forced large
  # flush, then one additional post-flush recall at the final tier.
  stcs_adaptive:
    - set: { disable_auto_compaction: 0, stcs_defaults: 1, enable_flush: 1, enable_finalize: 0, enable_compact: 0 }
      phases:
        - teardown
        - schema
        - tune_cluster
        - bindings: |
            const profile_pattern := "{adaptive_profile_pattern}"
          phases:
            - measure_batch
            - for: "part in profile_partitions('{dataset}', '{profile_pattern}')"
              # SRD-109 — same `tier` view as the serialized loop:
              # identical coordinate (part), so both flows share one
              # per-tier table and empty columns mark the flow that
              # doesn't emit a family.
              anchor: tier
              continue_if: "end_of(part) <= adaptive_max_size"
              phases:
                # The watch daemon lives at TIER scope — listed first so
                # it spawns off the foreground budget and shadows BOTH
                # the ingest scope and the recall step: the recorded
                # pool/sstable gauges cover the recall windows too, so
                # post-run analysis can correlate recall latency with
                # live compaction state (the encumbered-read evidence).
                - compaction_watch
                - breaker_watch
                - scenario: tier_ingest_adaptive
                - recall_check
        # The single forced large flush: everything still
        # memtable-resident at the end of the sweep rolls to disk in
        # one shot (natural size-pressure flushes already happened
        # along the way; this captures the tail so the terminal
        # recalls measure a fully on-disk table).
        - flush
        # ── terminal recall protocol: 2 recalls × 2–3 table states ──
        # Recalls against the final tier's own ground truth, two at
        # each post-ingest state the table passes through (the third
        # state is opt-in, `enable_terminal_compact=1`):
        #   postflush  — right after the closing flush, while STCS
        #                reacts on its own schedule: the encumbered
        #                read, sampled deliberately (the tier-scope
        #                watch daemon below records the pool state to
        #                correlate against);
        #   settled    — after system_views.sstable_tasks drains:
        #                STCS's steady-state multi-sstable shape;
        #   compacted  — after a forced major compaction (finalize's
        #                toggles shadowed ON for that step only):
        #                the single-sstable fully-merged graph,
        #                comparable with serialized_baseline's
        #                post-compaction recalls.
        # Two per state so pass 1 (cold caches) and pass 2 (warm)
        # are separable. `recall_round` numbers 1..6 GLOBALLY, not
        # 1,2 per state: round values land in the phase coords, and
        # per-state reuse would give two phases identical
        # (yaml_path, coords) checkpoint identities.
        - bindings: |
            const profile_pattern := "{final_recall_pattern}"
          phases:
            - for: "part in profile_partitions('{dataset}', '{profile_pattern}')"
              # SRD-109 — the terminal protocol's own row space (the
              # final-recall partition; cardinality 1 per run).
              anchor: tail
              phases:
                # Tier-scope watch daemon spans the whole terminal
                # protocol, so every recall window has pool/sstable
                # gauges to correlate recall latency against.
                - compaction_watch
                # (bindings:, not set:, for the stage labels — the
                # set: sugar lowers values verbatim, so a bare string
                # becomes a name reference, not a literal.)
                - bindings: |
                    const recall_stage := "postflush"
                  phases:
                    - for: "recall_round in 1,2"
                      anchor: terminal_recall
                      phases:
                        - recall_check
                # Hold until sstable_tasks drains (same shape as
                # finalize's drain; observed-or-60s-idle escape
                # covers STCS scheduling nothing). Inside the part
                # scope, so its {part}-filtered metricsql reads its
                # own samples, not another scope's.
                - settle_compactions
                - bindings: |
                    const recall_stage := "settled"
                  phases:
                    - for: "recall_round in 3,4"
                      anchor: terminal_recall
                      phases:
                        - recall_check
                # Forced major compaction — OPT-IN via
                # enable_terminal_compact (default 0). When enabled,
                # finalize_index's toggles are shadowed ON for this
                # subtree only (the scenario-level enable_finalize=0/
                # enable_compact=0 posture stays authoritative
                # everywhere else) and verify_segments asserts the
                # table settled to ≤ {max_postfinal_segments}
                # sstables, so the compacted-state recalls run on a
                # PROVEN merged shape. When disabled, finalize_index's
                # ops are all if-gated off (the same mechanism the
                # serialized flow uses) and the round 5,6 sweep is
                # halted by its continue_if before any iteration runs.
                - bindings: |
                    const recall_stage := "compacted"
                    const enable_finalize := 1
                    const enable_compact := 1
                  phases:
                    # One-iteration sweep as the gate: the whole arm —
                    # finalize AND its recalls — halts before any iteration
                    # when the flag is 0. The predicate reads the ROOT
                    # `const terminal_compact_cap` (params are frozen to
                    # consts for gate use; see the root bindings note).
                    # The literal toggle shadows above stay authoritative
                    # for the enabled case. NOTE: dryrun=phase walks
                    # declared iterations without evaluating this gate —
                    # only execution shows the skip (`N not run`).
                    - for: "terminal_compact_pass in 1"
                      # SRD-109 — the opt-in arm's one-row view (holds
                      # finalize's designations when the arm runs).
                      anchor: terminal_compact
                      continue_if: "terminal_compact_pass <= terminal_compact_cap"
                      phases:
                        - finalize_index
                        - for: "recall_round in 5,6"
                          anchor: terminal_recall
                          phases:
                            - recall_check

  # One adaptive tier's ingest scope: the latency probe spawns first
  # (off the foreground budget), then the servo'd loader runs; the
  # scope completing stops the probe AND the loader's in-phase servo
  # daemon — which is exactly what quiesces ingest before the sibling
  # recall step. (The compaction watch lives one scope up, at tier
  # level, so it keeps recording through recall.)
  tier_ingest_adaptive:
    - concurrent_query
    - bindings: |
        const stride := if(batch_size > 0, batch_size, measured)
      phases:
        - load_increment_adaptive

  # Recall-only against an ALREADY-LOADED tier — no teardown / schema /
  # load / compact, so the data in the table is untouched. `recall_check`
  # resolves its tier from the loop variable `part` (its `idx_of(part)` ground
  # truth), so it CANNOT run as a bare single-phase scenario; the single-
  # element `for:` binds the `part` it needs. `profile_pattern` picks the tier:
  # filter it to one profile (`profile_pattern='^900m$'`) so the loop yields
  # exactly that tier and recall runs at 900M against the existing table.
  # For a periodic measurement, drive it from a shell loop (nmbrs runs a
  # scenario once and exits):
  #   while true; do
  #     nmbrs run workload=compaction_demo_derived scenario=recall \
  #       profile_pattern='^900m$' dataset=… cqldriver=… host=… ; sleep 300
  #   done
  # (Without the `profile_pattern` override this runs a recall pass for
  # every decade tier in sequence — the `^900m$` filter pins it to 900M.)
  recall:
    - for: "part in profile_partitions('{dataset}', '{profile_pattern}')"
      # SRD-109 — same per-tier row space as the sweep flows.
      anchor: tier
      phases:
        - recall_check

phases:
  # Anti-DDL teardown: clear rows, then drop the index and the table.
  # Per-statement timeout floor — a DROP on a populated SAI index can take
  # tens of seconds. Runs ONCE before the sweep (the table accumulates
  # vectors incrementally across tiers; it is NOT reset between profiles).
  teardown:
    # Skip-eligible on resume: a completed teardown must NOT re-run — it drops the
    # table, which would wipe every loaded tier. `--resume` skips it (identity match)
    # and continues on the existing data. This is what makes in-session resume preserve
    # the sweep's accumulated state instead of starting over.
    checkpoint: idempotent
    concurrency: 1
    # One-shot anti-DDL: never retry (the truncate is EXPECTED to fail on a
    # first run and is tolerated by its op-scoped errors policy).
    tries: 1
    bindings: |
      const request_timeout_ms := 300000
    ops:
      # Clear any rows a prior run left behind before the schema teardown.
      # No IF EXISTS: on a first run the table is absent and this errors — the
      # op-scoped `errors: ".*:warn,counter"` (SRD-82 op shell) logs+counts
      # that error and moves on WITHOUT aborting the run, while the sibling
      # DROPs keep the default stop-on-error handling. Kept ahead of the DROP
      # so it takes effect while the table still exists.
      truncate_table:
        errors: ".*:warn,counter"
        # 60s cap (NOT the phase's 300s request_timeout_ms): on a large
        # table a truncate against a busy coordinator often gets NO
        # response at all — waiting the full 5-minute phase budget for a
        # statement that is tolerated-on-failure (and followed by DROP
        # TABLE anyway) is pure teardown delay. 60s stays cohesively
        # above the 30s server-side timeout.
        timeout: 60s
        raw: "TRUNCATE TABLE {keyspace}.{table}"
      drop_vector_index:
        raw: "DROP INDEX IF EXISTS {keyspace}.{table}{vector_idx_suffix}"
      drop_table:
        raw: "DROP TABLE IF EXISTS {keyspace}.{table}"

  schema:
    # Completed schema DDL skips on resume (keyspace/table/index already exist).
    checkpoint: idempotent
    concurrency: 1
    # One-shot idempotent DDL: single attempt.
    tries: 1
    bindings: |
      dim := vector_dim("{dataset}:{profile}")
      similarity_function := dataset_distance_function("{dataset}:{profile}")
    ops:
      create_keyspace:
        raw: |
          CREATE KEYSPACE IF NOT EXISTS {keyspace}
          WITH replication = {replication} AND durable_writes = true
      # Table DDL in two mutually-exclusive forms selected by
      # `disable_auto_compaction`. Exactly one runs per schema pass; the
      # other is skipped by its `if:` guard.
      #   pinned  — STCS min/max thresholds pinned high (100000) so the
      #             size-tier compactor never fires spontaneously
      #             mid-load; the test owns compaction timing via
      #             `finalize_index`.
      #   default — explicit SizeTieredCompactionStrategy (min 5 / max 8,
      #             liberal buckets bucket_low 0.3 / bucket_high 2.0) so
      #             background compactions run as STCS. NOTE: we specify STCS
      #             explicitly rather than relying on the server default —
      #             this build defaults to UnifiedCompactionStrategy (UCS),
      #             which batches many sstables per merge and shards into
      #             parallel compactions, pathological for vector SAI builds.
      create_table_pinned:
        if: "disable_auto_compaction != 0"
        raw: |
          CREATE TABLE IF NOT EXISTS {keyspace}.{table}
          (key text PRIMARY KEY, value vector<float, {dim}>)
          WITH compaction = {'class': 'SizeTieredCompactionStrategy', 'min_threshold': '100000', 'max_threshold': '100000'}
          AND compression = {'enabled': 'false'}
      create_table_default:
        if: "disable_auto_compaction == 0 && stcs_defaults == 0"
        raw: |
          CREATE TABLE IF NOT EXISTS {keyspace}.{table}
          (key text PRIMARY KEY, value vector<float, {dim}>)
          WITH compaction = {'class': 'SizeTieredCompactionStrategy', 'min_threshold': '5', 'max_threshold': '8', 'bucket_low': '0.3', 'bucket_high': '2.0'}
          AND compression = {'enabled': 'false'}
      # stcs_defaults — BARE SizeTieredCompactionStrategy, the server's
      # own defaults (min 4 / max 32 / buckets 0.5..1.5). The
      # `stcs_adaptive` scenario's posture: background compaction fully
      # in charge, the ingest servo compensating (still explicit about
      # the CLASS — this build defaults to UCS, which is pathological
      # for vector SAI builds; see create_table_default's note).
      create_table_stcs:
        if: "disable_auto_compaction == 0 && stcs_defaults != 0"
        raw: |
          CREATE TABLE IF NOT EXISTS {keyspace}.{table}
          (key text PRIMARY KEY, value vector<float, {dim}>)
          WITH compaction = {'class': 'SizeTieredCompactionStrategy'}
          AND compression = {'enabled': 'false'}
      create_vector_index:
        raw: |
          CREATE CUSTOM INDEX IF NOT EXISTS {table}{vector_idx_suffix}
          ON {keyspace}.{table} (value)
          USING 'StorageAttachedIndex'
          WITH OPTIONS = {
            'similarity_function': '{similarity_function}',
            'source_model': '{source_model}',
            'enable_hierarchy': 'true'
          }

  # Boost compaction throughput + parallelism at session start so the
  # major compaction in `finalize_index` isn't throttled by the
  # per-node defaults. `0` is Cassandra's "no rate limit" sentinel.
  tune_cluster:
    # Completed cluster tuning skips on resume (knobs already applied).
    checkpoint: idempotent
    adapter: http
    concurrency: 1
    cycles: 1
    # One-shot JMX writes: single attempt.
    tries: 1
    ops:
      set_compaction_throughput:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"write",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "attribute":"CompactionThroughputMbPerSec",
           "value":{compaction_throughput_mbps}}
        request_timeout_ms: 10000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "tuning: CompactionThroughputMbPerSec -> {compaction_throughput_mbps} (0 = unlimited)"
          after:  "tuned: CompactionThroughputMbPerSec -> {compaction_throughput_mbps} (0 = unlimited)"
      set_concurrent_compactors:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"write",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "attribute":"ConcurrentCompactors",
           "value":{concurrent_compactors}}
        request_timeout_ms: 10000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "tuning: ConcurrentCompactors -> {concurrent_compactors}"
          after:  "tuned: ConcurrentCompactors -> {concurrent_compactors}"

  # Concurrent ANN query probe — an SRD-82 Part 6 DAEMON phase. Runs at
  # 1/s alongside the foreground load → flush → finalize of this tier (it
  # is listed FIRST in the `tier_build` include, so the scenario shell
  # spawns it in daemon mode, off the foreground concurrency budget), on
  # its OWN scope so it pulls from a distinct cursor base. It stops cleanly
  # when `tier_build`'s foreground (load/flush/finalize) completes —
  # BEFORE `recall_check` runs in the sibling scope, so the probe never
  # contends with the recall measurement. The op's `result_success` timer
  # (SRD-91) captures ANN query latency *while the tier is being ingested
  # and indexed* — the whole point of the probe.
  concurrent_query:
    # SRD-109 — the encumbered-read price: ANN latency while the tier
    # loads and indexes. p99 is worst-window deliberately (a mean of
    # p99s launders exactly the stall this exists to surface);
    # timeouts absorbed by retries land in attempt_failure.
    key_metrics:
      qps: rate(result_success)
      q_p50: avg(result_success_p50)
      q_p99_worst: max(result_success_p99)
      probe_failures: last(result_failure)
      probe_timeouts: last(attempt_failure)
    # Skip a completed tier's shadow daemon on resume (its tier_build is done); only
    # the failed/pending tier re-spawns it.
    checkpoint: idempotent
    adapter: cql
    daemon: true
    concurrency: 1
    # SRD-82 ErrorPolicy — this probe runs DURING ingest + indexing, where
    # ANN query timeouts are EXPECTED (the index isn't built yet). Count
    # them and keep probing rather than letting one timeout abort the sweep
    # (the prior default stop-on-error). NO error-rate guard here on
    # purpose: the probe's job is to MEASURE query behaviour while the index
    # builds, so its errors are the data, not a failure signal — the
    # foreground `load_increment` / `recall_check` guards below catch a
    # genuinely unhealthy run.
    errors: ".*:warn,counter"
    # No `stop_when` here on purpose (see comment above): this probe's errors
    # are DATA, not a failure signal — it must not carry the data-plane
    # backstop. (There is no hidden error-rate default to disable either:
    # `error_rate_max` is opt-in only — SRD-82.)
    # 1 query/s — numeric so it builds the activity RateLimiter (a string
    # like "1/s" would not parse as f64 and would be ignored).
    rate: 1
    bindings: |
      # This tier's own query set (the same prebuffer as recall_check).
      const tier := matching_profile_name_at('{dataset}', '{profile_pattern}', idx_of(part))
      const prebuffered := dataset_prebuffer(str_concat('{dataset}:', tier))
      const base := query_count(prebuffered)
      # Open-extent cursor: wrap the query set for up to query_budget_ms;
      # the daemon's stop signal cuts it the moment the foreground tier
      # completes, so it never actually reaches the budget.
      cursor q = until_elapsed(base, query_budget_ms)
      query_vector := query_vector_at(prebuffered, q % base)
    ops:
      probe_ann:
        timeout: 60s   # 60s per read; retried up to the phase `tries` budget on a CQL timeout
        prepared: |
          SELECT [key] FROM {keyspace}.{table}
          ORDER BY value
          ANN OF {query_vector}
          LIMIT {limit}
        metrics:
          probe_rows:
            kind: gauge
            value: count

  # ── stcs_adaptive: background virtual-tables reader ──────────
  # An SRD-82 Part 6 DAEMON phase (spawned first in
  # `tier_ingest_adaptive`, off the foreground budget; stops when the
  # tier's ingest scope completes). Each poll reads TWO virtual
  # tables and writes THROUGH to the workload-root shared wires the
  # ingest servo consumes:
  #   system_views.thread_pools (CompactionExecutor row)
  #       → active_compactions_live, pending_compactions_live
  #   system_views.sstable_indexes (this table's SAI index)
  #       → live_sstables (one row per sstable carrying the index)
  # The same values are published as gauges so the servo's input is
  # in metrics.db next to its output (load_weight / rate) — the
  # post-run story of every backoff decision is reconstructible.
  # Reads are advisory: an errored poll warns and keeps the last
  # wire values; it must never fail a tier.
  breaker_watch:
    # SERVER-INDEPENDENT breaker sensor (2026-08-27). The windowed breaker
    # wires (recent_*) were previously computed in `compaction_watch`'s CQL op
    # bindings. When the server died mid-run, that op's cycles wedged inside
    # the driver and its bindings never re-evaluated — the wires FROZE at
    # their last healthy values (failures=0.0) for the whole 29-minute outage
    # while the loader failed 100% of attempts, and the saturation breaker
    # never armed (Run D, docs/runwatch-20260826-runD.md). The sensor must
    # not share fate with the server it effectively guards against.
    #
    # This daemon evaluates the same metricsql over the CLIENT'S OWN metrics
    # store, on a LOCAL stdout op that cannot fail or block on any server, so
    # the wires stay live through any outage. Bindings are not
    # template-interpolated, so the selector braces are safe here; selectors
    # are PHASE-ONLY by the same rule as before (see the pointer comment in
    # `compaction_watch`, and never "{part}" — inert in bindings).
    key_metrics:
      recent_fail_max: max(recent_result_failures)
    checkpoint: idempotent
    adapter: stdout
    daemon: true
    concurrency: 1
    tries: 1
    # LITERAL numeric (rate: does not interpolate). One evaluation per
    # second: 4 metricsql queries/s against the local store, and at most
    # ~1s of added abort latency on 55s windows.
    rate: 1
    bindings: |
      # Open-extent clock cursor, cut by the daemon stop when the tier's
      # foreground completes (same pattern as compaction_watch).
      cursor t = until_elapsed(1000000000, query_budget_ms)
    ops:
      sense_breaker_windows:
        # Local no-op: constructing this op is what evaluates the volatile
        # bindings below; `stdout: silent` drops the rendered line entirely.
        stdout: silent
        stmt: "breaker-watch tick"
        bindings: |
          volatile recent_result_failures := metricsql_scalar("sum(increase(result_failure{phase=\"load_increment_adaptive\"}[55s]))")
          volatile recent_result_total := metricsql_scalar("sum(increase(result_total{phase=\"load_increment_adaptive\"}[55s]))")
          volatile recent_attempt_failures := metricsql_scalar("sum(increase(attempt_failure{phase=\"load_increment_adaptive\"}[55s]))")
          volatile recent_attempt_total := metricsql_scalar("sum(increase(attempt_total{phase=\"load_increment_adaptive\"}[55s]))")
        metrics:
          recent_result_failures:  { kind: gauge, value: recent_result_failures }
          recent_result_total:     { kind: gauge, value: recent_result_total }
          recent_attempt_failures: { kind: gauge, value: recent_attempt_failures }
          recent_attempt_total:    { kind: gauge, value: recent_attempt_total }

  compaction_watch:
    # SRD-109 — the servo's INPUTS: what pressure each tier lived
    # with (means) and its worst moments (maxes), plus the windowed
    # backstop numerator (all-zero = healthy signature).
    key_metrics:
      comp_active: avg(compaction_pool_active)
      comp_active_max: max(compaction_pool_active)
      comp_pending_max: max(compaction_pool_pending)
      flush_active_max: max(flush_pool_active)
      sstables_max: max(table_sstables_live)
    checkpoint: idempotent
    adapter: cql
    daemon: true
    concurrency: 1
    tries: 1
    errors: ".*:warn,counter"
    # LITERAL numeric — the `rate:` field does not interpolate, and
    # an unparseable rate is IGNORED (the daemon then polls at server
    # speed: observed 268-504/s before this was a literal). 0.5 =
    # one poll per 2s; the servo reacts within ~2 polls, well inside
    # STCS's minutes-scale compaction cadence.
    rate: 0.5
    bindings: |
      # Open-extent clock cursor, cut by the daemon stop when the
      # tier's foreground completes (same pattern as concurrent_query).
      cursor t = until_elapsed(1000000000, query_budget_ms)
    ops:
      read_compaction_pool:
        timeout: 10s
        # Both pools in one partition-key IN read: the compaction
        # queue (the servo's signal) and the flush writers (the
        # EARLIER signal — dirty-memtable pressure leads the
        # compaction queue, so the auto-scaling dataset records it
        # from day one even though the current weight ignores it).
        raw: |
          SELECT name, active_tasks, pending_tasks, blocked_tasks
            FROM system_views.thread_pools
           WHERE name IN ('CompactionExecutor', 'MemtableFlushWriter')
        capture:
          # Per-pool `where` folds; an empty fold resets each wire to
          # its declared 0 (fold-totality contract, wrappers/traverse) —
          # an unreadable pool reads as pressure 0, never a stale value.
          active_compactions_live:  ":max(active_tasks where name='CompactionExecutor')"
          pending_compactions_live: ":max(pending_tasks where name='CompactionExecutor')"
          # ACTIVE is the flush signal that matters: observed live
          # 2026-08-04, a single active MemtableFlushWriter task (the
          # serial SAI graph serialization) stalled ingest for
          # minutes while pending/blocked both read 0.
          flush_active_live:        ":max(active_tasks where name='MemtableFlushWriter')"
          flush_pending_live:       ":max(pending_tasks where name='MemtableFlushWriter')"
          flush_blocked_live:       ":max(blocked_tasks where name='MemtableFlushWriter')"
        # Trailing-window loader health, computed at WATCH cadence (the
        # sensor/guard split of the servo itself): metricsql over the
        # last 55s of this tier's own result counters — inside the
        # SRD-90 in-memory horizon, so this never reads sqlite. The
        # `result:` write-through publishes to the root shared wires
        # the loader's windowed backstop reads.
        # `volatile` on every metricsql read in this workload: it is the
        # explicit nondeterminism acknowledgment (the value changes
        # between evaluations without any input changing), which both
        # excludes the read from const-fold identity and silences the
        # per-kernel "non-deterministic node used without explicit
        # acknowledgment" compile warning — one line of which used to
        # print for every kernel instantiation at session start.
        result: |
          # The windowed breaker wires (recent_*) are computed by the
          # `breaker_watch` daemon — a SERVER-INDEPENDENT stdout op — not here.
          # 2026-08-27: they used to live in this op's bindings, and froze at
          # their last healthy values for 29 minutes when the server died and
          # this op's cycles wedged in the driver (sensor shared fate with the
          # thing it guarded — docs/runwatch-20260826-runD.md, Run D end).
        metrics:
          compaction_pool_active:  { kind: gauge, value: active_compactions_live }
          compaction_pool_pending: { kind: gauge, value: pending_compactions_live }
          flush_pool_active:       { kind: gauge, value: flush_active_live }
          flush_pool_pending:      { kind: gauge, value: flush_pending_live }
          flush_pool_blocked:      { kind: gauge, value: flush_blocked_live }
      read_live_sstables:
        timeout: 10s
        raw: |
          SELECT sstable_name
            FROM system_views.sstable_indexes
           WHERE keyspace_name = '{keyspace}'
             AND index_name = '{table}{vector_idx_suffix}'
        capture:
          live_sstables: ":count"
        measure: "{active_compactions_live}A {pending_compactions_live}P {live_sstables}sst"
        metrics:
          table_sstables_live: { kind: gauge, value: live_sstables }

  # ── stcs_adaptive: pressure-servo'd incremental load ──────────
  # `load_increment` plus the compaction-pressure rate servo. The
  # weighting polynomial and its derivation from the 2026-07/08
  # studies live in the params block ("stcs_adaptive:
  # compaction-pressure ingest servo"); the shape in one line:
  #   rows/s = max(floor, base × 1/(1 + (pressure/half)^power)),
  #   pressure = active + pending_weight×pending + flush term.
  # The servo is the BINDING CHAIN at the end of this phase's
  # `bindings:` (flush_over .. rate_servo). It must live in this
  # phase (not in the watch daemon phase) because `control_set`
  # writes to the calling fiber's OWN phase-tier control (SRD-89
  # anti-crosstalk). Its dispatch frequency has no cadence knob —
  # it is bounded by construction, in two layers:
  #   1. the only non-const inputs are the shared wires the
  #      tier-scope `compaction_watch` daemon rewrites at its
  #      literal `rate: 0.5` — between watch polls the wires are
  #      frozen, so every cycle computes the same target;
  #   2. `control_set` elides the dispatch at fixpoint (the
  #      committed-gauge equality check in runtime_context.rs):
  #      identical integer wires → bit-identical f64 target →
  #      return 0, no dispatch. Ceiling: one dispatch per watch
  #      poll (0.5/s); in practice far fewer, since pool states
  #      persist across polls. `rate_servo_sent` records each
  #      cycle's dispatch count, so this is auditable per run.
  # (History: a `pressure_servo` daemon op was tried first and
  # abandoned — a stanza's daemon op re-attempts its spawn every
  # cycle against the fiber cap, and an `if:` guard gates the op
  # body, not the spawn. Don't reintroduce it.)
  # Rate units are ROWS/s: the limiter paces
  # batch ELEMENTS (measured live 2026-08-03 — rate=120 produced
  # exactly 120 rows/s; `stride` only sizes the server round-trip),
  # so the servo sets the rows/s target directly. The initial
  # `rate: 100000` is deliberately far above capacity (≈ no
  # throttle) — the servo takes over at the first watch poll.
  load_increment_adaptive:
    # SRD-109 key measurables: the tier's delivered rows (coverage),
    # its failures, achieved throughput, per-batch tail latency, and
    # the whole servo chain summarized. Attached to the `tier` view.
    key_metrics:
      rows: last(result_success)
      failures: last(result_failure)
      rows_per_s: rate(result_success)
      insert_p99: max(result_success_p99)
      weight: avg(load_weight)
      weight_min: min(load_weight)
      pressure: avg(servo_pressure)
      flush_term: avg(servo_flush_term)
      target_rate: avg(target_rows_rate)
    checkpoint: idempotent
    concurrency: concurrency
    rate: 100000
    tries:
      count: 20
      backoff:
        ratio: 2.0
        min: 100ms
        max: 10s
    # Same sanity backstops as `load_increment` (see its notes): a
    # single terminal failure is missing coverage only past a rate
    # floor; attempt-level sickness aborts while the servo still has
    # operating room. The SERVO is the first responder here — these
    # trip only when adapting was not enough.
    errors: ".*:warn,counter"
    stop_when:
      - condition: "((result_failure >= 100) & (to_f64(result_failure) > (to_f64(cycles_total) * {result_failure_backstop}))) | ((recent_result_failures >= {result_failure_window_floor}) & (recent_result_failures > (recent_result_total + 1.0) * {result_failure_backstop}))"
        pulse:   continuous
        per:     self
        action:  abort
        at:      workload
      - condition: "(attempt_total > 200) & (to_f64(attempt_failure) > (to_f64(attempt_total) * {attempt_failure_backstop}))"
        pulse:   continuous
        per:     self
        action:  abort
        at:      workload
      # SATURATION breaker — windowed, attempt-level. The two clauses above cannot fire
      # during a full stall: the first needs 100 TERMINAL failures in 55s (a terminal
      # failure costs the whole 20-try budget, so they accrue far too slowly), and the
      # second divides by LIFETIME attempt_total, which a healthy past keeps below the
      # threshold. This one divides by the SAME 55s window it measures, so a sustained
      # near-total attempt failure rate aborts regardless of how healthy the run was
      # before it and regardless of how slowly terminal failures land.
      - condition: "(recent_attempt_total >= {attempt_window_floor}) & (recent_attempt_failures > (recent_attempt_total * {attempt_saturation_rate}))"
        pulse:   continuous
        per:     self
        action:  abort
        at:      workload
    bindings: |
      const tier := matching_profile_name_at('{dataset}', '{profile_pattern}', idx_of(part))
      const prebuffered := dataset_prebuffer(str_concat('{dataset}:', tier))
      cursor row = range(start_of(part), end_of(part))
      ord := at(part, cycle)
      id := format_u64(ord, 10)
      train_vector := vector_at(prebuffered, ord)
      # ── the ingest servo ──
      # Pressure from the shared wires the tier-scope
      # `compaction_watch` daemon maintains (fold totality resets
      # them to 0 when the pool is unreadable or idle, so pressure
      # honestly decays); weight from the studies-derived rational
      # polynomial. The `rate` control paces batch ELEMENTS — i.e.
      # ROWS/s directly (measured live 2026-08-03: rate=120 gave
      # exactly 120 rows/s; `stride` only sizes the round-trip) —
      # so the target needs no stride conversion. Evaluated per
      # cycle, DISPATCHED on change only (control_set's
      # committed-gauge fixpoint elision).
      flush_over := to_f64(flush_active_live) - flush_grace
      flush_term := select_f64(flush_over < 0.0, 0.0, flush_over) * flush_weight
      pressure := to_f64(active_compactions_live) + pending_weight * to_f64(pending_compactions_live) + flush_term
      load_weight := 1.0 / (1.0 + pow(pressure / backoff_half, backoff_power))
      # f64 clamps via select_f64 (the stdlib `max` is u64-only).
      weighted_rows := base_rows_rate * load_weight
      target_rows_rate := select_f64(weighted_rows < floor_rows_rate, floor_rows_rate, weighted_rows)
      rate_servo := control_set("rate", target_rows_rate)
    ops:
      insert:
        batch: stride
        max_batch_size: cql_server_batch_limit(cql_session(cql_session_key))
        batchtype: unlogged
        timeout: 60s
        prepared: |
          INSERT INTO {keyspace}.{table} (key, value)
          VALUES ('{id}', {train_vector})
        # The WHOLE weight computation, one gauge per stage —
        # composite pressure, the raw 0..1 weight (gauges are
        # f64-native), both rate targets, and the dispatch count
        # (mostly 0 thanks to the elision; a 1 marks the cycle that
        # actually retargeted the limiter) — so the fit for the next
        # control-point revision reads the full chain from
        # metrics.db without reconstructing any arithmetic. The pool
        # INPUTS are recorded by the tier-scope watch daemon's own
        # gauges. These gauges also DEMAND the binding chain per
        # cycle, which is what evaluates `control_set` (SideChannel
        # nodes evaluate when pulled — the metric is the pull; the
        # elision keeps the pull cheap between wire changes).
        metrics:
          servo_flush_term: { kind: gauge, value: flush_term }
          servo_pressure:   { kind: gauge, value: pressure }
          load_weight:      { kind: gauge, value: load_weight }
          target_rows_rate: { kind: gauge, value: target_rows_rate }
          rate_servo_sent:  { kind: gauge, value: rate_servo }

  # One-shot insert-batch-stride probe (SRD-103 / Change 1). Insert a
  # byte-budgeted UNLOGGED batch over a small leading slice of the base
  # facet and read back the rows it wrote as `count` — a CQL write now
  # reports its rows-written count just as a SELECT reports rows returned.
  # `floor_decade` rounds that to a round number and writes it THROUGH to
  # the workload-root `shared measured` cell (SRD-66/67), which the tier
  # loop later freezes as `const stride`. `concurrency: 1` so the probe is
  # a single deterministic write path. NOTE: with `max_batch_size` and no
  # `batch:`, one invocation writes one byte-budget-worth of rows; `count`
  # equals the SERVER batch capacity only when the phase runs a single
  # full-budget invocation (probe slice ≤ that capacity). Tune
  # `measure_probe_rows` to the target's row width, or run against a live
  # cluster to confirm the derived stride. The rows it writes (keys
  # [0, measure_probe_rows)) are re-inserted idempotently by tier 1's load.
  measure_batch:
    # Deliberately NOT `checkpoint: idempotent`: this probe writes the shared
    # `measured` cell that the tier loop's `const stride := ... measured` freeze reads.
    # That cell is session state, not persisted in the checkpoint, so on resume the
    # probe must RE-RUN to repopulate it (cheap: one idempotent batch) — skipping it
    # would leave `stride` unresolved for the resumed tier. (Passing an explicit
    # `batch_size` param makes stride independent of this probe.)
    concurrency: 1
    # ONE op only: it reserves rows_per_op (= one byte-budget-worth of rows,
    # capped at MAX_PREDICTED_ROWS) and reports the count it wrote. Without
    # this the phase would run to cursor exhaustion (many ops), and the
    # last-write-wins `measured` cell would end up holding a short-tail
    # count instead of a full budget batch.
    cycles: 1
    tries: 1
    bindings: |
      # The first matching profile's own vectors — representative of the
      # dataset's vector WIDTH, which is what sizes a byte-budgeted batch.
      const tier := matching_profile_name_at('{dataset}', '{profile_pattern}', 0)
      const prebuffered := dataset_prebuffer(str_concat('{dataset}:', tier))
      # A small leading slice of the base facet. The cursor value `row` is
      # the absolute base-vector ordinal (the range starts at 0), so keys
      # and vectors span [0, measure_probe_rows) — the same keys tier 1's
      # `load_increment` re-inserts idempotently.
      cursor row = range(0, measure_probe_rows)
      id := format_u64(row, 10)
      train_vector := vector_at(prebuffered, row)
    ops:
      measure_insert:
        # Bypassed entirely when an explicit `batch_size` is provided —
        # the stride freeze below prefers the param, so measuring would
        # be wasted work (and a wasted probe write).
        if: "batch_size == 0"
        # Byte-budgeted UNLOGGED batch sized to the cluster's OWN limit,
        # with NO `batch:` row cap — one invocation packs a full
        # byte-budget-worth of rows and reports the count it wrote.
        max_batch_size: cql_server_batch_limit(cql_session(cql_session_key))
        batchtype: unlogged
        timeout: 60s
        prepared: |
          INSERT INTO {keyspace}.{table} (key, value)
          VALUES ('{id}', {train_vector})
        # SRD-66 result-binding: write floor_decade(count) THROUGH to the
        # workload-root `shared measured` cell — `count` is the rows this
        # byte-budgeted write actually wrote (Change 1).
        result: |
          measured := floor_decade(count*0.9)

  # Incremental load: insert ONLY the vectors new to this size tier —
  # the absolute range [prev_count, this_count) of the profile's base
  # facet, where `this_count` is this tier's cumulative size and
  # `prev_count` is the previous (smaller) tier's size (0 for the first).
  # The key is the absolute ordinal, so keys never collide across tiers
  # and the table ends each tier holding exactly [0, this_count).
  # Skipped (no-op) once a tier's size exceeds `max_size`.
  load_increment:
    # SRD-109 — the serialized loader's measurables (no servo).
    key_metrics:
      rows: last(result_success)
      failures: last(result_failure)
      rows_per_s: rate(result_success)
      insert_p99: max(result_success_p99)
    # Completed tier loads skip on resume; the loads are idempotent re-inserts anyway.
    checkpoint: idempotent
    concurrency: concurrency
    # `tries:` MAP FORM (SRD-82 Part 3b) — the load is where a drowning
    # server triggers retry storms, so pace retries explicitly here. `count`
    # is the total-attempts budget (inherits the root 20 otherwise); the
    # `backoff` grows the inter-retry wait geometrically by `ratio` from
    # `min`, capped at `max`, so 20 fast retries don't hammer a sick server.
    # These values equal the built-in defaults — spelled out as documentation
    # and to exercise the map form. The sugared `tries: 20` remains valid.
    tries:
      count: 20
      backoff:
        ratio: 2.0
        min: 100ms
        max: 10s
    # SRD-82 ErrorPolicy + SRD-83 stop conditions — tolerate TRANSIENT insert
    # errors (timeouts under load): the `tries:` budget retries them and the
    # load keeps going. The guards below are SANITY BACKSTOPS, each derived IN
    # THE PREDICATE from base counters — never a precomputed rate wire:
    # Every name is a registered INSTRUMENT (what metrics.db carries):
    #   result-specific:  result_failure / cycles_total  (terminal failed ops / completed ops)
    #   attempt-specific: attempt_failure / attempt_total (both counted at
    #                     attempt RESOLUTION, so the ratio is exact)
    #
    # 1. Coverage invariant. This phase's contract is "the table ends the tier
    #    holding exactly [prev_count, this_count)". A TERMINAL insert failure
    #    (an op that exhausted its whole `tries` budget) is missing rows — the
    #    tier is invalid regardless of proportion, so a single one fails the
    #    phase. Transients never trip this: they resolve inside the budget and
    #    never reach `result_failure`.
    # 2. Attempt-level sickness. Retries absorb failures, so the result-level
    #    rate stays green while the server drowns (r: climbing, att:% sinking).
    #    Failed attempts crossing `attempt_failure_backstop` of resolved
    #    attempts — past a 200-attempt sample — fails the phase while the rate
    #    servo still has operating room below it.
    # polydat predicates use `&`, not `&&`.
    errors: ".*:warn,counter"
    # SRD-83 stop conditions, written in the NON-SUGARED canonical form
    # (five explicit axes: condition/pulse/per/action/at; no aliases, no
    # defaults) so the routing is legible at a glance. `at: workload` sends
    # a tripped backstop out to the workload root — the WHOLE run stops, not
    # just this tier's load phase.
    #
    #   pulse:  continuous  — evaluated inline, per drain-loop turn
    #   per:    self        — detected at this (phase) scope
    #   action: fail        — cooperative halt: drain in-flight ops
    #   action: abort       — same failing outcome, but CANCEL in-flight ops
    #                         (arms the session cancel-ops countdown), for a
    #                         server sick enough that parked ops will only
    #                         ever end by client timeout
    stop_when:
      # Result-level failure rate → abort. A single stray terminal failure
      # (e.g. one op exhausting its tries budget deep into a multi-hour load)
      # is NOT a reason to kill a whole run, so this is a RATE backstop, not a
      # zero-tolerance guard: it trips only once terminal failures cross
      # `result_failure_backstop` (2.5%) AND there are at least 100 of them
      # (the floor keeps a handful of early failures from tripping a
      # not-yet-meaningful rate). Both halves must hold.
      - condition: "(result_failure >= 100) & (to_f64(result_failure) > (to_f64(cycles_total) * {result_failure_backstop}))"
        pulse:   continuous
        per:     self
        action:  abort
        at:      workload
      # Attempt-level sickness (retry churn) → abort: once the attempt-failure
      # rate is this high the server is drowning and the in-flight ops will
      # only ever end by client timeout, so cancel them now rather than wait
      # out a ~minute drain of work the aborted run will discard anyway.
      - condition: "(attempt_total > 200) & (to_f64(attempt_failure) > (to_f64(attempt_total) * {attempt_failure_backstop}))"
        pulse:   continuous
        per:     self
        action:  abort
        at:      workload
    # REMOVED 2026-07-23: the 100 ops/s cap (10K rows/s at the measured
    # stride of 100) was the ceiling hiding server-side throughput
    # recovery. The attempt/result backstops below remain the safety
    # net. Restore by uncommenting:
    # rate: 100
    bindings: |
      # `part` is the active masked profile tier from `profile_partitions`:
      # `[start_of(part), end_of(part))` is the incremental delta since the
      # previous tier — a partition carries its own start ordinal, so no
      # cross-iteration carry is needed. `idx_of(part)` is the masked
      # position, used to name this tier's own prebuffer.
      const tier := matching_profile_name_at('{dataset}', '{profile_pattern}', idx_of(part))
      const prebuffered := dataset_prebuffer(str_concat('{dataset}:', tier))
      # The cursor bounds this tier to `cardinality(part)` cycles (the delta
      # this_count - prev_count). The ABSOLUTE base-vector ordinal is
      # `at(part, cycle)` = `start_of(part) + cycle`, so keys/vectors span the
      # incremental `[prev_count, this_count)` — never `[0, delta)`. (A
      # cursor's value wire is the local index; the absolute ordinal comes
      # from the partition accessor.)
      cursor row = range(start_of(part), end_of(part))
      ord := at(part, cycle)
      id := format_u64(ord, 10)
      train_vector := vector_at(prebuffered, ord)
    ops:
      insert:
        # FIXED cursor stride per invocation (SRD-22 cover-once), frozen from
        # the `measure_batch` probe via the enclosing `const stride := measured`
        # scope: one invocation reads AND advances `stride` ordinals — a
        # measured batch-worth instead of a single row. `stride` defaults to 1
        # (the root `shared measured` literal) if the probe was skipped.
        batch: stride
        # Byte-bounded batch sized to the cluster's OWN configured limit
        # (SRD-103): reads `batch_size_fail_threshold` from
        # system_views.settings, backs off 10%, and fills each UNLOGGED batch
        # up to that many encoded bytes (dynamic row count by vector dim). KEPT
        # alongside `batch: stride` as the byte-fill safety valve: the `stride`
        # rows are packed into sub-batches each held under this budget, so an
        # over-large stride can never exceed the server's reject threshold. If
        # the server doesn't expose the limit (older C* / permissions), this
        # resolves to 0 = no byte cap.
        max_batch_size: cql_server_batch_limit(cql_session(cql_session_key))
        batchtype: unlogged
        timeout: 60s   # 60s per write; retried up to the phase `tries` budget on a CQL timeout
        prepared: |
          INSERT INTO {keyspace}.{table} (key, value)
          VALUES ('{id}', {train_vector})

  # Flush memtables to disk (synchronous JMX exec) so the just-loaded
  # increment rolls into an on-disk SSTable for `finalize_index` to
  # compact-merge with the prior tiers' SSTables.
  flush:
    # Completed tier flush skips on resume.
    checkpoint: idempotent
    adapter: http
    concurrency: 1
    cycles: 1
    tries: 1
    ops:
      flush:
        adapter: http
        # Visible leaf: the synchronous forceKeyspaceFlush produces no
        # signal until it returns, but the box is busy the whole time —
        # per flushed memtable, cassandra encodes the segment's vectors
        # and serializes the SAI on-disk graph (SERIAL by design,
        # flush_build_parallel=false; ~20s per ~1M-row memtable, logged
        # cassandra-side as "CassandraOnHeapGraph: Writing graph took
        # Nms"). The leaf's default duration cell ticks through that
        # window so the wait reads as measured work, not a stall.
        readout: visible
        # Forced-flush toggle: skip the whole flush when disabled.
        if: "enable_flush != 0"
        # 15s TCP-connect budget to the Jolokia agent (distinct from the
        # request_timeout_ms response deadline): a connect that hangs — e.g.
        # the agent busy on another in-flight JMX call — fails fast and
        # retries (inherited root `tries: 10`) instead of stalling on the OS default.
        connect_timeout: 15s
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceFlush(java.lang.String,[Ljava.lang.String;)",
           "arguments":["{keyspace}",[]]}
        request_timeout_ms: 3600000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "flushing keyspace {keyspace} — memtable data + per-segment SAI vector graph build (serial; ~20s per ~1M-row memtable; see cassandra 'Writing graph took' lines)"
          after:  "flushed keyspace {keyspace} (memtables → sstables + vector index)"

  # Post-flush settle for the ADAPTIVE scenario (nothing here forces a
  # compaction — the posture is real STCS defaults throughout): wait for
  # whatever background work the final flush scheduled — data merges and
  # vector index builds — to drain out of system_views.sstable_tasks
  # before the final recall measures the table. Same drain shape as
  # finalize_index's await_compaction (same no-kind-filter lesson, same
  # fold-totality idle detection, same observed-or-idle-grace escape),
  # minus the trigger coupling: no `sstables <= 1` disjunct, because
  # that wire is finalize's read_sstables cross-op cell and is never
  # written in this scenario — referencing it would read a stale
  # default and release the drain instantly.
  settle_compactions:
    # SRD-109 — the drain: how long the tail waited, what it waited
    # on, and the terminal build's achieved rate (the capacity
    # headline — ~11k nodes/s cache-hot vs the measured 401/s cliff).
    key_metrics:
      settle_wait: max(settle_wait_time_s)
      drain_pending_max: max(settle_pending_tasks)
      build_nodes: last(compaction_index_nodes_done)
      build_nodes_total: last(compaction_index_nodes_total)
      build_rate: rate(compaction_index_nodes_done)
    # A completed settle skips on resume; an interrupted one re-polls.
    # Both are correct — the poll is a pure read.
    checkpoint: idempotent
    adapter: cql
    concurrency: 1
    cycles: 1
    tries: 1
    bindings: |
      # 2s pre-poll grace (f64 = milliseconds, consumed by await_idle's
      # `delay:`): the background scheduler registers its reaction to
      # the flush on its next round, not synchronously with the flush
      # call — a poll landing in that gap sees an empty list. The gap
      # is ASSERTED in the drain's `until:` (observed-or-idle-grace);
      # this grace just avoids spending a poll on a list that cannot
      # yet be populated.
      const drain_grace := 2000.0
    ops:
      await_idle:
        adapter: cql
        readout: visible
        delay: drain_grace
        # Advisory, like finalize's drain: this is monitoring, not
        # load — a slow or unreadable view degrades to a logged
        # warning, never a terminal error in the scenario's tail.
        errors: ".*:warn,counter"
        bindings: |
          # Idle-escape patience: how long the drain waits for EVIDENCE
          # that background work actually started before accepting an
          # empty task list as "nothing was scheduled". STCS may
          # legitimately decide the flushed tail needs no merge — that
          # silence must release the tail here, bounded, not at
          # timeout_ms. A typed binding, NOT a workload param (params
          # reach polydat as strings — see finalize's await_compaction
          # note), and plain assignment, not `const` (op-level blocks
          # parse `const` as a wire reference).
          start_evidence_ms := 60000
          extern active_compactions: u64 = 0
          # Published by the poll wrapper each iteration.
          extern poll_elapsed_ms: u64 = 0
          # "Was any task seen during THIS settle?" — answered from
          # metric history (bindings form a DAG; a latch would be a
          # cycle). settle_pending_tasks is this op's own published
          # count; the part filter scopes the answer to this phase's
          # own samples.
          volatile compaction_observed := round_u64(metricsql_scalar(
              "max_over_time(settle_pending_tasks{part=\"{part}\"}[6h])"))
          extern completion_ratio:   f64 = 0.0
          extern index_nodes_done:   u64 = 0
          extern index_nodes_total:  u64 = 0
          extern data_bytes_done:    u64 = 0
          extern data_bytes_total:   u64 = 0
          # Drain speed, both task kinds (they do not overlap in time;
          # see finalize's per-kind capture note). Part-scoped so a
          # preceding tier's finalize-era series cannot contribute.
          volatile nodes_per_s := round_u64(metricsql_scalar(
              "sum(rate(compaction_index_nodes_done{part=\"{part}\"}[2m]))"))
          volatile mib_per_s := round_u64(metricsql_scalar(
              "sum(rate(compaction_data_bytes_done{part=\"{part}\"}[2m]))") / 1048576)
        # NO kind filter — the drain must hold for the WHOLE
        # compaction, not only its index-build tail (the 2026-07-24
        # flush-starvation lesson on finalize's await_compaction).
        raw: |
          SELECT completion_ratio, progress, total, kind, unit
            FROM system_views.sstable_tasks
           WHERE keyspace_name = '{keyspace}'
             AND table_name   = '{table}'
          ALLOW FILTERING
        capture:
          active_compactions: ":count"
          completion_ratio:   ":min(completion_ratio)"
          # Vector index build — graph nodes.
          index_nodes_done:   ":sum(progress where kind='secondary index build')"
          index_nodes_total:  ":sum(total where kind='secondary index build')"
          # Data compaction — bytes.
          data_bytes_done:    ":sum(progress where kind='compaction')"
          data_bytes_total:   ":sum(total where kind='compaction')"
        gutter:
          # Both drains, data-then-index, so an idle one reads as a
          # zero NEXT TO a live number rather than as the whole readout.
          text: "≈{mib_per_s} MiB/s ≈{nodes_per_s} n/s"
        poll:
          # Done when nothing is registered AND either background work
          # was actually observed this settle, or we idled through
          # start_evidence_ms without any appearing. The escape lives
          # INSIDE the idle guard — see finalize's await_compaction for
          # the 2026-08-01 lesson on hoisting it out.
          until: "active_compactions == 0 && (compaction_observed != 0 || poll_elapsed_ms >= start_evidence_ms)"
          interval_ms: 5000
          # 48h, matching finalize's drain: the final tier's settle can
          # legitimately be a table-scale merge. The op-level `errors:`
          # turns a poll_timeout into a warning, not a run-ending error.
          timeout_ms: 172800000
          max_error_retries: 5
          metric_name: settle_wait_time_s
          memo: "settling {keyspace}.{table}: ratio {completion_ratio}, data {data_bytes_done}/{data_bytes_total} bytes (≈{mib_per_s} MiB/s), index {index_nodes_done}/{index_nodes_total} nodes (≈{nodes_per_s} n/s), {active_compactions} task(s) in flight"
          progress: "{completion_ratio}"
        metrics:
          settle_pending_tasks:          { kind: gauge, value: active_compactions }
          compaction_completion_ratio:   { kind: gauge, value: completion_ratio }
          compaction_index_nodes_done:   { kind: gauge, value: index_nodes_done }
          compaction_index_nodes_total:  { kind: gauge, value: index_nodes_total }
          compaction_data_bytes_done:    { kind: gauge, value: data_bytes_done }
          compaction_data_bytes_total:   { kind: gauge, value: data_bytes_total }
        memo:
          before: "waiting for background compaction/index work on {keyspace}.{table} to go idle (system_views.sstable_tasks, 5s polls; releases after 60s of confirmed idle if STCS schedules nothing)"
          after:  "{keyspace}.{table} settled — no background compaction or index-build tasks registered"
        request_timeout_ms: 60000

  # Major compaction. One stanza, ops run once each in order:
  #   flush           -> roll any remaining memtable to disk
  #   read_sstables   -> read LiveSSTableCount; capture `sstables`
  #   trigger_compact -> DAEMON, `if: sstables > 1`; holds the JMX
  #                      socket open for the whole synchronous compaction
  #   segment_sizes   -> CQL system_views.sstable_indexes; per-segment sizes
  #                      of the vector index sstables being merged
  #   await_compaction -> CQL system_views.sstable_tasks, op-level
  #                      `poll: await_empty`; live progress until idle
  finalize_index:
    # SRD-109 — the forced major: merge shape (K and bytes), drain
    # wall, and the proof-of-compaction segment count.
    key_metrics:
      finalize_ms: last(time_to_index)
      segments: last(compaction_input_segments)
      index_bytes: last(compaction_input_index_bytes)
      drain_wait: max(compaction_wait_time_s)
      postfinal_segments: last(compaction_postfinal_segments)
    # Completed tier finalize (flush + compaction drain) skips on resume; the failed
    # tier re-runs it.
    checkpoint: idempotent
    adapter: cql
    concurrency: 1
    cycles: 1
    tries: 1
    bindings: |
      # 2s pre-poll grace for the drain (f64 = milliseconds, consumed by
      # await_compaction's `delay:`): covers the daemon-dispatch race where
      # the first drain poll could run before trigger_compact's JMX call
      # registers its compaction task — an empty first read would satisfy
      # `await_empty` instantly and release the tier early.
      # Delay before the FIRST drain poll. This is the start-race guard: a
      # major compaction triggered via JMX does not register in
      # system_views.sstable_tasks instantly, and a poll that lands in that gap
      # sees an empty list and declares the drain finished. Observed
      # 2026-08-01 at the old 2000ms: await_compaction returned in 2.2s while
      # the compaction was in fact just starting, and verify_segments then ran
      # against an unsettled table.
      #
      # The start race is now ASSERTED in the drain's `until:` (see
      # await_compaction) rather than merely narrowed here, bounded by
      # `start_evidence_ms` so a compaction too fast to observe cannot hang the
      # poll. This grace just avoids spending a poll on a list that cannot yet
      # be populated.
      const drain_grace := 2000.0
      # Cross-op cell: `read_sstables` writes it, `trigger_compact`'s
      # `if:` reads it. Since 2026-07-23 the cell is declared at the
      # WORKLOAD ROOT (not re-declared here) so the write-through
      # reaches the root `shared sstables` and the sibling
      # `recall_postcompact` phase can gate on it.
      # Wall-clock read for the phase-duration metric.
      volatile now_ms := current_epoch_millis()
    metrics:
      time_to_index: { kind: gauge, value: "now_ms - phase_start" }
    ops:
      flush:
        adapter: http
        # SRD-63: surface this op as its own timed status leaf under the
        # finalize_index phase (flush is the slow SAI-graph build step).
        readout: visible
        # Part of finalize: gated by the finalize toggle.
        if: "enable_finalize != 0"
        # 15s connect budget to the Jolokia agent (see the standalone `flush`
        # phase): fail fast + retry (inherited root tries: 10) rather than hang.
        connect_timeout: 15s
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceFlush(java.lang.String,[Ljava.lang.String;)",
           "arguments":["{keyspace}",[]]}
        request_timeout_ms: 600000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "finalize step 1/5 — flushing {keyspace} memtables to sstables (builds the on-disk SAI vector graph for the just-loaded tier; this is the slow part of a flush, not the write itself)"
          after:  "finalize step 1/5 — flushed {keyspace} (memtables → sstables + vector index)"
      read_sstables:
        adapter: http
        readout: visible
        if: "enable_finalize != 0"
        uri: "http://{host}:8778/jolokia/read/org.apache.cassandra.metrics:type=Table,keyspace={keyspace},scope={table},name=LiveSSTableCount/Value"
        method: GET
        request_timeout_ms: 10000
        connect_timeout: 15s
        verify:
          - field: status
            eq: "200"
        strict: true
        capture:
          # Jolokia wraps the attribute value in `{value: N, status: 200}`.
          sstables: "/value"
        # Key measurable for the leaf row: the count this step exists to read.
        measure: "{sstables} sst"
        metrics:
          table_live_sstables: { kind: gauge, value: sstables }
        memo:
          before: "finalize step 2/5 — reading live sstable count for {keyspace}.{table} (decides whether a compaction is needed)"
          after:  "finalize step 2/5 — {keyspace}.{table} has {sstables} live sstable(s) before compaction"
      trigger_compact:
        adapter: http
        readout: visible
        daemon: true
        # 15s connect budget only — this bounds the connect, not the work.
        connect_timeout: 15s
        # Forced compaction: only when finalize AND compaction are
        # enabled AND there is more than one sstable to merge.
        if: "enable_finalize != 0 && enable_compact != 0 && sstables > 1"
        # FIRE ONCE. `forceKeyspaceCompaction` is synchronous server-side, but
        # holding the call open until it returns buys nothing — `await_compaction`
        # below is the actual waiter, and `verify_segments` at the end of the
        # phase is the actual proof. Retrying it is worse than useless: the
        # inherited root `tries` used to re-fire this op after a client-side
        # timeout while the server's compaction was still running, and each late
        # re-trigger landed on an already-compacted table — a single-sstable
        # input, which the merge path rejects (it needs >= 2 sources), forcing a
        # full OFF_HEAP_REBUILD of every vector in the tier. Observed
        # 2026-07-30: build decisions 12s apart on the same sstable, then a
        # 29.3M-row single-input rebuild.
        tries: 1
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceCompaction(boolean,java.lang.String,[Ljava.lang.String;)",
           "arguments":[false,"{keyspace}",["{table}"]]}
        # Deliberately SHORT (30s): once the compaction has started server-side,
        # the call has done its job. `on_timeout: accept` converts exactly this
        # client-side request timeout into a successful empty result — and only
        # that: a refused connection, a body error, or a non-2xx still fails the
        # op, so a genuine failure to START a compaction is still an error.
        request_timeout_ms: 30000
        on_timeout: accept
        # This op's normal outcome IS a body-less success: it fires the
        # compaction and returns, and `await_compaction` below is what
        # observes the work. Declaring that keeps the adapter from warning
        # once per tier about a timeout that is the designed path.
        expect_body: false
        # `verify` runs on a real response; the accepted-timeout path has no
        # body to check, which is why proof-of-compaction lives in
        # `verify_segments` rather than here.
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "finalize step 3/5 — triggering major compaction of {keyspace}.{table} ({sstables} sstables → 1; merges the vector graph segments and NVQ-refines them). Fire-once, 30s call budget — the drain poll waits, not this call."
          after:  "finalize step 3/5 — major compaction of {keyspace}.{table} triggered"
      # Size distribution of the vector-index segments this compaction is merging.
      # Runs AFTER trigger_compact, which is `daemon: true` — so it reads while the
      # compaction is in flight, and the inputs are still on disk (a major compaction
      # does not retire its sources until it completes). system_views.sstable_indexes
      # emits one row per (index, sstable) with per_column_disk_size (this index's own
      # bytes in that sstable) and per_table_disk_size (the whole sstable). The
      # per-segment list is what makes the merge's K-vs-size shape legible: one large
      # base segment plus a tail of ~1M-row flush segments looks very different from
      # a dozen equal ones, and merge cost tracks that shape.
      segment_sizes:
        adapter: cql
        readout: visible
        if: "enable_finalize != 0 && enable_compact != 0"
        # Advisory, like the drain below: a failed read must not fail the tier.
        errors: ".*:warn,counter"
        raw: |
          SELECT sstable_name, [@per_column_disk_size as seg_index_bytes], per_table_disk_size
            FROM system_views.sstable_indexes
           WHERE keyspace_name = '{keyspace}'
             AND index_name = '{table}{vector_idx_suffix}'
        # Key measurable: how many segments are being merged and their total -
        # the K-vs-size shape this step exists to reveal.
        measure: "{segments} seg {seg_mib_total} MiB"
        capture:
          # Aggregates via the row-set folds (:count / :min / :max / :sum).
          segments:        ":count"
          seg_bytes_min:   ":min(per_column_disk_size)"
          seg_bytes_max:   ":max(per_column_disk_size)"
          seg_bytes_total: ":sum(per_column_disk_size)"
          tbl_bytes_total: ":sum(per_table_disk_size)"
        bindings: |
          # MiB for display; the raw byte columns stay available for metrics.
          # The capture targets themselves are declared as shared wires at the
          # workload level, so they are in scope here and in the drain memo.
          seg_mib_min   := seg_bytes_min / 1048576
          seg_mib_max   := seg_bytes_max / 1048576
          seg_mib_total := seg_bytes_total / 1048576
          tbl_mib_total := tbl_bytes_total / 1048576
          # Both branches always evaluate (dataflow select, not a guard), so the
          # divisor is made safe with max(); the `if` only chooses what to report.
          seg_mib_mean  := if segments > 0 { seg_bytes_total / max(segments, 1) / 1048576 } else { 0 }
        metrics:
          compaction_input_segments:    { kind: gauge, value: segments }
          compaction_input_index_bytes: { kind: gauge, value: seg_bytes_total }
          compaction_input_table_bytes: { kind: gauge, value: tbl_bytes_total }
        memo:
          before: "finalize step 4/5 — measuring the vector-index segments {keyspace}.{table} is merging"
          after:  "finalize step 4/5 — merging {segments} segment(s): index min {seg_mib_min} MiB / mean {seg_mib_mean} MiB / max {seg_mib_max} MiB, total {seg_mib_total} MiB (shared SAI per-sstable components {tbl_mib_total} MiB); per-segment index bytes {seg_index_bytes}"
      await_compaction:
        adapter: cql
        readout: visible
        delay: drain_grace
        # Nothing to poll unless a compaction was triggered.
        if: "enable_finalize != 0 && enable_compact != 0"
        # Advisory status poller: a poll timeout (or any read error) must NOT halt the
        # sweep — this is monitoring, not load. Route every error to warn+count so a slow
        # or wedged compaction drain degrades to a logged warning, not a terminal error
        # that trips the scenario's `children_failed > 0` stop condition.
        #
        # NO completion_ratio filter (2026-07-25): a LIVE task's ratio saturates
        # at 1.0 minutes before the task deregisters — at 60M scale the merge
        # epilogue (compacted-graph write + rescore + cleanup, cassandra's
        # "Writing compacted graph" → "Compaction complete" span) ran 2m22s past
        # ratio 1.0; the old `completion_ratio < 1.0` predicate filtered that
        # live row out, the drain released early, and tier 24's load collided
        # with the merge tail (10% write-attempt failures → error_rate_backstop
        # abort). Counting ALL registered rows can over-wait on stale completed
        # rows that linger a few minutes after finishing (the 2026-07-22
        # observation that motivated the filter) — a bounded, safe delay under
        # the 48h timeout, unlike the unbounded damage of under-waiting. The
        # display captures may briefly show a lingering row's pinned ratio;
        # existence, not the ratio, is the drain condition.
        errors: ".*:warn,counter"
        bindings: |
          # How long the drain waits for EVIDENCE that a compaction actually
          # started before accepting an empty task list.
          #
          # A typed binding here, NOT a workload param. Params reach polydat as
          # STRINGS, so `poll_elapsed_ms >= start_evidence_ms` compared a u64
          # against a string and was never true — the escape arm never fired and
          # the drain waited on a condition that could not become satisfiable.
          # (`const` is not accepted in an OP-level bindings block — it parses as
          # a wire reference named "const" and fails at execution, which dryrun
          # does NOT catch. A plain assignment is the working form here.)
          start_evidence_ms := 60000
          extern active_compactions: u64 = 0
          # Published by the poll wrapper each iteration — lets the condition
          # bound its own patience instead of relying on timeout_ms.
          extern poll_elapsed_ms: u64 = 0
          # "Has a compaction been seen this tier?" — answered from the metric
          # HISTORY rather than a latch variable, because polydat bindings form
          # a DAG and `x := x || ...` is a cycle. compaction_pending_tasks is
          # this op's own published task count, so max_over_time over it is
          # exactly "did any poll see a task", and the `part` filter scopes it
          # to THIS tier so a previous tier's drain cannot answer for this one.
          volatile compaction_observed := round_u64(metricsql_scalar(
              "max_over_time(compaction_pending_tasks{part=\"{part}\"}[6h])"))
          extern completion_ratio:   f64 = 0.0
          extern index_nodes_done:   u64 = 0
          extern index_nodes_total:  u64 = 0
          extern data_bytes_done:    u64 = 0
          extern data_bytes_total:   u64 = 0
          # Drain speed in graph nodes per second: the per-second rate of
          # the compaction_index_nodes_done gauge over a trailing 2m window
          # (one sample lands per 5s poll below). rate()'s counter-reset
          # handling absorbs the drain's task switches (each new task's
          # progress restarts at 0), and finished tiers' series go static
          # (rate 0), so the sum self-scopes to the active drain.
          volatile nodes_per_s := round_u64(metricsql_scalar("sum(rate(compaction_index_nodes_done[2m]))"))
          # The OTHER task kind. system_views.sstable_tasks carries two
          # logically distinct drains and they do not overlap in time: the
          # data compaction (kind='compaction', unit=bytes) and the vector
          # index build (kind='secondary index build', unit=graph nodes).
          # Reporting only one of them made the gutter read `≈0 units/s`
          # for minutes at a stretch — truthfully, since the index build
          # genuinely was not running, while 171 MB/s of data compaction
          # was in flight and invisible. Two rates, always both shown, in
          # the order the work happens.
          volatile mib_per_s := round_u64(metricsql_scalar("sum(rate(compaction_data_bytes_done[2m]))") / 1048576)
        # NO kind filter (2026-07-24): the drain must hold for the WHOLE
        # compaction, not only its index-build tail. During the merge's
        # row-ingest pass the only registered row is the byte-denominated
        # `Compaction` task — filtering to 'secondary index build' made
        # `await_empty` exit in that window, the next tier's
        # trigger_compact then CANCELLED the in-flight merges (the
        # cleanly-interruptible merge honors it), and every cancelled
        # merge left an index-less sstable that scheduled a full
        # 40-thread index rebuild — the flush-starvation storm.
        raw: |
          SELECT completion_ratio, progress, total, kind, unit
            FROM system_views.sstable_tasks
           WHERE keyspace_name = '{keyspace}'
             AND table_name   = '{table}'
          ALLOW FILTERING
        # Aggregated across ALL task rows (2026-07-26): the drain window
        # typically holds TWO tasks in mixed units — the byte-denominated
        # data `Compaction` (which finishes its bytes early and then sits
        # registered at ratio 1.0 while the index build runs) and the
        # ordinal/byte-denominated vector merge. The previous `/0/...`
        # captures pinned whichever row sorted first (the saturated byte
        # task), freezing the memo at "ratio 1.0, ≈0 nodes/s" for entire
        # multi-minute merges. min(ratio) reads the least-complete task —
        # the drain's true state; sum(progress) keeps the nodes/s gutter
        # moving whichever task is advancing.
        # Per-kind, because the rows are NOT commensurable: the data
        # compaction reports `unit=bytes` and the vector index build reports
        # `unit=token range parts`. Summing across them added unlike
        # quantities, and the total silently depended on how many tasks were
        # registered when the sample landed — tier 16 reported ~12.5G against
        # 45-58G for its neighbours purely because one task had deregistered
        # by its last sample.
        #
        # The predicate belongs here rather than in the query: Cassandra
        # allows GROUP BY only on PRIMARY KEY columns, and narrowing the
        # poll's own WHERE would change which rows the drain waits for — the
        # mistake that caused the flush-starvation storm (see the `raw:` note).
        capture:
          active_compactions: ":count"
          completion_ratio:   ":min(completion_ratio)"
          # Vector index build — token range parts.
          index_nodes_done:   ":sum(progress where kind='secondary index build')"
          index_nodes_total:  ":sum(total where kind='secondary index build')"
          # Data compaction — bytes.
          data_bytes_done:    ":sum(progress where kind='compaction')"
          data_bytes_total:   ":sum(total where kind='compaction')"
        # Live drain-speed cell, refreshed per poll iteration (the poll
        # wrapper republishes the during form each poll — the op itself
        # completes only once, at drain end). The phase's ✓ outcome line
        # retains the LAST published value as its final cell, so each
        # tier's closing compaction speed stays readable in scrollback.
        # (This cell replaces the auto completion bar on the stats row;
        # the header meter still shows the ratio-driven percentage.)
        gutter:
          # Both drains, ordered data-then-index, so an idle one reads as a
          # zero NEXT TO a live number rather than as the whole readout.
          text: "≈{mib_per_s} MiB/s ≈{nodes_per_s} n/s"
        poll:
          # The drain is done when no task is registered AND either
          #   (a) a task was actually OBSERVED this tier, or
          #   (b) we have waited `start_evidence_ms` WHILE IDLE without one.
          #
          # (b) is nested inside the idle guard on purpose, and this is the
          # subtle part. Hoisting it to a top-level disjunct — which was tried,
          # 2026-08-01 — makes it fire at `start_evidence_ms` unconditionally,
          # INCLUDING while a compaction is actively running. The drain then
          # exits mid-merge and verify_segments correctly fails on a table that
          # was never given time to settle (observed: 9 polls, 61.9s, then 12
          # segments against a bound of 5).
          #
          # Hoisting was a workaround for `active_compactions` never reading
          # zero, which had a real cause: capture extraction was skipped
          # entirely when a query returned no rows, so the wire kept its last
          # nonzero value forever. That is fixed at the source (an empty result
          # now publishes count/sum identities), so the guard opens honestly
          # and the escape belongs back inside it. Waiting is only unbounded if
          # the IDLE state is unobservable, which it no longer is.
          #
          # (a) is the real assertion: a JMX-triggered compaction does not
          # register in sstable_tasks instantly, and a poll landing in that gap
          # would otherwise call the drain finished 2s after triggering it.
          # (b) is what makes (a) safe: a compaction finishing between two 5s
          # polls is never observed — verified, `max_over_time` reads 0 for real
          # tiers — and without the escape the assertion converts a FAST
          # compaction into a wait to timeout_ms, which is 48 hours.
          #
          # The third disjunct is the caveat: when there was nothing to compact
          # (`sstables <= 1`, so trigger_compact's `if:` never fired), no task
          # will ever appear and an empty list is immediately correct.
          until: "(active_compactions == 0 && (compaction_observed != 0 || poll_elapsed_ms >= start_evidence_ms)) || sstables <= 1"
          interval_ms: 5000
          # 48h. Gracious enough that even the largest (~1B-vector) tier's compaction
          # drain won't hit it under normal progress (was 4h, which the 60-70M tier blew
          # through). If it ever is exceeded, the op-level `errors:` policy above turns the
          # poll_timeout into a warning, not a run-ending error.
          timeout_ms: 172800000
          max_error_retries: 5
          metric_name: compaction_wait_time_s
          # Re-rendered after every poll against that poll's captures, so the
          # memo shows the live measured state of the drain instead of the
          # static `before:` text for the (potentially hours-long) wait.
          memo: "finalize step 5/5 — {keyspace}.{table} compaction draining: ratio {completion_ratio}, data {data_bytes_done}/{data_bytes_total} bytes (≈{mib_per_s} MiB/s), index {index_nodes_done}/{index_nodes_total} nodes (≈{nodes_per_s} n/s), {active_compactions} task(s) in flight | merging {segments} segment(s), index total {seg_mib_total} MiB (max {seg_mib_max} MiB)"
          # The measured fractional completion drives this phase's completion
          # bar/percentage (derived-progress override) — the cycle-based bar
          # would otherwise sit at 0% for the whole drain.
          progress: "{completion_ratio}"
        metrics:
          compaction_completion_ratio:   { kind: gauge, value: completion_ratio }
          # Vector graph nodes (ordinals) — the vector index build only.
          # Cassandra's sstable_tasks labels this unit "token range parts"
          # (TableOperation.Unit.RANGES), but VectorMergeOperation documents
          # what it actually reports there: graph nodes/ordinals. The names
          # here follow the quantity, not the enum's spelling.
          compaction_index_nodes_done:   { kind: gauge, value: index_nodes_done }
          compaction_index_nodes_total:  { kind: gauge, value: index_nodes_total }
          # Bytes — the data compaction only.
          compaction_data_bytes_done:    { kind: gauge, value: data_bytes_done }
          compaction_data_bytes_total:   { kind: gauge, value: data_bytes_total }
          compaction_pending_tasks:      { kind: gauge, value: active_compactions }
        memo:
          before: "finalize step 5/5 — waiting for {keyspace}.{table} vector index build to drain (await_empty; polls system_views.sstable_tasks kind='secondary index build' every 5s)"
          after:  "finalize step 5/5 — {keyspace}.{table} index build at ratio {completion_ratio}, {index_nodes_done}/{index_nodes_total} graph nodes ({active_compactions} task(s) in flight)"
        request_timeout_ms: 60000
      # The completed-compaction counterpart to the live view above
      # (2026-07-28). `system_views.sstable_tasks` shows only what is RUNNING,
      # so a compaction becomes unobservable at the exact moment it finishes —
      # which is the drain's own exit condition. `system.compaction_history`
      # keeps it (node-local, 7d TTL, ~19 rows here) with the bytes actually
      # moved, so the two together give recent-completed and in-flight work in
      # one place instead of a live view that forgets.
      #
      # PER TIER, exactly. The lower bound is this tier's own finalize start,
      # so the rows counted are the compactions THIS tier ran and nothing
      # earlier. Attribution needs nothing further: the tier is already a
      # structural label (`part=`) owned by the partition tier and inherited down,
      # so every metric below carries it. A metric `cell:` would be the wrong
      # tool here — that exists for a dimension whose values arrive from data,
      # and declaring one an ancestor already owns is what `Component::attach`
      # refuses.
      #
      # This was a rolling 24h window until 2026-07-29, because three separate
      # defects stood in the way, all now fixed: `phase_start` was an extern
      # filled only at the completion-time metric pull (so an op reading it got
      # 0 and computed against the epoch); an op binding failed bind-point
      # validation against the wrong program; and the scylla dispensers
      # returned `None` from `canonical_kernel()`, which left this op's
      # PullPlan resolving against the phase kernel — one metric silently read
      # the phase's `__metric_time_to_index`, the next two panicked.
      read_compaction_history:
        adapter: cql
        readout: visible
        if: "enable_finalize != 0 && enable_compact != 0"
        # Monitoring, not load: a failure here must not fail the tier.
        errors: ".*:warn,counter"
        bindings: |
          # This tier's finalize start as integer epoch-ms — the exact lower
          # bound for "compactions this tier ran". `phase_start_millis()` is
          # the runtime's phase-scoped clock node: populated from the phase's
          # first op onward, and anchored to THIS phase rather than to the
          # session (which is what `elapsed_millis()` would give).
          volatile history_since := phase_start_millis()
          extern history_events:    u64 = 0
          extern history_bytes_in:  u64 = 0
          extern history_bytes_out: u64 = 0
        # ~19 rows node-wide behind `id uuid PRIMARY KEY`, so ALLOW FILTERING
        # here scans a table that fits in one page — not the usual trap.
        raw: |
          SELECT count(*) AS n, sum(bytes_in) AS bin, sum(bytes_out) AS bout
            FROM system.compaction_history
           WHERE keyspace_name = '{keyspace}'
             AND columnfamily_name = '{table}'
             AND compacted_at > {history_since}
          ALLOW FILTERING
        # The aggregate returns exactly one row; `:sum` over it is that row.
        # Key measurable: what the completed compactions actually moved.
        measure: "{history_events} cmp"
        capture:
          history_events:    ":sum(n)"
          history_bytes_in:  ":sum(bin)"
          history_bytes_out: ":sum(bout)"
        metrics:
          # Per tier by inheritance — these carry the phase's `part=` label — and
          # per tier by construction, since the query is bounded to this tier's
          # own finalize window.
          compaction_tier_events:    { kind: gauge, value: history_events }
          compaction_tier_bytes_in:  { kind: gauge, value: history_bytes_in }
          compaction_tier_bytes_out: { kind: gauge, value: history_bytes_out }
        memo:
          before: "finalize step 5/5b — reading this tier's completed compactions from system.compaction_history"
          after:  "finalize step 5/5b — {history_events} compaction(s) completed this tier: {history_bytes_in} B in → {history_bytes_out} B out"
        request_timeout_ms: 60000
      # PROOF that the compaction we asked for actually happened. `trigger_compact`
      # is deliberately fire-once with a short, timeout-accepted call budget, so its
      # return value proves only that the request was accepted — never that the work
      # completed. This op is the assertion: after the drain has emptied, the table
      # must have settled to at most `max_postfinal_segments` sstables.
      #
      # Only valid when compaction was explicitly requested: with `enable_compact=0`
      # nothing promised any particular segment count, so the check does not run.
      # A failure here is a real failure — timings measured against an uncompacted
      # table describe a shape the test did not ask for, and reporting them as if
      # they did is worse than stopping.
      verify_segments:
        adapter: cql
        readout: visible
        if: "enable_finalize != 0 && enable_compact != 0"
        # CQL, NOT Jolokia. `forceKeyspaceCompaction` is synchronous server-side
        # and runs ON the Jolokia worker thread, of which there is one — so for
        # the whole duration of a major compaction every other Jolokia request
        # queues behind it. Observed 2026-08-01: this op sat 1m35s burning its
        # timeout and a retry while the endpoint was monopolized, with CQL
        # answering instantly the entire time. A verification step must not
        # depend on the same thread as the work it verifies.
        #
        # Counts vector-index SEGMENTS (rows in sstable_indexes, the same source
        # and the same notion of "segment" that `segment_sizes` measures) rather
        # than table sstables. That is the quantity this test is about, and it
        # keeps the before/after pair commensurable.
        raw: |
          SELECT COUNT(*) AS n FROM system_views.sstable_indexes
           WHERE keyspace_name = '{keyspace}'
             AND table_name = '{table}'
             AND index_name = '{table}{vector_idx_suffix}'
           ALLOW FILTERING
        request_timeout_ms: 60000
        # `extern` declares the captured value as a wire so the memo and the
        # metric can name it (same idiom as read_compaction_history above).
        bindings: |
          extern postfinal_segments: u64 = 0
        verify:
          - field: n
            lte: "{max_postfinal_segments}"
        strict: true
        # Key measurable: the settled count against the bound it must meet.
        measure: "{postfinal_segments}/{max_postfinal_segments} seg"
        capture:
          postfinal_segments: ":max(n)"
        metrics:
          # The settled segment count per tier — the shape every other finalize
          # metric was measured against.
          compaction_postfinal_segments: { kind: gauge, value: postfinal_segments }
        memo:
          before: "finalize step 5/5c — verifying {keyspace}.{table} settled to ≤ {max_postfinal_segments} sstables"
          after:  "finalize step 5/5c — {postfinal_segments} sstable(s) after compaction (max {max_postfinal_segments})"

  # Recall against the post-compaction index AT THIS TIER'S SIZE, using
  # THIS tier's own ground truth (query set + neighbor indices from the
  # tier's prebuffer). `recall` is therefore reported per size tier (the
  # metric carries the profile name as the in-scope `{tier}` label).
  # Skipped (no-op) once a tier's size exceeds `max_size`.
  recall_check:
    # SRD-109 — answer quality (per tier, and per terminal round).
    key_metrics:
      recall: avg(recall_mean)
      recall_p50: avg(recall_p50)
      recall_min: min(recall_min)
      q_p99: max(result_success_p99)
      rows_ret: avg(rows_per_op)
    # Completed tier recall measurement skips on resume (already recorded).
    checkpoint: idempotent
    concurrency: "{query_concurrency}"
    # SRD-82/92 phase-level `interval:` wrapper — re-run THIS PHASE every
    # `recall_interval`, in the same session. Disabled (`0`) by default so
    # the `incremental` sweep measures each tier exactly once; the `recall`
    # scenario opts in with `recall_interval=5m` for a periodic monitor.
    # Note this paces the PHASE (one whole recall measurement per tick), not
    # the queries inside it — a per-query `rate:` would just trickle one
    # query per tick and never complete a measurement.
    interval: "{recall_interval}"
    # SRD-82 ErrorPolicy — recall queries run AFTER compaction, so they should
    # mostly succeed; a transient timeout is counted (not fatal). The `stop_when`
    # sanity backstop fails the phase only if the error rate exceeds
    # `error_rate_backstop` (same servo-layered threshold as `load_increment`,
    # set outside the servo margin) — meaning the recall measurement is
    # untrustworthy.
    errors: ".*:warn,counter"
    # Result-specific backstop, derived from base counters in the predicate
    # (result_failure terminal failed ops / cycles_total completed ops).
    # Non-sugared canonical form (see load_increment for the axis key). The
    # query error-rate crossing the backstop means the recall measurement is
    # untrustworthy → abort: cancel in-flight queries and stop the WHOLE run.
    stop_when:
      - condition: "(cycles_total > 100) & (to_f64(result_failure) > (to_f64(cycles_total) * {error_rate_backstop}))"
        pulse:   continuous
        per:     self
        action:  abort
        at:      workload
    bindings: |
      # Same masked tier as the load: name it by its masked position
      # idx_of(part), prebuffer the tier's own ground-truth facets.
      const tier := matching_profile_name_at('{dataset}', '{profile_pattern}', idx_of(part))
      const prebuffered := dataset_prebuffer(str_concat('{dataset}:', tier))
      const base := query_count(prebuffered)
      # Standard measurement: ONE pass over the tier's full query set (the
      # dataset's own query count), so every tier reports recall over the
      # same standard N queries.
      cursor q = range(0, base)
      # DISABLED 2026-07-23 — time-boxed form: repeated the query set until
      # `min_query_ms` had elapsed, sizing the measurement by TIME rather
      # than a standard query count, which made per-tier sample sizes
      # unequal (fast tiers repeated queries; slow tiers under-sampled).
      # Re-enable by swapping the cursor back:
      # cursor q = until_elapsed(base, min_query_ms)
      query_vector := query_vector_at(prebuffered, q % base)
      ground_truth := neighbor_indices_at(prebuffered, q % base)
      # Ground-truth neighbor DISTANCES for the same query (already in the
      # prebuffer — this facet loads once, ~Q*k*4 bytes). Feeds the LID
      # metric below; adds no Cassandra query.
      neighbor_distances := neighbor_distances_at(prebuffered, q % base)
    ops:
      select_ann:
        timeout: 60s   # 60s per read; retried up to the phase `tries` budget on a CQL timeout
        prepared: |
          SELECT [key] FROM {keyspace}.{table}
          ORDER BY value
          ANN OF {query_vector}
          LIMIT {limit}
        metrics:
          rows_per_op:
            kind: gauge
            value: count
          # Local intrinsic dimensionality (Levina–Bickel MLE) of THIS tier,
          # computed per query from the prebuffered ground-truth neighbor
          # distances — zero extra Cassandra queries, purely client-side
          # (see partitioned-scan-build.md §10: LID predicts whether a 1-D
          # vector-locality ordering can help — low & tight favours it,
          # high or heterogeneous does not). The histogram stores u64, so the
          # value is scaled ×1000: read p50/p90 and divide by 1000 to get the
          # dimension. Degenerate queries (duplicate/self-match neighbors)
          # emit 0 and should be read past when interpreting the low tail.
          lid_millidim:
            kind: histogram
            value: "lid_mle(neighbor_distances, k) * 1000"
        evaluations:
          relevancy:
            actual: key
            expected: ground_truth
            k: k
            r: limit
            functions:
              - recall

