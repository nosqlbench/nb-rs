#!/usr/bin/env nbrs
# JVector two-flush compaction recall test (updated — current syntax).
#
# Loads the FIRST 50% of the dataset, flushes to disk, loads the
# SECOND 50%, flushes again — producing two on-disk SSTables — then
# forces a major compaction to merge them and measures ANN recall
# against the post-compaction index.
#
# The schema pins SizeTieredCompactionStrategy thresholds high
# (100000) so Cassandra never compacts spontaneously mid-load; the
# test owns compaction timing explicitly via the `finalize_index`
# phase (flush -> read SSTable count -> daemon major-compaction ->
# poll system_views.sstable_tasks until idle).
#
# Usage:
#   nbrs workload=compaction_test_updated2.yaml
#   nbrs workload=compaction_test_updated2.yaml host=10.0.0.1
#   nbrs workload=compaction_test_updated2.yaml dataset=/path/to/cohere-1M

description: |
  JVector two-flush compaction recall test: load 50% + flush, load
  50% + flush, major-compact the resulting SSTables, then measure
  ANN recall. Uses the current CQL vector patterns (STCS-pinned
  schema, Jolokia flush/compact, sstable_tasks poll, ANN relevancy).
  Requires a vector-capable CQL target, a Jolokia agent on :8778,
  and a local vector dataset catalog.

params:
  adapter: cql
  host: 18.215.16.255
  dataset: cohere-english-v3-1M
  profile: default
  keyspace: baselines
  table: cohere_1m
  concurrency: "100"
  query_concurrency: "20"
  replication: "{'class': 'SimpleStrategy', 'replication_factor': '1'}"
  # k / limit / min_query_ms are referenced as bare wires (`k: k`,
  # `r: limit`, `until_elapsed(base, min_query_ms)`), so they are
  # numeric params, not strings.
  k: 10
  limit: 100
  min_query_ms: 30000
  vector_idx_suffix: _vector_idx

  # SAI jvector index build knobs.
  source_model: COHERE_V3
  maximum_node_connections: 16
  construction_beam_width: 100
  enable_hierarchy: true
  neighborhood_overflow: 1.2
  alpha: 1.2

  # ── idx_sweep axes ───────────────────────────────────────────
  # The `idx_sweep` scenario sweeps these SAI index-build knobs. The
  # short `sm`/`mnc`/… for: iter-var names (used below) deliberately
  # differ from the long workload-param names they shadow via `set:`.
  # Values are comma-strings; pin any axis on the CLI to collapse it
  # (e.g. `mnc_values=16 eh_values=true`). Defaults are modest (8
  # combinations) — widen them for a fuller sweep.
  sm_values:    [OTHER]
  mnc_values:   [8, 16]
  bw_values:    [50, 100]
  eh_values:    [false, true]
  nbo_v_values: [1.2]
  alf_v_values: [1.2]

scenarios:
  default:
    - teardown
    - schema
##    - tune_cluster
#    - continuous_ann_query - sparse throughout the life of the workload
    - rampup_first_half
#    - flush # do not do this if we are treating the system as a basic user would
    - rampup_second_half
    #    - flush # do not do this if we are treating the system as a basic user would
#    - finalize_index # we will want to do this, but only after capturing measurements first
    - ann_query

  # Single-phase scenarios for piecewise runs.
  reset:   [teardown]
  ddl:     [schema]
  load1:   [rampup_first_half]
  load2:   [rampup_second_half]
  roll:    [flush]
  compact: [finalize_index]
  query:   [ann_query]

  # ── Index-build parameter sweep (full_cql_vector_sweep.yaml pattern) ──
  #
  # For every combination of the SAI build knobs — source_model ×
  # maximum_node_connections × construction_beam_width × enable_hierarchy
  # × neighborhood_overflow × alpha — rebuild the table+index with those
  # knobs and run the full two-flush compaction load → major-compaction →
  # recall query. So recall and `time_to_index` are reported PER
  # index-build configuration (the recall metric carries the knob values
  # as labels via the in-scope iter-vars).
  #
  # The short `sm`/`mnc`/… iter-vars shadow the long workload params via
  # `set:` (a bare `set:` value is a wire reference). One table, rebuilt
  # per combination by the leading `teardown` — so no per-variant table
  # names or keyspace_reset are needed (unlike full_cql_vector_sweep,
  # which keeps every variant's table and must reset the keyspace).
  idx_sweep:
    - for: |
        sm in sm_values,
        mnc in mnc_values,
        bw in bw_values,
        eh in eh_values,
        nbo_v in nbo_v_values,
        alf_v in alf_v_values
      phases:
        - set: { source_model: sm,
                 maximum_node_connections: mnc,
                 construction_beam_width: bw,
                 enable_hierarchy: eh,
                 neighborhood_overflow: nbo_v,
                 alpha: alf_v }
          phases:
            - teardown
            - schema
            - tune_cluster
            - rampup_first_half
            - flush
            - rampup_second_half
            - flush
            - finalize_index
            - ann_query

phases:
  # Anti-DDL teardown: drop the index, then the table. Per-statement
  # timeout floor — a DROP on a populated SAI index can take tens of
  # seconds.
  teardown:
    concurrency: 1
    bindings: |
      const request_timeout_ms := 300000
    ops:
      drop_vector_index:
        raw: "DROP INDEX IF EXISTS {keyspace}.{table}{vector_idx_suffix}"
      drop_table:
        raw: "DROP TABLE IF EXISTS {keyspace}.{table}"

  schema:
    concurrency: 1
    bindings: |
      dim := vector_dim("{dataset}:{profile}")
      similarity_function := dataset_distance_function("{dataset}:{profile}")
    ops:
      create_keyspace:
        raw: |
          CREATE KEYSPACE IF NOT EXISTS {keyspace}
          WITH replication = {replication} AND durable_writes = true
      create_table:
        # STCS thresholds pinned high (100000) so the size-tier
        # compactor never fires spontaneously mid-load — the test
        # owns compaction timing via `finalize_index`.
        raw: |
          CREATE TABLE IF NOT EXISTS {keyspace}.{table}
          (key text PRIMARY KEY, value vector<float, {dim}>)
          WITH compression = {'enabled': 'false'}
      create_vector_index:
        raw: |
          CREATE CUSTOM INDEX IF NOT EXISTS {table}{vector_idx_suffix}
          ON {keyspace}.{table} (value)
          USING 'StorageAttachedIndex'
          WITH OPTIONS = {
            'similarity_function': '{similarity_function}',
            'source_model': '{source_model}',
            'maximum_node_connections': '{maximum_node_connections}',
            'construction_beam_width': '{construction_beam_width}',
            'enable_hierarchy': '{enable_hierarchy}',
            'neighborhood_overflow': '{neighborhood_overflow}',
            'alpha': '{alpha}'
          }

  # Boost compaction throughput + parallelism at session start so the
  # major compaction in `finalize_index` isn't throttled by the
  # per-node defaults (CompactionThroughputMbPerSec=64 /
  # ConcurrentCompactors=2). `0` is Cassandra's "no rate limit"
  # sentinel.
  tune_cluster:
    adapter: http
    concurrency: 1
    cycles: 1
    ops:
      set_compaction_throughput:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"write",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "attribute":"CompactionThroughputMbPerSec",
           "value":0}
        request_timeout_ms: 10000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "tuning: CompactionThroughputMbPerSec -> 0 (unlimited)"
          after:  "tuned: CompactionThroughputMbPerSec -> 0 (unlimited)"
      set_concurrent_compactors:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"write",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "attribute":"ConcurrentCompactors",
           "value":10}
        request_timeout_ms: 10000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "tuning: ConcurrentCompactors -> 10"
          after:  "tuned: ConcurrentCompactors -> 10"

  # First 50% of the dataset (cursor window `0..50%`).
  rampup_first_half:
    concurrency: "{concurrency}"
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      cursor row = range(0, vector_count(prebuffered)) over "0..50%"
      id := format_u64(row, 10)
      train_vector := vector_at(prebuffered, row)
    ops:
      insert:
        max_batch_size: 64KB
        batchtype: unlogged
        prepared: |
          INSERT INTO {keyspace}.{table} (key, value)
          VALUES ('{id}', {train_vector})

  # Second 50% of the dataset (cursor window `50%..100%`).
  rampup_second_half:
    concurrency: "{concurrency}"
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      cursor row = range(0, vector_count(prebuffered)) over "50%..100%"
      id := format_u64(row, 10)
      train_vector := vector_at(prebuffered, row)
    ops:
      insert:
        max_batch_size: 64KB
        batchtype: unlogged
        prepared: |
          INSERT INTO {keyspace}.{table} (key, value)
          VALUES ('{id}', {train_vector})

  # Flush memtables to disk (synchronous JMX exec). Each flush rolls
  # the current memtable into a new SSTable; two flushes (one after
  # each rampup half) leave two SSTables for `finalize_index` to
  # compact-merge.
  flush:
    adapter: http
    concurrency: 1
    cycles: 1
    ops:
      flush:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceFlush(java.lang.String,[Ljava.lang.String;)",
           "arguments":["{keyspace}",[]]}
        request_timeout_ms: 600000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "flushing keyspace {keyspace}"
          after:  "flushed keyspace {keyspace}"

  # Major compaction. One stanza, ops run once each in order:
  #   flush          -> roll any remaining memtable to disk
  #   read_sstables  -> read LiveSSTableCount; capture `sstables`
  #   trigger_compact-> DAEMON, `if: sstables > 1`; holds the JMX
  #                     socket open for the whole synchronous compaction
  #   poll_progress  -> CQL system_views.sstable_tasks, op-level
  #                     `poll: await_empty`; live progress until idle
  # The two preceding flush phases guarantee >= 2 SSTables, so the
  # `if: sstables > 1` guard fires and the compaction runs.
  finalize_index:
    adapter: cql
    concurrency: 1
    cycles: 1
    bindings: |
      # Cross-op cell: `read_sstables` writes it, `trigger_compact`'s
      # `if:` reads it. `shared` so the write-through propagates across
      # ops on the phase scope.
      shared sstables := 0
      # Wall-clock read for the phase-duration metric.
      volatile now_ms := current_epoch_millis()
    metrics:
      time_to_index: { kind: gauge, value: "now_ms - phase_start" }
    ops:
      flush:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceFlush(java.lang.String,[Ljava.lang.String;)",
           "arguments":["{keyspace}",[]]}
        request_timeout_ms: 600000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "flushing keyspace {keyspace}"
          after:  "flushed keyspace {keyspace}"
      read_sstables:
        adapter: http
        uri: "http://{host}:8778/jolokia/read/org.apache.cassandra.metrics:type=Table,keyspace={keyspace},scope={table},name=LiveSSTableCount/Value"
        method: GET
        request_timeout_ms: 10000
        verify:
          - field: status
            eq: "200"
        strict: true
        capture:
          # Jolokia wraps the attribute value in `{value: N, status: 200}`.
          sstables: "/value"
        metrics:
          table_live_sstables: { kind: gauge, value: sstables }
        memo:
          after: "{keyspace}.{table}: {sstables} live sstable(s) before compaction"
      trigger_compact:
        adapter: http
        daemon: true
        if: "sstables > 1"
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceCompaction(boolean,java.lang.String,[Ljava.lang.String;)",
           "arguments":[false,"{keyspace}",["{table}"]]}
        request_timeout_ms: 3600000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "compacting {keyspace}.{table}"
          after:  "compacted {keyspace}.{table}"
      poll_progress:
        adapter: cql
        bindings: |
          extern active_compactions: u64 = 0
          extern completion_ratio:   f64 = 0.0
          extern progress:           u64 = 0
          extern total:              u64 = 0
        raw: |
          SELECT completion_ratio, progress, total
            FROM system_views.sstable_tasks
           WHERE keyspace_name = '{keyspace}'
             AND table_name   = '{table}'
             AND kind         = 'compaction'
          ALLOW FILTERING
        capture:
          # `:count` reduces the result array to its length so the
          # poll's emptiness check + the predicate compare to 0.
          active_compactions: ":count"
          completion_ratio:   "/0/completion_ratio"
          progress:           "/0/progress"
          total:              "/0/total"
        poll:
          mode: await_empty
          interval_ms: 5000
          timeout_ms: 14400000
          max_error_retries: 5
          metric_name: compaction_wait_time_s
        metrics:
          compaction_completion_ratio: { kind: gauge, value: completion_ratio }
          compaction_progress_bytes:   { kind: gauge, value: progress }
          compaction_total_bytes:      { kind: gauge, value: total }
          compaction_pending_tasks:    { kind: gauge, value: active_compactions }
        memo:
          after: "compacting {keyspace}.{table}: ratio {completion_ratio}, {progress}/{total} bytes ({active_compactions} task(s) in flight)"
        request_timeout_ms: 60000

  # ANN recall against the post-compaction index. Extending cursor:
  # dispatch full `base`-sized passes through the prebuffered query
  # set until min_query_ms of wall-clock has elapsed, stopping at the
  # next whole-pass boundary.
  ann_query:
    concurrency: "{query_concurrency}"
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      const base := query_count(prebuffered)
      cursor q = until_elapsed(base, min_query_ms)
      query_vector := query_vector_at(prebuffered, q % base)
      ground_truth := neighbor_indices_at(prebuffered, q % base)
    ops:
      select_ann:
        prepared: |
          SELECT [key] FROM {keyspace}.{table}
          ORDER BY value
          ANN OF {query_vector}
          LIMIT {limit}
        metrics:
          rows_per_op:
            kind: gauge
            value: count
        evaluations:
          relevancy:
            actual: key
            expected: ground_truth
            k: k
            r: limit
            functions:
              - recall
