#!/usr/bin/env nbrs
# JVector two-flush compaction recall test.
# Loads 50% of vectors, flushes, loads the other 50%, flushes,
# forces a major compaction, then measures recall.
#
# Usage:
#   nbrs workload=compaction_test_updated.yaml
#   nbrs workload=compaction_test_updated.yaml dataset=/path/to/cohere-1M
#   nbrs workload=compaction_test_updated.yaml dataset=cohere-1M host=10.0.0.1

params:
  adapter: cql
  host: 18.215.16.255
  dataset: cohere-english-v3-1M
  profile: default
  keyspace: baselines
  table: cohere_1m
  concurrency: "100"
  query_concurrency: "20"
  replication: "{'class': 'SimpleStrategy', 'replication_factor': '1'}"
  k: "10"
  limit: "100"
  min_query_ms: "30000"
  vector_idx_suffix: _vector_idx

  # SAI jvector index build knobs — match full_cql_vector.yaml defaults.
  # Override on the CLI to probe different build configurations.
  source_model: COHERE_V3
  maximum_node_connections: 16
  construction_beam_width: 100
  enable_hierarchy: true
  neighborhood_overflow: 1.2
  alpha: 1.2

bindings: |
  dim := vector_dim("{dataset}:{profile}")
  similarity_function := dataset_distance_function("{dataset}:{profile}")

scenarios:
  default:
    - teardown
    - schema
    - jolokia_disable_compaction
    - rampup_first_half
    - jolokia_flush
    - rampup_second_half
    - jolokia_flush
    - jolokia_compact
    - ann_query

  teardown:
    - teardown

  schema:
    - schema

  disable_compaction:
    - jolokia_disable_compaction

  rampup_first_half:
    - rampup_first_half

  flush:
    - jolokia_flush

  rampup_second_half:
    - rampup_second_half

  compact:
    - jolokia_compact

  query:
    - ann_query
  
phases:
  # within a phase all of the ops defined comprise the stanza, which is the execution plan for the set of operations defined
  teardown:
    concurrency: 1
    ops:
      drop_index:
        raw: "DROP INDEX IF EXISTS {keyspace}.{table}{vector_idx_suffix}"
      drop_table:
        raw: "DROP TABLE IF EXISTS {keyspace}.{table}"

  schema:
    concurrency: 1
    ops:
      create_keyspace:
        raw: |
          CREATE KEYSPACE IF NOT EXISTS {keyspace}
          WITH replication = {replication} AND durable_writes = true
      create_table:
        raw: |
          CREATE TABLE IF NOT EXISTS {keyspace}.{table}
          (key text PRIMARY KEY, value vector<float, {dim}>)
          WITH compaction = {
            'class': 'SizeTieredCompactionStrategy',
            'min_threshold': '2',
            'max_threshold': '5'
          }
          AND compression = {'enabled': 'false'}
      create_vector_index:
        raw: |
          CREATE CUSTOM INDEX IF NOT EXISTS {table}{vector_idx_suffix}
          ON {keyspace}.{table} (value)
          USING 'StorageAttachedIndex'
          WITH OPTIONS = {
            'similarity_function': '{similarity_function}',
            'source_model': '{source_model}',
            'maximum_node_connections': '{maximum_node_connections}',
            'construction_beam_width': '{construction_beam_width}',
            'enable_hierarchy': '{enable_hierarchy}',
            'neighborhood_overflow': '{neighborhood_overflow}',
            'alpha': '{alpha}'
          }
  
  # Disable background compaction before loading so Cassandra won't
  # merge SSTables mid-load. Equivalent to: nodetool disableautocompaction
  jolokia_disable_compaction:
    adapter: http
    concurrency: 1
    cycles: 1
    ops:
      disable_compaction:
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"disableAutoCompaction(java.lang.String,[Ljava.lang.String;)",
           "arguments":["{keyspace}",["{table}"]]}
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "disabling auto-compaction on {keyspace}.{table}"
          after:  "auto-compaction disabled"

  # First 50% of the dataset using the cursor partition `over` clause.
  rampup_first_half:
    concurrency: "{concurrency}"
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      cursor row = range(0, vector_count(prebuffered)) over "0..50%" #replace "0..50%" with newer format using partition comprehension defined earlier
      id := format_u64(row, 10)
      train_vector := vector_at(prebuffered, row)
    ops:
      insert:
        max_batch_size: 64KB
        batchtype: unlogged
        prepared: |
          INSERT INTO {keyspace}.{table} (key, value)
          VALUES ('{id}', {train_vector})

  # Second 50% of the dataset.
  rampup_second_half:
    concurrency: "{concurrency}"
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      cursor row = range(0, vector_count(prebuffered)) over "50%..100%"
      id := format_u64(row, 10)
      train_vector := vector_at(prebuffered, row)
    ops:
      insert:
        max_batch_size: 64KB
        batchtype: unlogged
        prepared: |
          INSERT INTO {keyspace}.{table} (key, value)
          VALUES ('{id}', {train_vector})

  # Flush memtables to disk — equivalent to: nodetool flush
  jolokia_flush:
    adapter: http
    concurrency: 1
    cycles: 1
    ops:
      flush:
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceFlush(java.lang.String,[Ljava.lang.String;)",
           "arguments":["{keyspace}",[]]}
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "flushing keyspace {keyspace}"
          after:  "flushed keyspace {keyspace}"

  # Major compaction — equivalent to: nodetool compact
  # forceKeyspaceCompaction is SYNCHRONOUS: blocks until done.
  # For 1M vectors this can take 20-30 min; timeout set to 2 hours.
  jolokia_compact:
    adapter: http
    concurrency: 1
    cycles: 1
    ops:
      compact:
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceCompaction(boolean,java.lang.String,[Ljava.lang.String;)",
           "arguments":[false,"{keyspace}",["{table}"]]}
        request_timeout_ms: 7200000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "compacting {keyspace}.{table} — blocks until done"
          after:  "compacted {keyspace}.{table}"

  ann_query:
    concurrency: "{query_concurrency}"
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      const base := query_count(prebuffered)
      cursor q = until_elapsed(base, min_query_ms)
      query_vector := query_vector_at(prebuffered, q % base)
      ground_truth := neighbor_indices_at(prebuffered, q % base)
    ops:
      select_ann:
        prepared: |
          SELECT key FROM {keyspace}.{table}
          ORDER BY value ANN OF {query_vector}
          LIMIT {limit}
        evaluations:
          relevancy:
            actual: key
            expected: ground_truth
            k: k
            r: limit
            functions:
              - recall

