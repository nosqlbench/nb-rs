#!/usr/bin/env nbrs
# CQL Vector Search — Multi-Profile Discovery
#
# Generic phases parameterized by {table}, {dataset}, and {profile}.
# Scenario trees set {profile} (and sometimes {table}) via for
# iteration variables. Dataset-facing calls use the canonical
# "{dataset}:{profile}" composite inline format.
#
# Usage:
#   nbrs full_cql_vector.yaml scenario=fulltest
#   nbrs full_cql_vector.yaml scenario=filtered_knn
#   nbrs full_cql_vector.yaml scenario=unfiltered
#   nbrs full_cql_vector.yaml scenario=filtered_knn limit=100

params:
  host: localhost
  adapter: cql
  dataset: example
  prefix: ""
  oracles_prefix: "label_"
  keyspace: baselines
  k_values: "1,10,100"
  k_1_limits: "1,2,4,8,16,32,64"
  k_10_limits: "10,20,30,40,50"
  k_100_limits: "100,125,150,175,200"
  concurrency: "100"
  query_concurrency: "20"
  replication: "{'class': 'SimpleStrategy', 'replication_factor': '1'}"
  fknn_profile: default
  vector_idx_suffix: _vector_idx
  meta_idx_suffix: _meta_idx
  # Minimum wall-clock duration per ann_query / pvs_metadata_query
  # / pvs_query phase in milliseconds. The query cursor extends in
  # `base`-sized passes (one full sweep of the prebuffered query
  # set) until this much time has elapsed since phase start, at
  # which point the policy stops at the next whole-pass boundary.
  # 30 s gives each (profile, k, limit) phase enough cadence-window
  # coverage for stable rate and latency averages.
  min_query_ms: 10000

  # Filtered-ANN planner mode. Drives the per-query `WITH
  # ann_options = …` clause that the query phases bake into
  # their `prepared:` strings at op-template construction time.
  # Values:
  #
  #   `default` — empty clause. cndb's planner picks rerankK
  #               from the source-model's tapered multiplier and
  #               may flip to brute force per
  #               `V2VectorIndexSearcher.CostEstimate.shouldUseBruteForce`.
  #   `pinned`  — every ANN query carries `WITH ann_options =
  #               {'rerank_k': '<limit>', 'use_pruning': 'false'}`,
  #               pinning rerank_k to the LIMIT (no auto-
  #               amplification) and disabling JVector's pruning
  #               shortcut so the planner stays on approximate
  #               HNSW even at large LIMIT. cndb-only — OSS
  #               Cassandra rejects the `WITH ann_options`
  #               extension at parse.
  #
  # See `local/brute_force.md` for the analysis. The
  # `fulltest_rerank_pinned` scenario uses a scenario-tree
  # `set: { rerank_mode: pinned }` node to shadow this default
  # over its inner phase tree (see `scenarios:` below). The
  # workload-param default keeps `fulltest` (and every other
  # scenario without an override) resolvable — the
  # `const ann_opts := select_str(str_eq(rerank_mode, "pinned"),
  # …)` binding in each query phase reads `rerank_mode` as a
  # plain name, so something has to bind it at the workload
  # level even when nothing overrides it.
  rerank_mode: default

  # ────────────────────────────────────────────────────────────
  # SAI vector index build knobs — emitted into every
  # `CREATE CUSTOM INDEX … WITH OPTIONS = {…}` (SRD-72 schema
  # extension).
  #
  # Each knob has a documented stable default. Sibling sweep
  # workloads (`full_cql_vector_sweep.yaml`) shadow individual
  # values via scenario-tree `set:` to probe the parameter
  # space; production scenarios run with the defaults below
  # so the schema is reproducible across cndb releases (i.e.
  # we don't depend on the cluster's current build-path
  # defaults for `neighborhood_overflow` / `alpha`).
  #
  # source_model — picks compression ratio + overquery factor.
  #   `OTHER` is the cndb-fallback (generic compression, generic
  #   overquery), chosen so the schema doesn't assume a specific
  #   embedding family. Sweepable: ADA002, OPENAI_V3_SMALL,
  #   OPENAI_V3_LARGE, BERT, GECKO, NV_QA_4, COHERE_V3, OTHER.
  source_model: OTHER
  # maximum_node_connections — HNSW M parameter (doubled
  #   internally → effective max-degree = 32 at M=16). cndb
  #   default. Range 1..512. Sweepable.
  maximum_node_connections: 16
  # construction_beam_width — HNSW efConstruction. cndb
  #   default. Up to 3200. Sweepable.
  construction_beam_width: 100
  # enable_hierarchy — hierarchical layers atop the jVector
  #   graph. cndb default off. Sweepable.
  enable_hierarchy: false
  # neighborhood_overflow — Vamana/DiskANN edge-pruning slack
  #   during build. cndb default varies by build path
  #   (in-memory vs compaction); 1.2 is a stable mid-range
  #   value used widely in jVector tuning notes. Sweepable.
  neighborhood_overflow: 1.2
  # alpha — Vamana relative-density pruning factor. Same
  #   "default varies by build path" caveat as
  #   neighborhood_overflow; 1.2 is the canonical cosine-space
  #   tuning. Sweepable.
  alpha: 1.2

# Unified report block (SRD-46): plots + tables in declaration
# order. Each scenario contributes its items to its own
# scenario-specific markdown file so the post-run reports stay
# scoped to the data they describe.
#
# Scenarios:
#   - `test_oracles` → ANN/recall sweep, emits recall@N metrics
#     under the `ann_query` phase.
#   - `test_fknn`    → filtered-KNN sweep, emits recall metrics
#     under the `pvs_query` phase.
#
# A `Run Details` block is auto-prepended to each markdown
# file by the runtime — no need to declare it here.

# Surface recall-family aggregates and latency on the inline
# progress line and per-phase ✓ DONE summary. Doc-root setting
# is inherited by every phase that doesn't declare its own
# `status_metrics:`. Glob patterns: `recall*` matches the
# `recall` family (with `k`/`r` labels carrying the cutoff)
# from the relevancy block; `latency*` matches the
# `latency_p50` / `latency_p99` / `latency_max` /
# `latency_mean` family sourced from the service-time histogram.
status_metrics: [recall*, latency*]

report:
  defaults:
    palette: wong

  oracles_section: |
    file oracles_report.md as 'ANN Recall Sweep'

    text heading as "Introduction":
     This report covers the **test_oracles** scenario: per-
     profile partition tests that sweep `k` and `limit` against
     a SAI-indexed vector column. Recall is measured against the
     ground truth provided by the dataset's test set.

     Figures below show the per-profile and aggregate recall@k
     curves; the table summarises mean recall by profile.

    table recall_oracles:
      group_by: profile
      query: recall: avg(recall_mean{k="10"}) by (profile,limit)
      query: latency: avg(cycles_servicetime_mean) by (profile,limit)

    plot recall_vs_qps:
      label: "Recall vs QPS, (oracles & PVS)"
      scale: 2
      legend: br
      y1: (cycles_total_rate, recall_mean){phase=~".*query"} by (phase,k,limit)
      point-label1: limit
      x-legend: "QPS (log)"
      x-scale: log
      y-side: left
      y-labels: ["recall"]
      y-legends: ["k=[k] [phase]"]
      y-ranges: [[,1.0]]
      series: phase,k
      style: phase=ann_query:line=dotted


#    plot recall_vs_qps__pvs
#      label "Recall vs QPS (PVS)"
#      legend: br
#      y1: (cycles_total_rate, recall_mean){phase=~"pvs_query"} by (phase,k,limit)
#      point-label1: limit
#      x-legend: "QPS"
#      xscale=log
#      y-side: left
#      y-labels: ["recall"]
#      y-legends: ["k=[k] [phase]"]
#      y-ranges: [[,1.0]]
#      series: phase,k
#      style phase=ann_query:line=dotted


bindings: |
  profiles := matching_profiles("{dataset}", "{prefix}")

scenarios:

  default:
    - scenario: fulltest

  fulltest:
    - tune_cluster
    - scenario: test_oracles
    - scenario: test_fknn

  # Rerank-pinned variant: `set:` shadows the `rerank_mode`
  # workload-param over the inner phase tree, so every query
  # phase's `const ann_opts := select_str(str_eq(rerank_mode,
  # "pinned"), …)` binding sees the override and constructs
  # the `WITH ann_options = {…}` clause. No CLI plumbing
  # needed — the scenario name itself flips the behaviour.
  # cndb-only (OSS Cassandra rejects `WITH ann_options`).
  fulltest_rerank_pinned:
    - set: { rerank_mode: pinned }
      phases:
        - scenario: fulltest

  # Per-profile partition test (label_00..label_11)
  test_oracles:
    - tune_cluster
    - for: "profile in matching_profiles('{dataset}', '{oracles_prefix}')"
      phases:
        - for: "table in vec_{profile}"
          phases:
            - teardown
            - schema
            - rampup
            - ensure_flushed
            - jolokia_compact
            - jolokia_await_compaction
            - for: "k in {k_values}, limit in {k_{k}_limits}"
              phases:
                - ann_query

  # Query-only oracle scenario — same parameter sweep as
  # `test_oracles` but skips teardown/schema/rampup/await_index.
  # Use against tables already populated by a prior `test_oracles`
  # run to measure recall as the SAI index ages without
  # re-paying the rampup cost. If recall here climbs over
  # repeated invocations, the SAI index hasn't fully settled by
  # the time `await_index`'s polling returns.
  test_oracles_query_only:
    - for: "profile in matching_profiles('{dataset}', '{oracles_prefix}')"
      phases:
        - for: "table in vec_{profile}"
          phases:
            - for: "k in {k_values}, limit in {k_{k}_limits}"
              phases:
                - ann_query

  test_fknn:
    - tune_cluster
    - for: "profile in {fknn_profile}, table in fknn_{profile}"
      phases:
        - teardown
        - schema
        - fknn_rampup_data
        - ensure_flushed
        - jolokia_compact
        - jolokia_await_compaction
        - for: "k in {k_values}, limit in {k_{k}_limits}"
          phases:
            - pvs_query


# =====================================================================
# Generic Phases — parameterized by {table}, {dataset}, and {profile}
# =====================================================================

phases:

  # ── Hard reset ───────────────────────────────────────────────
  #
  # `keyspace_reset` is the nuclear option: drop the entire
  # `{keyspace}` (taking out every table + every SAI index +
  # every materialized view in one statement), then re-create
  # it fresh. Use this at the very top of a sweep scenario when
  # the cluster carries residue from prior runs whose naming
  # scheme has drifted from the current sweep's `fknn_oat_*`
  # convention.
  #
  # Why this exists in addition to the per-cell `teardown`:
  #
  # `teardown` (below) drops one cell's `{table}` + 2 indexes.
  # The pre-sweep cleanup loop iterates the current sweep's
  # cross-product (64 cells) and runs `teardown` for each.
  # Both surfaces are scoped to the CURRENT naming scheme —
  # they cannot evict tables / indexes left over from a prior
  # sweep whose names don't match (e.g. `vec_label_*`,
  # `fknn_default_*`, an older `fknn_oat_*` axis combination
  # that's no longer in the cross product).
  #
  # Dropping the keyspace is O(1) statements regardless of
  # how many tables / indexes have accumulated; it sidesteps
  # the global SAI-index cap (cndb's "Cannot have more than
  # 100 StorageAttachedIndex secondary indexes") because the
  # cap is per-keyspace-set, not per-DROP. Re-creating the
  # keyspace with the same replication config restores the
  # blank slate the subsequent `schema` phase expects.
  #
  # Per-statement timeout is the workload-param
  # `request_timeout_ms` default (5 minutes); DROP KEYSPACE
  # can take a while on a cluster with many tables but
  # shouldn't exceed this on a 200-table keyspace.
  keyspace_reset:
    concurrency: 1
    cycles: 1
    bindings: |
      const request_timeout_ms := 300000
    ops:
      drop_keyspace:
        raw: "DROP KEYSPACE IF EXISTS {keyspace}"
        memo:
          before: "dropping keyspace {keyspace} (hard reset)"
          after:  "dropped keyspace {keyspace}"
      create_keyspace:
        raw: |
          CREATE KEYSPACE IF NOT EXISTS {keyspace}
          WITH replication = {replication} AND durable_writes = true
        memo:
          before: "re-creating keyspace {keyspace}"
          after:  "re-created keyspace {keyspace}"

  schema:
    concurrency: 1
    bindings: |
      dim := vector_dim("{dataset}:{profile}")
      similarity_function := dataset_distance_function("{dataset}:{profile}")
    ops:
      create_keyspace:
        raw: |
          CREATE KEYSPACE IF NOT EXISTS {keyspace} 
          WITH replication = {replication} AND durable_writes = true
      create_table:
        raw: |
          CREATE TABLE IF NOT EXISTS {keyspace}.{table}
          (key text PRIMARY KEY, value vector<float, {dim}>, metadata int)
          WITH
           compaction = {
           'class': 'SizeTieredCompactionStrategy',
           'min_threshold': '100000',
           'max_threshold': '100000' }
          AND compression = {
           'enabled': 'false'
          }
        # `min_threshold` / `max_threshold` set arbitrarily
        # high (100000) so Cassandra's size-tier compactor
        # never triggers spontaneous compaction during the
        # benchmark — the test owns compaction timing
        # explicitly via `ensure_compacted` (SRD-75) which
        # fires `forceKeyspaceCompaction` and polls for
        # `sstables == 1`. Without this, background
        # compactions could run mid-rampup and shift the
        # workload's measured throughput / recall metrics
        # in non-reproducible ways.

      create_vector_index:
        # Every SAI vector-index build knob is emitted here. Values
        # come from the workload's `params:` block (documented
        # defaults) and may be shadowed by scenario-tree `set:`
        # nodes for sweep workloads. Keeping the schema explicit
        # (rather than relying on cndb's build-path defaults for
        # alpha / neighborhood_overflow) makes runs reproducible
        # across cluster versions — see SRD-72 §"Schema phase
        # extension" and the per-knob comments in `params:`.
        raw: |
          CREATE CUSTOM INDEX IF NOT EXISTS {table}{vector_idx_suffix}
          ON {keyspace}.{table} (value)
          USING 'StorageAttachedIndex'
          WITH OPTIONS = {
            'similarity_function': '{similarity_function}',
            'source_model': '{source_model}',
            'maximum_node_connections': '{maximum_node_connections}',
            'construction_beam_width': '{construction_beam_width}',
            'enable_hierarchy': '{enable_hierarchy}',
            'neighborhood_overflow': '{neighborhood_overflow}',
            'alpha': '{alpha}'
          }
      create_metadata_index:
        raw: |
          CREATE CUSTOM INDEX IF NOT EXISTS {table}{meta_idx_suffix}
          ON {keyspace}.{table} (metadata) USING 'StorageAttachedIndex'

  # Anti-DDL: tear down in reverse order (indexes → table).
  # Keyspace left intact (shared across tests).
  #
  # Per-statement timeout floor (SRD-73): teardown ops on heavily-
  # populated SAI indexes routinely take tens of seconds, and the
  # extreme corners (large source models with full row counts)
  # can exceed the session-level default. Bind `request_timeout_ms`
  # in this phase's scope at 5 minutes so every DROP statement
  # under this teardown phase gets the long timeout. The CQL
  # adapter's dispenser-initializer reads this from the Polydat scope
  # via the universal-field lookup (no reaching around GK) and
  # builds a per-statement modifier captured into the dispenser
  # at map_op time. Hot path is unchanged.
  # ── Cluster tuning ───────────────────────────────────────────
  #
  # Boost Cassandra's compaction parallelism + throughput at
  # session start so the per-cell compactions kicked off by
  # `ensure_compacted` / `jolokia_compact` aren't artificially
  # throttled by the per-node defaults (typically
  # `CompactionThroughputMbPerSec = 64` / `ConcurrentCompactors
  # = 2`, sized for steady-state production not for the
  # back-to-back compact-then-measure cycles a benchmark
  # workload generates).
  #
  # MBean: org.apache.cassandra.db:type=StorageService
  # Attributes written:
  #   CompactionThroughputMbPerSec — `0` is the canonical
  #     "no rate limit" sentinel in Cassandra; the
  #     CompactionExecutor will use the disk as fast as it
  #     can run.
  #   ConcurrentCompactors — `10` raises the per-node
  #     compaction-thread pool well above the steady-state
  #     default so a freshly-rampup'd table's flush + major
  #     compaction can proceed in parallel with the SAI
  #     index rebuild.
  #
  # Both attributes are JMX-writable (verified via Jolokia
  # `list` against StorageService/attr) and take effect for
  # the lifetime of the node — there's no per-keyspace
  # variant. The phase asserts `status == 200` on each
  # response so a JMX failure (auth, MBean unavailable, type
  # mismatch) surfaces as a phase error rather than being
  # silently swallowed. Jolokia's write response shape is
  # `{ value: <prior_value>, status: 200, ... }` — `value`
  # is the OLD value of the attribute, not the new one. We
  # don't assert anything about `value` because the prior
  # number depends on cluster history.
  tune_cluster:
    adapter: http
    concurrency: 1
    cycles: 1
    ops:
      set_compaction_throughput:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"write",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "attribute":"CompactionThroughputMbPerSec",
           "value":0}
        request_timeout_ms: 10000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "tuning: CompactionThroughputMbPerSec → 0 (unlimited)"
          after:  "tuned: CompactionThroughputMbPerSec → 0 (unlimited)"
      set_concurrent_compactors:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"write",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "attribute":"ConcurrentCompactors",
           "value":10}
        request_timeout_ms: 10000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "tuning: ConcurrentCompactors → 10"
          after:  "tuned: ConcurrentCompactors → 10"

  teardown:
    concurrency: 1
    bindings: |
      const request_timeout_ms := 300000
    ops:
      drop_metadata_index:
        raw: "DROP INDEX IF EXISTS {keyspace}.{table}{meta_idx_suffix}"
      drop_vector_index:
        raw: "DROP INDEX IF EXISTS {keyspace}.{table}{vector_idx_suffix}"
      drop_table:
        raw: "DROP TABLE IF EXISTS {keyspace}.{table}"

  # Trigger a memtable flush for {keyspace} via the Jolokia
  # JMX/HTTP bridge. Cassandra's `is_building=true → false`
  # signal (used by `await_index`) fires before the data has
  # been pushed to disk; until a flush happens, the SAI index
  # lives entirely in the memtable and `sai_sstable_indexes`
  # returns zero rows. Running this between rampup and the
  # query phases guarantees there's at least one on-disk
  # SSTable for the SAI index to anchor on, so the subsequent
  # `await_compaction` poll on `count == 1` actually sees the
  # state it's waiting for.
  #
  # MBean: org.apache.cassandra.db:type=StorageService
  # Operation:
  #   forceKeyspaceFlush(String keyspaceName, String[] tableNames)
  #
  # This Cassandra build requires the two-arg signature
  # (`String, String[]`); the GET-URL form can't express the
  # array argument cleanly, so we POST a JSON exec envelope
  # with an empty `[]` tables list (= flush the entire
  # keyspace).
  #
  # Jolokia ALWAYS returns HTTP 200 — the JMX call's outcome
  # lives in the response body's `status` field. The verify
  # block below asserts `status == 200` so a JMX-side error
  # (mistyped keyspace, missing MBean, permission failure)
  # surfaces as a phase error instead of being silently
  # swallowed.
  ensure_flushed:
    adapter: http
    concurrency: 1
    cycles: 1
    ops:
      flush:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceFlush(java.lang.String,[Ljava.lang.String;)",
           "arguments":["{keyspace}",[]]}
        # `forceKeyspaceFlush` is synchronous — it blocks until
        # every CFS in the keyspace has rolled its memtable to
        # disk. On a freshly-rampup'd table with 1M rows that
        # can take 30-60s while the SAI index segments build
        # alongside; the HTTP client's 30s default trips
        # before the JMX call returns. A 10-minute budget
        # covers any realistic flush time without sacrificing
        # the failure signal for genuine cluster hangs.
        request_timeout_ms: 600000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "flushing keyspace {keyspace}"
          after:  "flushed keyspace {keyspace}"

  # Trigger a major compaction for {keyspace}.{table} via
  # Jolokia. After a flush, multiple SSTables typically exist
  # (one per flushed memtable + any prior segments). The
  # compaction merges them into a single SSTable, which is
  # the steady-state condition `await_compaction` polls for.
  #
  # MBean: org.apache.cassandra.db:type=StorageService
  # Operation:
  #   forceKeyspaceCompaction(boolean splitOutput,
  #                           String keyspaceName,
  #                           String... tableNames)
  # `splitOutput=false` keeps the output as a single SSTable
  # (the whole point of running this).
  #
  # `forceKeyspaceCompaction` is SYNCHRONOUS — the JMX call
  # blocks until the compaction completes. For a 1M-vector
  # table the call can take 20-30 minutes; `timeout_ms` is
  # set high enough to cover that without tripping the
  # adapter's default 30-second client timeout.
  #
  # Same Jolokia 200-in-body assertion as `ensure_flushed` —
  # don't fire and forget. The verify block ensures a JMX
  # failure (after the long wait) still fails the phase.
  jolokia_compact:
    adapter: http
    concurrency: 1
    cycles: 1
    ops:
      compact:
        adapter: http
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceCompaction(boolean,java.lang.String,[Ljava.lang.String;)",
           "arguments":[false,"{keyspace}",["{table}"]]}
        request_timeout_ms: 3600000
        verify:
          - field: status
            eq: "200"
        strict: true
        memo:
          before: "compacting {keyspace}.{table}"
          after:  "compacted {keyspace}.{table}"

  # Poll Jolokia until Cassandra's CompactionManager reports
  # no running compactions. The state lives on the JMX
  # ATTRIBUTE `Compactions` (read-only list of currently-
  # active compaction tasks), NOT an op like `getCompactions`
  # which this Cassandra build doesn't expose. Jolokia
  # wraps the attribute value in `{value: [...], status: 200,
  # ...}`, so the poll uses `json_path: /value` to drill into
  # the array and `await_empty` semantics (default
  # `min_rows=0, max_rows=0`) to wait until the list is
  # empty.
  #
  # Each poll iteration is a short HTTP call — the *loop*
  # is the long-running step. If a new compaction kicks off
  # mid-poll (size-tier triggered by an earlier compaction's
  # output, or a SAI side-effect of the base-table compact),
  # the array becomes non-empty again and the loop keeps
  # waiting. `request_timeout_ms: 10000` caps a single HTTP
  # call (slow JMX, GC pause) so we fail fast and resume on
  # the next interval; `poll.timeout_ms` is the overall
  # loop deadline.
  #
  # Same `status == 200` verify as the trigger phases so a
  # JMX-side failure surfaces as a phase error instead of
  # being silently swallowed.
  jolokia_await_compaction:
    adapter: http
    concurrency: 1
    ops:
      compactions_running:
        adapter: http
        memo:
          before: "awaiting compaction on {keyspace}.{table}"
          after: "compacted {keyspace}.{table}"
        uri: "http://{host}:8778/jolokia/read/org.apache.cassandra.db:type=CompactionManager/Compactions"
        method: GET
        request_timeout_ms: 10000
        verify:
          - field: status
            eq: "200"
        strict: true
        poll:
          mode: await_empty
          interval_ms: 5000
          timeout_ms: 1800000
          max_error_retries: 3
          json_path: "/value"
          metric_name: jolokia_compaction_wait_time_s

  # SRD-75 phase-poll: the synchronizer pattern.
  #
  # Replaces `jolokia_compact + jolokia_await_compaction` with a
  # single phase whose cycle execution is wrapped in a wall-clock
  # loop until the table reaches its target state:
  #
  #   sstables == 1 && active_for_cf == 0 && pending_for_cf == 0
  #
  # Each iteration:
  #   1. `read_table_state` runs a Jolokia bulk-POST that returns
  #      three values from three JMX MBeans in one HTTP round-trip
  #      (LiveSSTableCount, the running-compactions array,
  #      PendingTasksByTableName drilled to {keyspace}/{table}).
  #      The `capture:` block harvests each value through a
  #      JSON-Pointer path; the `:count` suffix on the
  #      Compactions array reduces it to its length so the
  #      predicate can compare to 0.
  #   2. `trigger_compact` fires `forceKeyspaceCompaction(false,
  #      {keyspace}, [{table}])` ONCE at phase init as a
  #      DAEMON op (SRD-79). The JMX call is synchronous on
  #      Cassandra's side — the HTTP response is held until
  #      compaction completes, which is minutes to hours for
  #      a freshly-rampup'd SAI-indexed table. Running it as
  #      a daemon means the fiber stays in scope of the phase
  #      so its failures bubble up, but doesn't gate phase
  #      exit: the phase exits when read_table_state's
  #      predicate flips (sstables == 1 && idle), at which
  #      point the daemon is sent a stop signal and its
  #      in-flight reqwest future drops cleanly. The
  #      cluster-side compaction continues to completion
  #      regardless of whether the HTTP client is still
  #      listening — that's the property that makes
  #      trigger-and-cancel correct.
  #
  #      Jolokia ops do NOT use `on_timeout: accept` —
  #      that modifier turns a request timeout into a benign
  #      empty-body success, which would mask a real cluster
  #      stall and leave the polling layer staring at stale
  #      captures from the prior iteration. The polling
  #      layer's `max_error_retries` budget absorbs transient
  #      blips on read_table_state; daemon errors on
  #      trigger_compact surface via daemon_errors_total +
  #      stop_reason and fail the phase fast.
  #
  # After `read_compaction_progress`'s `metrics:` block, three
  # gauges flow into the metric store per cycle:
  #   compaction_completion_pct
  #   compaction_progress_bytes
  #   compaction_total_bytes
  # Labels = the phase's scope coords (host, keyspace, table,
  # plus every sweep iter-var). The synthesizer phase produces
  # a continuous per-cell record of how compaction landed,
  # with sub-cycle resolution on completion ratio.
  ensure_compacted:
    # CQL is the phase default — the polling read uses
    # `SELECT FROM system_views.sstable_tasks` which routes
    # through the native protocol coordinator, NOT through
    # the JMX surface that the trigger holds. `trigger_compact`
    # overrides back to `adapter: http` per-op so the JMX
    # exec still goes through Jolokia.
    adapter: cql
    concurrency: 1
    cycles: 1
    bindings: |
      # Forwarding bindings let the workload-init validator see
      # the names referenced in metrics + memo (the validator's
      # allow-list is bindings + params + iter-vars; raw
      # captures are visible at runtime but invisible at
      # init-time). Each forwarded wire here is also referenced
      # by a metric below so the closure-binding economy keeps
      # it allocated on the per-op kernel.
      #
      # `pct` is the percent form of the completion ratio.
      # Coerced via if(active_compactions > 0, ..., 0.0) so
      # the gauge + memo stay numeric when no compaction is
      # active (capture is None on the empty-rows case).
      pct            := if(active_compactions > 0, completion_ratio * 100.0, 0.0)
      pending_tasks  := active_compactions
      progress_bytes := progress
      total_bytes    := total
    poll:
      # Predicate: no rows in sstable_tasks for this table
      # of kind 'compaction' = the work is done. We dropped
      # the prior `(sstables == 1) & (idle)` predicate — its
      # `sstables == 1` clause was a redundant assurance that
      # major compaction had merged down to one SSTable, but
      # `active_compactions == 0` already implies that
      # invariant for any cell where the daemon trigger fired
      # successfully.
      #
      # Race acknowledgement: between the daemon dispatching
      # the trigger and Cassandra's CompactionExecutor
      # registering the task in `sstable_tasks`, our first
      # poll iteration can see `active_compactions == 0`
      # for the wrong reason ("not started yet"). For
      # production cells (millions of rows, minutes-to-hours
      # of compaction) this race is benign — the task
      # registers within seconds, well inside the 5s
      # interval. For already-compacted cells the early
      # exit IS correct (no work needed). The sticky-bit
      # `saw_any_compaction` predicate variant is parked
      # for cells where confirmation matters.
      until: "active_compactions == 0"
      interval_ms: 5000
      timeout_ms: 14400000
      max_error_retries: 5
      metric_name: ensure_compacted_wait_time_s
      # SRD-75 `on_timeout: abort` — same rationale as
      # before: a stuck compaction invalidates every
      # downstream query phase, so we trip the global stop
      # signal and unwind the whole scenario.
      on_timeout: abort
    ops:
      read_compaction_progress:
        # CQL virtual-table read. `system_views.sstable_tasks`
        # exposes the live compaction state from the
        # coordinator's perspective — independent of the JMX
        # MBean surface the trigger daemon is blocking. One
        # row per active compaction task; `kind` discriminates
        # `compaction` from `validation`, `index_build`, etc.
        #
        # ALLOW FILTERING because the virtual table doesn't
        # partition on `(keyspace_name, table_name, kind)`.
        # The cost is negligible — virtual tables produce
        # rows on-demand from in-memory state.
        raw: |
          SELECT completion_ratio, progress, total
            FROM system_views.sstable_tasks
           WHERE keyspace_name = '{keyspace}'
             AND table_name   = '{table}'
             AND kind         = 'compaction'
          ALLOW FILTERING
        capture:
          # Row count of the result body's root array.
          # `count_of_subtree` returns array length for an
          # array; with no active task the body is `[]` and
          # active_compactions = 0.
          active_compactions: ":count"
          # First active task's progress columns. Multiple
          # concurrent compactions on the same table would
          # produce additional rows we ignore for telemetry
          # (the predicate still gates on count); typically
          # one row at a time for a forced major.
          completion_ratio:   "/0/completion_ratio"
          progress:           "/0/progress"
          total:              "/0/total"
        # Per-poll-iteration memo. Lands in the activity's
        # memo ArcSwap so the operator-visible status line
        # carries the live completion ratio + byte counters.
        # `after:` runs once the read returns + captures
        # land — the values reflect the JUST-OBSERVED state.
        memo:
          # `active_compactions` is the count of in-flight
          # compaction tasks for this table — the progress
          # columns (pct / progress / total) describe only
          # the FIRST one (`/0/...`). When more than one is
          # in flight (e.g. base-table compaction + an SAI
          # index compaction concurrently), the memo surfaces
          # the count so the operator knows the progress
          # number isn't telling the whole story.
          after: "compacting {keyspace}.{table}: {pct}% complete, {progress_bytes}/{total_bytes} bytes ({pending_tasks} task(s) in flight)"
        # Synthetic gauges over the captured progress columns
        # via their forwarding bindings. Labels = phase scope
        # coords (host, keyspace, table, sweep iter-vars).
        # Each gauge ALSO anchors its wire into the per-op
        # kernel so the memo template above can read it via
        # `ctx.wires` — the kernel's closure-binding economy
        # DCEs unreferenced bindings.
        metrics:
          compaction_completion_pct:  { type: gauge, value: pct }
          compaction_progress_bytes:  { type: gauge, value: progress_bytes }
          compaction_total_bytes:     { type: gauge, value: total_bytes }
          compaction_pending_tasks:   { type: gauge, value: pending_tasks }
        # Per-read timeout. CQL coordinator responses are
        # fast (single-row virtual table) so the budget is
        # mostly a safety net for cluster-side stalls.
        request_timeout_ms: 60000
      trigger_compact:
        # Per-op adapter override: the phase default is `cql`
        # (for the polling `read_compaction_progress` via
        # `system_views.sstable_tasks`), but the trigger is a
        # JMX exec that needs the http/jolokia path. Both
        # ops live in the same phase; per-op `adapter:`
        # routes each to its right driver.
        adapter: http
        # Fire-once daemon op (SRD-79) using the dispatch-
        # confirmation pattern.
        #
        # Cassandra has no async compaction MBean — every
        # variant of `forceKeyspaceCompaction` /
        # `forceUserDefinedCompaction` blocks the HTTP
        # response until the compaction itself completes (the
        # `*Async` suffix appears on `repairAsync` and
        # `bulkLoadAsync`, but no `compactAsync` exists; see
        # StorageServiceMBean.java in apache/cassandra).
        # Holding an HTTP socket open for the minutes-to-
        # hours of a SAI-index compaction is unworkable: it
        # ties up a Jolokia thread, holds JMX state, and
        # blocks our daemon's reqwest future for the entire
        # compaction.
        #
        # Resolution: combine `daemon: true` with a 5s
        # `request_timeout_ms` and `on_timeout: accept`. The
        # daemon fires the JMX call; reqwest's request
        # timeout fires after 5s; `on_timeout: accept`
        # translates that timeout into `Ok(body=None)`; the
        # daemon returns `DaemonExit::Completed` cleanly.
        # Critically, Cassandra's compaction work continues
        # server-side regardless of whether the HTTP client
        # is still listening — closing the socket doesn't
        # interrupt the JMX thread. `read_table_state` polls
        # the now-progressing compaction's MBean attributes
        # until the predicate flips. The 5s timeout IS the
        # dispatch-confirmation signal.
        #
        # Why daemon rather than a plain cycle-pool op: the
        # daemon stays in scope of the phase for the
        # duration. Genuine pre-dispatch failures (connection
        # refused, Jolokia 5xx) surface as
        # `DaemonExit::Errored` → `daemon_errors_total` +
        # `stop_reason`, failing the phase fast. A cycle-pool
        # op with the same shape would either block the
        # cycle-pool (defeating the trigger-and-observe
        # pattern) or get re-dispatched on every poll
        # iteration.
        daemon: true
        request_timeout_ms: 5000
        on_timeout: accept
        # Default `daemon_cancel_grace_ms` (5s) is irrelevant
        # here in practice — the daemon completes naturally
        # via the accepted timeout long before the phase
        # exits, so the cancel path isn't exercised. The
        # field is still available if the workload-author
        # wants to override pool defaults for a different
        # daemon op.
        uri: "http://{host}:8778/jolokia/"
        method: POST
        body: |
          {"type":"exec",
           "mbean":"org.apache.cassandra.db:type=StorageService",
           "operation":"forceKeyspaceCompaction(boolean,java.lang.String,[Ljava.lang.String;)",
           "arguments":[false,"{keyspace}",["{table}"]]}
        # No `if:` — the daemon fires exactly once at phase
        # init. The previous if-guard
        # `(sstables > 1 & active == 0 & pending == 0)` was
        # there to debounce repeated triggers across poll
        # iterations; daemon semantics make that moot.
        #
        # No `verify` / `strict` here — the daemon's success
        # is judged by the read_table_state predicate, not by
        # the trigger's response code. With `on_timeout:
        # accept` the body will frequently be None (we
        # accepted the dispatch-confirmation timeout), and a
        # verify clause would fail on the absent body.

  rampup:
    concurrency: "{concurrency}"
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      cursor row = range(0, vector_count(prebuffered))
      id := format_u64(row, 10)
      train_vector := vector_at(prebuffered, row)
    ops:
      insert:
        max_batch_size: 64KB
        batchtype: unlogged
        prepared: |
          INSERT INTO {keyspace}.{table} 
                 ( key,    value) 
          VALUES ( '{id}', {train_vector})
  # Filtered-KNN rampup: includes metadata column for predicate filtering.
  #
  # `errors: "count,retry"` — log a counter for each error class
  # (no stop) and mark the op retryable so the executor reissues
  # it. Bulk-insert workloads regularly trip transient cluster-
  # side timeouts (`SERVER_WRITE_TIMEOUT` etc.) under sustained
  # load; we want the rampup to ride through those instead of
  # halting the phase the first time the cluster catches its
  # breath. Same chain shape as `pvs_*_query` phases use further
  # down, with `retry` added so failed inserts don't leave gaps
  # in the loaded data that would later corrupt recall numbers.
  fknn_rampup_data:
    concurrency: "{concurrency}"
    errors: "count,retry"
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      cursor row = range(0, vector_count(prebuffered))
      id := format_u64(row, 10)
      train_vector := vector_at(prebuffered, row)
      meta := metadata_value_at(prebuffered, row)
    ops:
      insert:
        max_batch_size: 64KB
        batchtype: unlogged
        prepared: |
          INSERT INTO {keyspace}.{table}
          (  key,    value,          metadata) VALUES
          (  '{id}', {train_vector}, {meta:*})

  # ── Search (parameterized by {table}, {dataset}:{profile}, {k}) ────────────

  ann_query:
    concurrency: "{query_concurrency}"
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      const base := query_count(prebuffered)
      # Extending cursor: dispatch one full `base`-sized pass
      # through the prebuffered query set, then keep extending
      # by another `base` each time the cursor reaches its end
      # — until min_query_ms of wall-clock time has elapsed
      # since phase start. The policy stops at the next
      # whole-pass boundary, so each phase always runs an
      # integer number of complete passes (no partial sweep
      # of the query set).
      cursor q = until_elapsed(base, min_query_ms)
      query_vector := query_vector_at(prebuffered, q % base)
      ground_truth := neighbor_indices_at(prebuffered, q % base)
      # Construction-time-folded per-query ANN options clause.
      # `select_str` + `str_eq` evaluate once at scope-init using
      # the workload-param-or-iter-var `rerank_mode` and the
      # current `limit` iter-var; the result is baked into a
      # `final` constant that the prepared-statement structural
      # resolver inlines at op-template construction. `default` →
      # empty clause; `pinned` → explicit `WITH ann_options` that
      # pins `rerank_k` to LIMIT and disables pruning so the
      # planner stays on approximate HNSW instead of switching to
      # brute force (see `local/brute_force.md`).
      const ann_opts := select_str(str_eq(rerank_mode, "pinned"),
                                   "WITH ann_options = {{'rerank_k': '{limit}', 'use_pruning': 'false'}}",
                                   "")

    ops:
      select_ann:
        prepared: |
          SELECT [key] FROM {keyspace}.{table}
          ORDER BY value
          ANN OF {query_vector}
          LIMIT {limit}
          {ann_opts}
        # `count` is the result-body row count (a magic extern in
        # the closure-binding economy). Referencing it directly
        # from `value:` is enough — the metrics use-site walker
        # forces the `count` input slot to be allocated on the
        # op-template kernel, and the metrics wrapper reads it via
        # ctx.wires.get fresh on every cycle.
        metrics:
          rows_per_op:
            kind: gauge
            value: count
        evaluations:
          relevancy:
            actual: key
            # Bare wire-name — the evaluator reads `ground_truth`
            # via ctx.wires.get with no string round-trip; the
            # typed Value (VecI32 / VecF32 / Str) flows directly
            # to the recall computation. Legacy `"{ground_truth}"`
            # text-template form still works (braces are stripped
            # at wrap-time) but the bare form is canonical.q
            expected: ground_truth
            # Bare wire-names — same one-shot wrap-time resolution
            # as the legacy "{k}" / "{limit}" text-template form.
            k: k
            r: limit
            functions:
              - recall

  pvs_metadata_query:
    concurrency: "{query_concurrency}"
    errors: count
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      const query_counts := query_count(prebuffered)
      # Extending cursor: keep dispatching `query_counts`-sized
      # passes through the prebuffered query set until
      # min_query_ms of wall-clock time has elapsed (≥ 30 s by
      # default). Stops at the next whole-pass boundary so the
      # phase always runs an integer number of complete sweeps.
      cursor q = until_elapsed(query_counts, min_query_ms)
      predicate := predicate_value_at(prebuffered, q % query_counts)
      # Construction-time-folded per-query ANN options. See the
      # `ann_query` phase above for the rationale.
      const ann_opts := select_str(str_eq(rerank_mode, "pinned"),
                                   "WITH ann_options = {{'rerank_k': '{limit}', 'use_pruning': 'false'}}",
                                   "")
    ops:
      select_ann:
        # LIMIT {limit} (search depth) rather than LIMIT {k}
        # (recall cutoff). With a server that *post-filters* SAI
        # ANN+WHERE, the wider candidate set lets a larger
        # fraction of true neighbours survive the metadata
        # predicate; with a server that *pre-filters*, the LIMIT
        # is irrelevant to recall and this match the standard
        # "search depth ≥ k" recall-measurement convention. The
        # relevancy below truncates back to k via `r=limit`.
        prepared: |
          SELECT key FROM {keyspace}.{table}
          WHERE metadata = {predicate}
          LIMIT {limit}
          {ann_opts}

  pvs_query:
    concurrency: "{query_concurrency}"
    errors: count
    bindings: |
      const prebuffered := dataset_prebuffer("{dataset}:{profile}")
      const query_counts := query_count(prebuffered)
      # Extending cursor: keep dispatching `query_counts`-sized
      # passes through the prebuffered query set until
      # min_query_ms of wall-clock time has elapsed (≥ 30 s by
      # default). Stops at the next whole-pass boundary so the
      # phase always runs an integer number of complete sweeps.
      cursor q = until_elapsed(query_counts, min_query_ms)
      query_vector := query_vector_at(prebuffered, q % query_counts)
      predicate := predicate_value_at(prebuffered, q % query_counts)
      ground_truth := filtered_neighbor_indices_at(prebuffered, q % query_counts)
      # Construction-time-folded per-query ANN options. See the
      # `ann_query` phase above for the rationale.
      const ann_opts := select_str(str_eq(rerank_mode, "pinned"),
                                   "WITH ann_options = {{'rerank_k': '{limit}', 'use_pruning': 'false'}}",
                                   "")

    ops:
      select_ann:
        # LIMIT {limit} (search depth) rather than LIMIT {k}
        # (recall cutoff). With a server that *post-filters* SAI
        # ANN+WHERE, the wider candidate set lets a larger
        # fraction of true neighbours survive the metadata
        # predicate; with a server that *pre-filters*, the LIMIT
        # is irrelevant to recall and this match the standard
        # "search depth ≥ k" recall-measurement convention. The
        # relevancy below truncates back to k via `r=limit`.
        prepared: |
          SELECT key,value FROM {keyspace}.{table}
          WHERE metadata = {predicate}
          ORDER BY value
          ANN OF {query_vector} LIMIT {limit}
          {ann_opts}
        # Same direct-reference pattern as ann_query — no
        # throw-away result-binding needed.
        metrics:
          rows_per_op:
            kind: gauge
            value: count
        evaluations:
          relevancy:
            actual: key
            # Bare wire-name — the evaluator reads `ground_truth`
            # via ctx.wires.get with no string round-trip; the
            # typed Value (VecI32 / VecF32 / Str) flows directly
            # to the recall computation. Legacy `"{ground_truth}"`
            # text-template form still works (braces are stripped
            # at wrap-time) but the bare form is canonical.
            expected: ground_truth
            # Bare wire-names — same one-shot wrap-time resolution
            # as the legacy "{k}" / "{limit}" text-template form.
            k: k
            r: limit
            functions:
              - recall



