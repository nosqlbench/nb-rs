[package]
name = "nbrs-adapter-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP adapter for nb-rs: executes workload operations as HTTP requests"
keywords = ["nosqlbench", "workload", "benchmark", "http"]
categories = ["command-line-utilities", "web-programming::http-client"]
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
nbrs-activity = { path = "../../nbrs-activity", version = "0.1.1", default-features = false }
nbrs-variates = { path = "../../nbrs-variates", version = "0.1.1" }
nbrs-workload = { path = "../../nbrs-workload", version = "0.1.1" }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
inventory = "0.3.24"
