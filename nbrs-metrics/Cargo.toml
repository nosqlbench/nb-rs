[package]
name = "nbrs-metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Metrics collection and reporting for nb-rs"
keywords = ["nosqlbench", "workload", "benchmark", "data-generation"]
categories = ["command-line-utilities", "simulation"]
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
hdrhistogram = "7"
tokio = { version = "1", features = ["sync", "time"] }
futures = "0.3"
# Lock-free metrics consolidation lifecycle (SRD-42):
# crossbeam-channel for non-blocking command queue from many writers
# (every phase boundary calls ingest/close_path) to a single owner
# thread; arc-swap for lock-free atomic snapshot publication so
# readers (TUI, metrics queries) never block the consolidator.
crossbeam-channel = "0.5"
arc-swap = "1"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
regex = { version = "1", optional = true }
reqwest = { version = "0.12", features = ["blocking"], optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[features]
default = []
sqlite = ["dep:rusqlite", "dep:regex"]
victoriametrics = ["dep:reqwest"]
all-reporters = ["sqlite", "victoriametrics", "dep:base64"]

[[bench]]
name = "instruments"
harness = false

[[bench]]
name = "cadence_layout"
harness = false
